<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZINI DROP — Майнинг</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,Arial,sans-serif; background:#12141c; color:#fff; min-height:100vh; }
  .wrap { max-width:480px; margin:0 auto; padding:16px; padding-bottom:80px; }
  header { display:flex; justify-content:space-between; align-items:center; padding:12px 16px; background:#1c1f2b; border-radius:14px; margin-bottom:14px; }
  .coins { font-size:22px; font-weight:700; color:#ffd84d; }
  .coins small { font-size:12px; color:#888; font-weight:400; }
  .rate { font-size:12px; color:#4dd964; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; }
  .tabs button { flex:1; padding:12px; border:none; border-radius:12px; background:#1c1f2b; color:#888; font-weight:600; font-size:14px; }
  .tabs button.active { background:#ffd84d; color:#12141c; }
  .miner-card { background:#1c1f2b; border-radius:14px; padding:14px; margin-bottom:10px; }
  .miner-top { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; }
  .miner-name { font-weight:700; font-size:16px; }
  .miner-count { font-size:12px; color:#888; }
  .miner-rate { font-size:13px; color:#4dd964; margin-bottom:10px; }
  .btns { display:flex; gap:8px; }
  .btns button { flex:1; padding:11px; border:none; border-radius:10px; font-weight:700; font-size:13px; }
  .buy { background:#ffd84d; color:#12141c; }
  .upg { background:#2a2e40; color:#ffd84d; }
  .btns button:disabled { opacity:.4; }
  #popup { position:fixed; left:50%; bottom:90px; transform:translateX(-50%); background:#ffd84d; color:#12141c; padding:12px 18px; border-radius:12px; font-weight:600; font-size:14px; opacity:0; transition:.3s; pointer-events:none; z-index:99; white-space:nowrap; }
  #popup.show { opacity:1; }
  .locked { text-align:center; color:#666; padding:40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="coins"><span id="coins">0</span> <small>монет</small></div>
    <div class="rate">+<span id="rate">0</span>/сек</div>
  </header>
  <div class="tabs">
    <button class="active" id="tab-farm" onclick="switchTab('farm')">⛏ Ферма</button>
    <button id="tab-cases" onclick="switchTab('cases')">📦 Кейсы</button>
  </div>
  <div id="farm"></div>
  <div id="cases" style="display:none">
    <div class="locked">Кейсы вернутся сюда в следующем обновлении.<br>Ферма уже приносит монеты!</div>
  </div>
</div>
<div id="popup"></div>

<script>
// ===== КОНФИГ МАЙНЕРОВ =====
const MINERS = [
  { id:'basic',   name:'⛏ Базовый майнер', cost:100,    rate:1   },
  { id:'pro',     name:'⚙ Про майнер',     cost:900,    rate:8   },
  { id:'turbo',   name:'🚀 Турбо-майнер',  cost:8000,   rate:60  },
  { id:'quantum', name:'💎 Квантовый',     cost:60000,  rate:400 },
];
const OFFLINE_CAP_HOURS = 8;

// ===== СОСТОЯНИЕ =====
let state = JSON.parse(localStorage.getItem('zini_farm') || 'null') || {
  coins: 50,          // стартовые монеты
  miners: {},
  upgrades: {},
  lastSeen: Date.now()
};

function save() {
  state.lastSeen = Date.now();
  localStorage.setItem('zini_farm', JSON.stringify(state));
}

// ===== РАСЧЁТ ДОХОДА =====
function totalRate() {
  return MINERS.reduce((s, m) => {
    const cnt = state.miners[m.id] || 0;
    const lvl = state.upgrades[m.id] || 0;
    return s + m.rate * cnt * (1 + lvl * 0.2);
  }, 0);
}

// ===== ОФЛАЙН-НАЧИСЛЕНИЕ =====
function collectOffline() {
  const now = Date.now();
  const secs = Math.min((now - state.lastSeen) / 1000, OFFLINE_CAP_HOURS * 3600);
  const earned = Math.floor(totalRate() * secs);
  if (earned >= 1) {
    state.coins += earned;
    if (secs > 60 && earned >= 10) popup(`Пока вас не было, добыто +${earned} монет!`);
  }
}

// ===== ВСПЛЫВАШКА =====
let popupTimer;
function popup(text) {
  const p = document.getElementById('popup');
  p.textContent = text;
  p.classList.add('show');
  clearTimeout(popupTimer);
  popupTimer = setTimeout(() => p.classList.remove('show'), 2200);
}

// ===== ПОКУПКА (защита от минуса) =====
function buyMiner(id) {
  const m = MINERS.find(x => x.id === id);
  if (state.coins < m.cost) { popup('Недостаточно монет!'); return; }
  state.coins -= m.cost;
  state.miners[id] = (state.miners[id] || 0) + 1;
  save(); render();
}

// ===== АПГРЕЙД =====
function upgradeCost(id) {
  const m = MINERS.find(x => x.id === id);
  return Math.floor(m.cost * 0.5 * Math.pow(1.5, state.upgrades[id] || 0));
}
function upgradeMiner(id) {
  const cost = upgradeCost(id);
  if (state.coins < cost) { popup('Недостаточно монет для апгрейда!'); return; }
  state.coins -= cost;
  state.upgrades[id] = (state.upgrades[id] || 0) + 1;
  save(); render();
}

// ===== ОТРИСОВКА =====
function fmt(n) {
  return n >= 1e6 ? (n/1e6).toFixed(1)+'M' : n >= 1e3 ? (n/1e3).toFixed(1)+'K' : Math.floor(n);
}
function render() {
  document.getElementById('coins').textContent = fmt(state.coins);
  document.getElementById('rate').textContent = fmt(totalRate());
  document.getElementById('farm').innerHTML = MINERS.map(m => {
    const cnt = state.miners[m.id] || 0;
    const lvl = state.upgrades[m.id] || 0;
    const uc = upgradeCost(m.id);
    return `
    <div class="miner-card">
      <div class="miner-top">
        <div class="miner-name">${m.name}</div>
        <div class="miner-count">куплено: ${cnt} • ур.${lvl}</div>
      </div>
      <div class="miner-rate">${m.rate} монет/сек${cnt ? ` • всего: ${fmt(m.rate*cnt*(1+lvl*0.2))}/сек` : ''}</div>
      <div class="btns">
        <button class="buy" ${state.coins < m.cost ? 'disabled' : ''} onclick="buyMiner('${m.id}')">Купить — ${fmt(m.cost)}</button>
        <button class="upg" ${state.coins < uc || cnt === 0 ? 'disabled' : ''} onclick="upgradeMiner('${m.id}')">Апгрейд — ${fmt(uc)}</button>
      </div>
    </div>`;
  }).join('');
}
function switchTab(tab) {
  document.getElementById('farm').style.display  = tab === 'farm'  ? '' : 'none';
  document.getElementById('cases').style.display = tab === 'cases' ? '' : 'none';
  document.getElementById('tab-farm').classList.toggle('active', tab === 'farm');
  document.getElementById('tab-cases').classList.toggle('active', tab === 'cases');
}

// ===== ЗАПУСК =====
collectOffline();
render();
setInterval(() => { state.coins += totalRate(); render(); }, 1000);
setInterval(save, 10000);
window.addEventListener('beforeunload', save);
</script>
</body>
</html>
