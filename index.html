<!DOCTYPE html>
<html lang="ru">
<head>

    .grid2 {

    .tile {
      border-radius: 18px;
      padding: 18px 14px;
      cursor: pointer;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.14);
      text-align: center;
      transition: transform 0.1s ease;
    }
    .tile:active {
      transform: scale(0.96);
    }
    .tile small {
      display: block;
      margin-top: 6px;
      color: #9fc3ff;
      font-size: 12px;
    }
    .ic {
      width: 50px;
      height: 50px;
      object-fit: contain;
      display: block;
      margin: 0 auto 10px auto;
    }
    .back {
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: white;
      border-radius: 12px;
      padding: 8px 12px;
      cursor: pointer;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .withdraw-form {
      padding: 14px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 18px;

    .withdraw-form h3 {
      margin-bottom: 12px;
      font-size: 16px;
    }
    #withdrawAmount {
      width: 100%;
      padding: 10px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.3);

      margin-bottom: 8px;

      border-color: #ffd76e;
    }
    .btn-withdraw {
      width: 100%;
      background: #ff4d4d;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 12px;
      cursor: pointer;
      font-weight: 700;
      font-size: 15px;

/* Анимация открытия кейса */
@keyframes popIn {
  0% { transform: scale(0.8); opacity: 0; }
  50% { transform: scale(1.1); }
  100% { transform: scale(1); opacity: 1; }
}

.case-open-anim {
  animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
}

/* Стили логов */
.log-area {
  margin-top: 12px;
  font-size: 13px;
  line-height: 1.4;
  max-height: 200px;
  overflow-y: auto;
  padding-top: 8px;
  background: rgba(255,255,255,0.06);
  border-top: 1px solid rgba(255,255,255,0.1);
}

.log-area div {
  padding: 10px;
  border-radius: 12px;
  background: rgba(255,255,255,0.1);
  margin-bottom: 4px;
  color: #eaf2ff;
}

/* Оверлей дропа */
.drop-overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(255,255,255,0.1);
  display: none;
  justify-content: center;
  align-items: center;
}

.drop-overlay.active {
  display: flex;
  animation: fadeIn 0.2s ease-out;
}

@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

// Сохранение состояния в localStorage
function saveState() {
  localStorage.setItem('balance', balance);
  localStorage.setItem('casesOpened', casesOpened);
  localStorage.setItem('bestPrize', bestPrize);
}

function loadState() {
  balance = localStorage.getItem('balance') || 0;
  casesOpened = localStorage.getItem('casesOpened') || 0;
  bestPrize = localStorage.getItem('bestPrize') || '—';
  updateUI();
}

document.addEventListener('DOMContentLoaded', loadState);

// Обновление UI
function updateUI() {
  document.getElementById('balance').textContent = balance;
  document.getElementById('stat-balance').textContent = balance;
  document.getElementById('stat-cases').textContent = casesOpened;
  document.getElementById('stat-best').textContent = bestPrize;
}

// Открытие кейса
function openCase() {
  const cost = 20000;
  if (balance < cost) {
    alert('Недостаточно средств! Нужно 20 000 ₽.');
    return;
  }
  balance -= cost;
  casesOpened++;

  const prizes = [
    { name: 'Копейка', value: 650 },
    { name: 'BMW 3 серии', value: 18000 },
    { name: 'Mercedes S-Class', value: 45000 },
    { name: 'Rolls-Royce', value: 120000 }
  ];
  const prize = prizes[Math.floor(Math.random() * prizes.length)];

  bestPrize = prize.value > parseFloat(bestPrize.replace(/[^0-9]/g, '')) ? prize.value : bestPrize;
  updateUI();

  const tiles = document.querySelectorAll('.tile');
  tiles.forEach(t => t.classList.remove('case-open-anim'));
  tiles[0].classList.add('case-open-anim');

  log(`Открыт кейс: ${prize.name} (${prize.value} ₽)`);
  document.querySelector('.drop-overlay').classList.add('active');
  setTimeout(() => {
    document.querySelector('.drop-overlay').classList.remove('active');
  }, 2000);
}

// Бонус +25 ₽
function bonus() {
  balance += 25;
  updateUI();
  log('+25 ₽ (ежедневный бонус)');
}

// Вывод средств
function processWithdrawal() {
  const input = document.getElementById('withdrawAmount');
  const amount = parseInt(input.value, 10);

  if (!amount || amount <= 0) {
    alert('Введите корректную сумму.');
    return;
  }
  if (amount < 250) {
    alert('Минимальная сумма вывода — 250 ₽.');
    return;
  }
  if (amount > balance) {
    alert('На балансе недостаточно средств.');
    return;
  }

  balance -= amount;
  updateUI();
  input.value = '';
