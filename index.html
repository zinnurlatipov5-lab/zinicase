<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Зимний подарок</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  body {
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1e3a8a 0%, #0b1026 60%) fixed, #0b1026;
    color:#eaf2ff; min-height:100vh; overflow-x:hidden;
  }
  .main-screen {
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    height:100vh;
  }
  .logo {
    font-size:24px; font-weight:800; color:#7cc4ff;
  }
  .balance-chip {
    margin-top:16px;
  }
  .btn {
    padding: 12px 24px;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 800;
    background: linear-gradient(135deg, #4f8cff, #7cc4ff);
    color: #fff;
    box-shadow: 0 6px 20px rgba(79,140,255,.3);
    cursor: pointer;
  }
</style>
</head>
<body>
<div class="main-screen">
  <div class="logo">🎁 Зимний подарок</div>
  <div class="balance-chip">⭐ <span id="balance">0</span></div>
  <div class="btn" onclick="goToCases()">Открыть кейсы →</div>
  <div class="btn" onclick="showWithdraw()">Вывести средства</div>
</div>
<div class="cases-screen" style="display:none;">
  <div class="banner">
    <h2>🎁 Новогодние подарки</h2>
    <p>Откройте подарок из Telegram!</p>
    <button class="btn" onclick="openCase()">Открыть кейс →</button>
  </div>
  <div class="tabs">
    <button class="active" onclick="go('cases')">📦 Подарки</button>
    <button onclick="go('inventory')">🎒 Инвентарь</button>
  </div>
  <div class="page active" id="page-cases">
    <!-- Кейсы будут добавлены здесь -->
  </div>
</div>
<div class="withdraw-screen" id="withdraw-screen" style="display:none;">
  <div class="withdraw-title">Вывод средств</div>
  <div class="withdraw-amount" id="withdraw-amount">Сумма к выводу: 0</div>
  <button class="btn" onclick="withdraw()">Вывести</button>
</div>
<div class="result-wrap" id="result-wrap" style="display:none;">
  <div class="rays"></div>
  <div class="result-glow"></div>
  <div class="big-emoji"></div>
  <div class="r-name" id="r-name"></div>
  <div><span class="r-rare" id="r-rare"></span></div>
  <div class="r-value" id="r-value"></div>
  <div class="r-buttons">
    <button class="btn green" onclick="go('cases')">Открыть ещё</button>
    <button class="btn" onclick="go('inventory')">В инвентарь</button>
  </div>
