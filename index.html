<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Zini Drop</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0d1117; color: #e6edf3;
    min-height: 100vh; padding-bottom: 80px;
  }
  .app { max-width: 480px; margin: 0 auto; padding: 16px; }
  .header { text-align: center; padding: 12px 0 4px; }
  .header h1 { font-size: 26px; font-weight: 800; letter-spacing: 1px; }
  .header .muted { color: #8b949e; font-size: 13px; margin-top: 2px; }
  .stats { display: flex; gap: 10px; margin: 14px 0; }
  .stat {
    flex: 1; background: #161b22; border: 1px solid #21262d;
    border-radius: 14px; padding: 12px 8px; text-align: center;
  }
  .stat .val { font-size: 20px; font-weight: 700; color: #f0b429; }
  .stat .lbl { font-size: 11px; color: #8b949e; margin-top: 3px; }
  .tap-zone {
    width: 220px; height: 220px; margin: 18px auto;
    background: radial-gradient(circle at 35% 30%, #ffd75e, #f0a500 70%);
    border-radius: 50%; display: flex; align-items: center; justify-content: center;
    font-size: 44px; cursor: pointer; user-select: none;
    box-shadow: 0 0 40px rgba(240, 165, 0, .35), inset 0 -6px 12px rgba(0,0,0,.2);
    transition: transform .08s;
  }
  .tap-zone:active { transform: scale(.93); }
  .hint { text-align: center; color: #8b949e; font-size: 13px; margin-top: 10px; }
  .float-num {
    position: fixed; font-size: 20px; font-weight: 700; color: #f0b429;
    pointer-events: none; animation: floatUp .9s ease-out forwards; z-index: 5;
  }
  @keyframes floatUp { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-60px); } }
  .card {
    background: #161b22; border: 1px solid #21262d; border-radius: 14px;
    padding: 14px; margin: 12px 0;
  }
  .card h2 { font-size: 16px; margin-bottom: 10px; }
  .muted { color: #8b949e; font-size: 13px; }
  .lb-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 4px; border-bottom: 1px solid #21262d;
  }
  .lb-row:last-child { border-bottom: none; }
  .lb-rank { width: 30px; text-align: center; font-size: 18px; flex-shrink: 0; }
  .lb-name { flex: 1; font-size: 14px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-name.me { color: #f0b429; font-weight: 700; }
  .lb-val { text-align: right; flex-shrink: 0; }
  .lb-val b { font-size: 14px; }
  .lb-val .muted { font-size: 11px; }
  .lb-me { background: rgba(240, 180, 41, .07); border-radius: 8px; }
  .tabbar {
    position: fixed; bottom: 0; left: 0; right: 0;
    background: #161b22; border-top: 1px solid #21262d;
    display: flex; justify-content: space-around; padding: 8px 0 14px;
  }
  .tab-btn {
    background: none; border: none; color: #8b949e; font-size: 12px;
    display: flex; flex-direction: column; align-items: center; gap: 3px;
    cursor: pointer; padding: 4px 14px;
  }
  .tab-btn .ico { font-size: 20px; }
  .tab-btn.active { color: #f0b429; }
  .page { display: none; }
  .page.active { display: block; }
</style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>⛏️ ZINI DROP</h1>
    <div class="muted" id="hi">Копай монеты каждую неделю!</div>
  </div>

  <div class="page active" id="page-game">
    <div class="stats">
      <div class="stat"><div class="val" id="st-total">0</div><div class="lbl">Всего монет</div></div>
      <div class="stat"><div class="val" id="st-rate">1</div><div class="lbl">За тап</div></div>
    </div>
    <div class="tap-zone" id="tap">⛏️</div>
    <div class="hint">Тапай по кристаллу, чтобы копать монеты!</div>
  </div>

  <div class="page" id="page-lb">
    <div class="card">
      <h2>🏆 Рейтинг игроков</h2>
      <div id="all-top"><div class="muted">Загрузка…</div></div>
    </div>
  </div>

  <div class="page" id="page-contest">
    <div class="card">
      <h2>🎁 Топ недели</h2>
      <div class="muted" style="margin-bottom:8px">Призы: 🥇 100⭐ · 🥈 50⭐ · 🥉 25⭐. Итоги каждое воскресенье!</div>
      <div id="week-top"><div class="muted">Загрузка…</div></div>
    </div>
  </div>
</div>

<div class="tabbar">
  <button class="tab-btn active" onclick="switchTab('game')"><span class="ico">⛏️</span>Игра</button>
  <button class="tab-btn" onclick="switchTab('lb')"><span class="ico">🏆</span>Рейтинг</button>
  <button class="tab-btn" onclick="switchTab('contest')"><span class="ico">🎁</span>Подарки</button>
</div>

<script>
// ================== НАСТРОЙКИ ==================
const SUPABASE_URL    = 'https://clxewmkuntmgtbovrgqk.supabase.co';
const SUPABASE_KEY    = 'sb_publishable_LwCY23gqbFpUpJGhpXTlKQ_anyBHyHX';
const SYNC_WORKER_URL = 'ВСТАВЬ_СЮДА_URL_WORKER';

// ================== ИГРОК (автоматически из Telegram) ==================
const tgUser = window.Telegram?.WebApp?.initDataUnsafe?.user;
const PLAYER_ID   = tgUser?.id ? String(tgUser.id) : 'guest_' + Math.random().toString(36).slice(2, 8);
const PLAYER_NAME = (tgUser?.username || tgUser?.first_name || 'Игрок').slice(0, 20);
if (tgUser?.first_name) document.getElementById('hi').textContent = 'Привет, ' + tgUser.first_name + '! Копай монеты!';

// ================== СОСТОЯНИЕ ИГРЫ ==================
let state = { total: 0 };
try {
  const saved = localStorage.getItem('zini_total_' + PLAYER_ID);
  if (saved) state.total = parseInt(saved) || 0;
} catch (e) {}

function fmt(n) {
  if (n >= 1e9) return (n / 1e9).toFixed(1) + 'B';
  if (n >= 1e6) return (n / 1e6).toFixed(1) + 'M';
  if (n >= 1e3) return (n / 1e3).toFixed(1) + 'K';
  return String(n);
}
function tapRate() { return Math.max(1, Math.floor(Math.sqrt(state.total) / 2) + 1); }

function saveLocal() {
  try { localStorage.setItem('zini_total_' + PLAYER_ID, String(state.total)); } catch (e) {}
}

// ================== ТАП ==================
function clickMine(ev) {
  state.total += tapRate();
  saveLocal();
  updateUI();
  if (ev) {
    const r = document.getElementById('tap').getBoundingClientRect();
    showFloat(ev.clientX || r.left + r.width / 2, ev.clientY || r.top + r.height / 2);
  }
  syncSoon();
}
function showFloat(x, y) {
  const f = document.createElement('div');
  f.className = 'float-num';
  f.textContent = '+' + fmt(tapRate());
  f.style.left = (x - 10) + 'px';
  f.style.top = (y - 30) + 'px';
  document.body.appendChild(f);
  setTimeout(() => f.remove(), 900);
}
document.getElementById('tap').addEventListener('pointerdown', clickMine);

function updateUI() {
  document.getElementById('st-total').textContent = fmt(state.total);
  document.getElementById('st-rate').textContent = fmt(tapRate());
}

// ================== КЛЮЧ НЕДЕЛИ (обнуление в полночь понедельника) ==================
function getWeekKey() {
  const d = new Date();
  const day = (d.getDay() + 6) % 7;
  const monday = new Date(d.getFullYear(), d.getMonth(), d.getDate() - day);
  const p = n => String(n).padStart(2, '0');
  return monday.getFullYear() + '-' + p(monday.getMonth() + 1) + '-' + p(monday.getDate());
}

// ================== ОТПРАВКА РЕЗУЛЬТАТА ЧЕРЕЗ WORKER ==================
let syncTimer = null;
function syncSoon() {
  if (syncTimer) return;
  syncTimer = setTimeout(() => { syncTimer = null; syncToWorker(); }, 10000);
}
async function syncToWorker() {
  if (!SYNC_WORKER_URL.startsWith('http')) return; // воркер ещё не подключён
  try {
    await fetch(SYNC_WORKER_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        player_id: PLAYER_ID,
        name: PLAYER_NAME,
        mined: Math.floor(state.total),
        week_key: getWeekKey()
      })
    });
  } catch (e) { console.error('sync:', e); }
}

// ================== ЧТЕНИЕ ТОПА ИЗ SUPABASE ==================
const API_HEADERS = {
  'apikey': SUPABASE_KEY,
  'Authorization': 'Bearer ' + SUPABASE_KEY
};

async function fetchWeeklyTop() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/weekly_top?week_key=eq.' + getWeekKey() + '&order=mined.desc&limit=10',
      { headers: API_HEADERS }
    );
    if (!res.ok) throw new Error('http ' + res.status);
    const data = await res.json();
    renderList('week-top', data.map(p => ({ id: p.player_id, name: p.name, mined: p.mined })), true);
  } catch (e) {
    document.getElementById('week-top').innerHTML = '<div class="muted" style="text-align:center;padding:14px">Не удалось загрузить топ 😕</div>';
  }
}

async function fetchAllTop() {
  try {
    const res = await fetch(
      SUPABASE_URL + '/rest/v1/weekly_top?select=player_id,name,mined&order=updated_at.desc&limit=500',
      { headers: API_HEADERS }
    );
    if (!res.ok) throw new Error('http ' + res.status);
    const rows = await res.json();
    const agg = {};
    rows.forEach(r => {
      agg[r.player_id] = agg[r.player_id] || { name: r.name, mined: 0 };
      agg[r.player_id].mined += r.mined || 0;
    });
    const list = Object.entries(agg)
      .map(([id, v]) => ({ id, name: v.name, mined: v.mined }))
      .sort((a, b) => b.mined - a.mined)
      .slice(0, 20);
    renderList('all-top', list, false);
  } catch (e) {
    document.getElementById('all-top').innerHTML = '<div class="muted" style="text-align:center;padding:14px">Не удалось загрузить рейтинг 😕</div>';
  }
}

function renderList(elId, rows, isWeekly) {
  const el = document.getElementById(elId);
  if (!el) return;
  if (!rows.length) {
    el.innerHTML = '<div class="muted" style="text-align:center;padding:14px">Пока никто не участвует — станьте первым!</div>';
    return;
  }
  const medals = ['🥇', '🥈', '🥉'];
  const prizes = ['приз 100⭐', 'приз 50⭐', 'приз 25⭐'];
  el.innerHTML = rows.map((r, i) => `
    <div class="lb-row ${r.id === PLAYER_ID ? 'lb-me' : ''}">
      <div class="lb-rank">${medals[i] || (i + 1)}</div>
      <div class="lb-name ${r.id === PLAYER_ID ? 'me' : ''}">${r.id === PLAYER_ID ? '⭐ ' : ''}${escapeHtml(r.name || 'Игрок')}${r.id === PLAYER_ID ? ' (вы)' : ''}</div>
      <div class="lb-val"><b>${fmt(r.mined)}</b>${isWeekly && i < 3 ? '<br><span class="muted">' + prizes[i] + '</span>' : ''}</div>
    </div>`).join('');
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function initBoard() {
  fetchWeeklyTop();
  fetchAllTop();
}

// ================== ВКЛАДКИ ==================
function switchTab(tab) {
  ['game', 'lb', 'contest'].forEach(t => {
    document.getElementById('page-' + t).classList.toggle('active', t === tab);
  });
  document.querySelectorAll('.tab-btn').forEach((b, i) => b.classList.toggle('active', ['game', 'lb', 'contest'][i] === tab));
  if (tab === 'lb' || tab === 'contest') initBoard();
}

// ================== СТАРТ ==================
window.addEventListener('load', () => {
  updateUI();
  initBoard();
  setInterval(fetchWeeklyTop, 5000);
  setInterval(syncToWorker, 60000);
  if (window.Telegram?.WebApp) {
    Telegram.WebApp.ready();
    Telegram.WebApp.expand();
  }
});
</script>
</body>
</html>
