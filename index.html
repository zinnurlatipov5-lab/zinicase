<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Ёлка Зини 🎄 v8.8</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://sad.adsgram.ai/js/sad.min.js"></script>
  <style>
    :root{--bg:#0b1224;--card:rgba(22,30,55,.75);--card2:rgba(35,45,80,.7);--acc:#c6ff5e;--acc2:#4ade80;--mut:#9aa7c7;--red:#ff6b6b;}
    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
    html,body{height:100%;}
    body{display:flex;flex-direction:column;min-height:100%;background:linear-gradient(180deg,#0b1224 0%,#101a35 45%,#1b2a52 100%);color:#fff;font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding:12px 12px 0;overflow-x:hidden;}
    #snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
    .snowflake{position:absolute;top:-4%;background:#fff;border-radius:50%;opacity:.7;animation:fall linear infinite;}
    @keyframes fall{from{transform:translateY(-5vh);}to{transform:translateY(108vh);}}
    header,#ticker-bar,#storm-banner,main,#toast{position:relative;z-index:1;}
    main{flex:1;}

    /* ===== Шапка ===== */
    header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;background:var(--card);border-radius:14px;padding:10px 12px;backdrop-filter:blur(6px);}
    #h-name{font-weight:800;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    #h-right{display:flex;align-items:center;gap:8px;flex:none;}
    #pc-count{font-size:17px;font-weight:800;color:var(--acc);display:flex;align-items:center;gap:5px;}
    #h-level{font-size:12px;color:var(--mut);}
    #h-pass{display:none;font-size:11px;font-weight:800;color:#7dd3fc;border:1px solid rgba(125,211,252,.5);border-radius:8px;padding:2px 7px;}
    #btn-music{width:auto;padding:6px 10px;font-size:15px;border:0;border-radius:10px;background:rgba(10,16,34,.6);color:#fff;cursor:pointer;font-family:inherit;}
    .pine{width:1em;height:1em;vertical-align:-0.12em;flex:none;}

    /* ===== Баннер бури ===== */
    #storm-banner{display:none;margin-bottom:12px;border-radius:12px;background:linear-gradient(135deg,#3a4a7a,#5a3a7a);border:1px solid #8ecfff;padding:10px 12px;font-size:14px;font-weight:700;color:#e0f4ff;animation:stormBlink 1.4s ease-in-out infinite;}
    @keyframes stormBlink{0%,100%{box-shadow:0 0 8px rgba(142,207,255,.3);}50%{box-shadow:0 0 22px rgba(142,207,255,.7);}}

    #ticker-bar{display:flex;align-items:center;border-radius:12px;background:rgba(198,255,94,.07);border:1px solid rgba(198,255,94,.3);overflow:hidden;height:48px;margin-bottom:12px;}
    .ticker-label{flex:none;background:var(--acc);color:#0a0a10;font-size:14px;font-weight:800;padding:0 14px;border-radius:10px;margin:5px;white-space:nowrap;}
    #ticker-track{white-space:nowrap;font-size:15px;font-weight:600;color:var(--acc);padding-right:20px;animation:ticker 30s linear infinite;will-change:transform;}
    @keyframes ticker{from{transform:translateX(0);}to{transform:translateX(-50%);}}

    .screen{display:none;}
    .screen.active{display:block;}

    .tree-stage{text-align:center;background:var(--card);border-radius:16px;padding:20px 12px 16px;margin-bottom:12px;backdrop-filter:blur(6px);position:relative;overflow:hidden;}
    .tree-glow{position:absolute;left:50%;top:46%;width:230px;height:230px;transform:translate(-50%,-50%);background:radial-gradient(circle,rgba(198,255,94,.18),transparent 70%);pointer-events:none;}
    .tree-glow-active{animation:glowPulse 2.6s ease-in-out infinite alternate;}
    @keyframes glowPulse{from{box-shadow:0 0 24px rgba(198,255,94,.35);}to{box-shadow:0 0 60px rgba(198,255,94,.75);}}
    #tree-title{font-weight:800;font-size:18px;color:var(--acc);}
    #tree-sub{font-size:13px;color:var(--mut);margin-top:4px;}
    .ornament-row{display:flex;justify-content:center;gap:8px;min-height:26px;margin-top:10px;flex-wrap:wrap;}
    .orn-dot{text-align:center;font-size:20px;animation:popIn .5s cubic-bezier(.2,1.6,.4,1);}
    @keyframes popIn{from{transform:scale(0);}to{transform:scale(1);}}
    .orn-dot span{display:block;font-size:9px;color:var(--mut);max-width:64px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .gifts-line{font-size:12px;color:var(--mut);margin-top:8px;}
    .streak-line{font-size:13px;color:#ffd75e;text-align:center;margin-top:6px;font-weight:700;}

    /* ===== Ёлка ===== */
    #tv-stage{position:relative;width:230px;height:250px;margin:10px auto 0;cursor:pointer;user-select:none;transition:transform .5s;}
    #tv-stage.shaking{animation:tvShake .5s ease;}
    @keyframes tvShake{0%,100%{transform:rotate(0);}20%{transform:rotate(-4deg);}40%{transform:rotate(4deg);}60%{transform:rotate(-3deg);}80%{transform:rotate(3deg);}}
    #tv-tree{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);line-height:1;transition:font-size .5s;filter:drop-shadow(0 6px 12px rgba(0,0,0,.45));}
    #tv-star{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;z-index:7;display:none;filter:drop-shadow(0 0 12px #ffd75e);cursor:pointer;animation:starFloat 2.6s ease-in-out infinite;}
    @keyframes starFloat{0%,100%{transform:translateX(-50%) translateY(0);}50%{transform:translateX(-50%) translateY(-7px);}}
    #tv-orns span{position:absolute;font-size:21px;z-index:6;transform:translate(-50%,-50%);animation:popIn .5s cubic-bezier(.2,1.6,.4,1);filter:drop-shadow(0 1px 3px rgba(0,0,0,.55));}
    #tv-garland i{position:absolute;width:7px;height:7px;border-radius:50%;z-index:5;transform:translate(-50%,-50%);animation:twinkle 1.4s ease-in-out infinite;}
    @keyframes twinkle{0%,100%{opacity:.25;transform:translate(-50%,-50%) scale(.7);}50%{opacity:1;transform:translate(-50%,-50%) scale(1.35);}}
    .falling-candy{position:fixed;font-size:26px;z-index:98;pointer-events:none;transition:all .9s ease-in;}

    .card{background:var(--card);border-radius:14px;padding:14px;margin-bottom:12px;backdrop-filter:blur(6px);}
    .bar-row{display:flex;align-items:center;gap:8px;margin-bottom:10px;font-size:14px;}
    .bar-row span{flex:none;width:110px;}
    .bar-bg{flex:1;height:12px;background:#2a2a44;border-radius:6px;overflow:hidden;}
    .bar-fill{height:100%;width:0%;background:linear-gradient(90deg,var(--acc2),var(--acc));border-radius:6px;transition:width .4s ease;}
    .bar-fill.snow{background:linear-gradient(90deg,#8ecfff,#e0f4ff);}

    .btn{display:block;width:100%;padding:14px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#0a0a10;font-weight:800;font-size:16px;cursor:pointer;font-family:inherit;}
    .btn:disabled{opacity:.45;}
    .btn.ghost{background:transparent;border:1px solid rgba(198,255,94,.4);color:var(--acc);}
    .btn.blue{background:linear-gradient(135deg,#38bdf8,#818cf8);color:#0a0a10;}
    .btn.gold{background:linear-gradient(135deg,#ffd75e,#ff9f43);color:#0a0a10;animation:btnPulse 1.8s ease-in-out infinite;}
    @keyframes btnPulse{0%,100%{transform:scale(1);}50%{transform:scale(1.03);}}
    .btn-row{display:flex;gap:8px;}
    .btn-row .btn{flex:1;}

    #xp-line{text-align:center;font-size:13px;color:var(--mut);margin-top:10px;}
    h3{margin:4px 0 12px;font-size:18px;}
    .muted{color:var(--mut);font-size:13px;}

    .top-row{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;font-size:14px;}
    .top-row.me{border:1px solid var(--acc);}
    .top-rank{flex:none;width:28px;text-align:center;font-weight:800;}
    .top-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
    .top-val{color:var(--acc);font-weight:700;font-size:14px;flex:none;display:flex;align-items:center;gap:4px;}
    .medal-gold{color:#ffd75e;} .medal-silver{color:#d8e2f0;} .medal-bronze{color:#e8a15c;}

    .inv-item{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:12px;padding:12px;margin-bottom:8px;backdrop-filter:blur(6px);}
    .inv-emoji{font-size:26px;flex:none;}
    .inv-name{flex:1;}
    .inv-name b{display:block;font-size:15px;}
    .inv-count{color:var(--mut);font-size:13px;}
    .r-common{color:#c9c9d4;} .r-rare{color:#4da3ff;} .r-epic{color:#b678ff;} .r-legendary{color:#ffd75e;} .r-mythic{color:#ff7ad9;} .r-pass{color:#7dd3fc;}

    /* ===== Меню-«липучка» ===== */
    .tabs{position:sticky;bottom:0;display:flex;background:rgba(20,27,50,.97);border-top:3px solid #3a3a52;border-radius:16px 16px 0 0;margin:8px -12px 0;padding:7px 2px calc(7px + env(safe-area-inset-bottom));z-index:99;box-shadow:0 -6px 20px rgba(0,0,0,.45);}
    .tab{flex:1;background:none;border:0;color:#8b9bc4;font-size:11px;font-weight:800;padding:9px 0 7px;border-radius:12px;cursor:pointer;font-family:inherit;text-align:center;line-height:1.2;margin:0 1px;transition:all .2s ease;}
    .tab .tab-icon{display:block;font-size:21px;margin-bottom:2px;}
    .tab.active{color:var(--acc);background:rgba(198,255,94,.16);box-shadow:0 0 18px rgba(198,255,94,.35);border:1px solid rgba(198,255,94,.4);}

    #toast{position:sticky;bottom:96px;left:0;margin:0 auto;width:max-content;max-width:90%;background:#22223a;border:1px solid var(--acc);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;display:none;z-index:98;text-align:center;}
    #guest-note{background:#3a2a12;border:1px solid #ffb020;color:#ffd75e;border-radius:10px;padding:10px;font-size:13px;margin-bottom:12px;display:none;}

    .game-area{position:relative;
