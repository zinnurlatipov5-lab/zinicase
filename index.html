<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АвтоКейсы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f0f0;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .page {
            background: #fff;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .btn-back {
            background: transparent;
            color: #aaa;
            border: 1px solid #333;
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            margin-bottom: 12px;
            transition: 0.2s;
        }

        .btn-back:hover {
            background: #222;
            color: #fff;
            border-color: #555;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page active" id="page-cases">
            <button class="btn-back" onclick="switchTab('cases')">← Главная</button>
            <h2>Открыть кейс</h2>
            <button class="bal" style="width:100%; margin-top:16px;">Открыть случай</button>
        </div>

        <div class="page" id="page-bonus">
            <button class="btn-back" onclick="switchTab('cases')">← Главная</button>
            <h2>Ежедневный бонус</h2>
            <p style="color:#aaa; margin-bottom:20px;">+25 ₽ просто за вход</p>
            <button class="bal" id="bonusCard" onclick="claimBonus()">Забрать бонус</button>
        </div>

        <div class="page" id="page-garage">
            <button class="btn-back" onclick="switchTab('cases')">← Главная</button>
            <div class="panel">
                <b style="font-size:18px; display:block; margin-bottom:12px;">Твой гараж</b>
                <div id="garageGrid"></div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(tabName) {
            document.querySelectorAll('.page').forEach(page => page.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            document.querySelectorAll('.btn-back').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`tab-${tabName}`).classList.add('active');
        }
    </script>
</body>
</html>
