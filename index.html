<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>ZINI DROP</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, "Segoe UI", Roboto, sans-serif; }
    body {
      min-height: 100vh;
      background: linear-gradient(160deg, #0a0f2c 0%, #141a4d 60%, #1a1266 100%);
      color: #fff;
      padding: 16px;
      padding-bottom: 120px;
    }
    h1 {
      text-align: center;
      font-size: 28px;
      letter-spacing: 2px;
      background: linear-gradient(90deg, #f7b500, #ffd75e);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 4px;
    }
    .subtitle { text-align: center; font-size: 13px; color: #8f9bd6; margin-bottom: 20px; }

    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 14px;
      backdrop-filter: blur(6px);
    }
    .balance {
      text-align: center;
      font-size: 40px;
      font-weight: 800;
      color: #ffd75e;
      text-shadow: 0 0 20px rgba(247,181,0,0.35);
    }
    .balance-label { text-align: center; font-size: 13px; color: #8f9bd6; margin-top: 4px; }

    .btn {
      display: block;
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      color: #fff;
      cursor: pointer;
      margin-top: 12px;
      transition: transform 0.1s, opacity 0.2s;
    }
    .btn:active { transform: scale(0.97); }
    .btn:disabled { opacity: 0.5; cursor: default; }
    .btn-mine   { background: linear-gradient(90deg, #7b2ff7, #4e54ff); }
    .btn-daily  { background: linear-gradient(90deg, #11998e, #38ef7d); }
    .btn-case   { background: linear-gradient(90deg, #f76b1c, #f7b500); color: #1a1266; }
    .btn-ad     { background: linear-gradient(90deg, #7b2ff7, #f7b500); position: fixed; bottom: 16px; left: 16px; right: 16px; z-index: 9999; box-shadow: 0 6px 20px rgba(123,47,247,0.4); }

    .msg { text-align: center; font-size: 14px; color: #38ef7d; min-height: 18px; margin-top: 10px; }
    .msg.err { color: #ff6b6b; }

    .stats { display: flex; justify-content: space-between; font-size: 13px; color: #8f9bd6; margin-top: 10px; }
    .stats b { color: #fff; }
  </style>
</head>
<body>

  <h1>ZINI DROP</h1>
  <p class="subtitle">майнинг-игра с ежедневными бонусами</p>

  <!-- Баланс -->
  <div class="card">
    <div class="balance" id="balance">0</div>
    <div class="balance-label">звёзд на счету</div>
  </div>

  <!-- Майнинг -->
  <div class="card">
    <div class="stats">
      <span>Хэшрейт: <b id="power">1</b>/сек</span>
      <span>Майнинг: <b id="mined">0</b> ⭐</span>
    </div>
    <button class="btn btn-mine" id="btnMine">⛏ МАЙНИТЬ</button>
    <div class="msg" id="mineMsg"></div>
  </div>

  <!-- Ежедневный бонус -->
  <div class="card">
    <button class="btn btn-daily" id="btnDaily">🎁 Ежедневный бонус</button>
    <div class="msg" id="dailyMsg"></div>
  </div>

  <!-- Кейс -->
  <div class="card">
    <button class="btn btn-case" id="btnCase">📦 Открыть кейс — 10 ⭐</button>
    <div class="msg" id="caseMsg"></div>
  </div>

  <!-- Кнопка рекламы (закреплена внизу экрана) -->
  <button class="btn btn-ad" id="btnAd">🎬 Смотреть рекламу — +5 ⭐</button>

  <script>
  /* ================= ИГРА ZINI DROP ================= */

  var state = {
    stars:  parseInt(localStorage.getItem("zini_stars")  || "0", 10),
    power:  parseInt(localStorage.getItem("zini_power")  || "1", 10),
    mined:  parseInt(localStorage.getItem("zini_mined")  || "0", 10),
    lastDaily: parseInt(localStorage.getItem("zini_lastDaily") || "0", 10)
  };

  var MINE_CLICK  = 1;   // звёзд за одно нажатие «Майнить»
  var DAILY_BONUS = 10;  // ежедневный бонус
  var CASE_COST   = 10;  // цена кейса
  var AD_REWARD   = 5;   // награда за рекламу  <-- меняй тут
  var AD_FAIL_BONUS = 1; // компенсация, если реклама не загрузилась

  var el = function (id) { return document.getElementById(id); };

  function save() {
    localStorage.setItem("zini_stars",     state.stars);
    localStorage.setItem("zini_power",     state.power);
    localStorage.setItem("zini_mined",     state.mined);
    localStorage.setItem("zini_lastDaily", state.lastDaily);
  }

  function render() {
    el("balance").textContent = state.stars;
    el("power").textContent   = state.power;
    el("mined").textContent   = state.mined;
  }

  // Единая функция начисления звёзд — её использует и реклама
  function addStars(n) {
    state.stars += n;
    save();
    render();
  }

  function flash(elId, text, isError) {
    var m = el(elId);
    m.textContent = text;
    m.className = "msg" + (isError ? " err" : "");
    setTimeout(function () { m.textContent = ""; }, 3000);
  }

  /* ---------- Майнинг ---------- */
  el("btnMine").addEventListener("click", function () {
    var gain = MINE_CLICK * state.power;
    addStars(gain);
    state.mined += gain;
    save();
    render();
    flash("mineMsg", "+" + gain + " ⭐ намайнено!");
    // каждые 50 намайненных звёзд — +1 к хэшрейту
    if (state.mined >= state.power * 50) {
      state.power += 1;
      flash("mineMsg", "⚡ Хэшрейт повышен! Теперь " + state.power + "/сек");
    }
  });

  /* ---------- Ежедневный бонус ---------- */
  el("btnDaily").addEventListener("click", function () {
    var now = Date.now();
    var oneDay = 24 * 60 * 60 * 1000;
    if (now - state.lastDaily < oneDay) {
      var hoursLeft = Math.ceil((oneDay - (now - state.lastDaily)) / 3600000);
      flash("dailyMsg", "Бонус будет доступен через " + hoursLeft + " ч.", true);
      return;
    }
    state.lastDaily = now;
    addStars(DAILY_BONUS);
    flash("dailyMsg", "🎁 Бонус получен: +" + DAILY_BONUS + " ⭐!");
  });

  /* ---------- Кейс ---------- */
  el("btnCase").addEventListener("click", function () {
    if (state.stars < CASE_COST) {
      flash("caseMsg", "Не хватает звёзд! Нужно " + CASE_COST + " ⭐", true);
      return;
    }
    state.stars -= CASE_COST; // списание только здесь — минус не возможен, есть проверка выше
    var prize = [1, 2, 5, 10, 20, 50][Math.floor(Math.random() * 6)];
    addStars(prize);
    flash("caseMsg", "📦 В кейсе: +" + prize + " ⭐!");
  });

  /* ============ РЕКЛАМА ADSGRAM (блок 56241) ============ */
  var DEBUG_MODE = true; // пока блок на модерации — true. После одобрения поставь false

  var adController = null;
  try {
    adController = window.Adsgram.init({ blockId: "56241", debug: DEBUG_MODE });
  } catch (e) {
    console.error("AdsGram init error:", e);
  }

  var btnAd = el("btnAd");

  btnAd.addEventListener("click", function () {
    if (!adController) {
      addStars(AD_FAIL_BONUS);
      flash("mineMsg", "Реклама недоступна. +" + AD_FAIL_BONUS + " ⭐", true);
      return;
    }
    btnAd.disabled = true;
    btnAd.textContent = "⏳ Загружаем рекламу...";

    adController.show()
      .then(function () {
        // Ролик досмотрен до конца — начисляем награду
        addStars(AD_REWARD);
        btnAd.textContent = "🎉 Получено +" + AD_REWARD + " ⭐!";
      })
      .catch(function (err) {
        console.error(err);
        // Реклама не показалась — даём небольшую компенсацию
        addStars(AD_FAIL_BONUS);
        btnAd.textContent = "Реклама недоступна, +" + AD_FAIL_BONUS + " ⭐";
      })
      .finally(function () {
        setTimeout(function () {
          btnAd.disabled = false;
          btnAd.textContent = "🎬 Смотреть рекламу — +" + AD_REWARD + " ⭐";
        }, 1500);
      });
  });

  /* ---------- Старт ---------- */
  render();
  </script>
</body>
</html>
