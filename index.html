<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎄 Ёлка Зини v9.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;background:#060d24;color:#eef3ff;min-height:100vh;overflow-x:hidden}
#aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#050b23 0%,#0a1a3f 45%,#132a5e 100%)}
#aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;mix-blend-mode:screen}
#aurora i:nth-child(1){width:95vw;height:36vh;left:-18vw;top:-8vh;background:radial-gradient(ellipse,#1fffa4,transparent 70%);animation:aur1 12s ease-in-out infinite alternate}
#aurora i:nth-child(2){width:85vw;height:30vh;left:28vw;top:0;background:radial-gradient(ellipse,#6a5cff,transparent 70%);animation:aur2 15s ease-in-out infinite alternate}
#aurora i:nth-child(3){width:75vw;height:26vh;left:2vw;top:14vh;background:radial-gradient(ellipse,#ff5ce0,transparent 70%);animation:aur3 18s ease-in-out infinite alternate}
@keyframes aur1{from{transform:translateX(-9vw) skewX(-9deg) scaleY(.7)}to{transform:translateX(15vw) skewX(9deg) scaleY(1.25)}}
@keyframes aur2{from{transform:translateX(10vw) skewX(7deg) scaleY(1.1)}to{transform:translateX(-12vw) skewX(-6deg) scaleY(.75)}}
@keyframes aur3{from{transform:translateX(6vw) skewX(-5deg) scaleY(.8)}to{transform:translateX(-9vw) skewX(8deg) scaleY(1.15)}}
header{position:sticky;top:0;z-index:20;background:rgba(10,20,50,.82);backdrop-filter:blur(8px);padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:#ffd86b;text-shadow:0 0 12px rgba(255,200,60,.6)}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.xpwrap{flex:1;min-width:90px;height:9px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden}
.xpbar{height:100%;width:0;background:linear-gradient(90deg,#ffd86b,#ff8f3f);border-radius:6px;transition:width .4s}
.xplabel{font-size:11px;opacity:.85;min-width:64px;text-align:right}
#gbtn{background:linear-gradient(135deg,#ffd86b,#ff9a3d);border:none;border-radius:14px;color:#402a00;font-weight:800;font-size:15px;padding:6px 12px;cursor:pointer;box-shadow:0 0 14px rgba(255,190,60,.45)}
#gbtn:disabled{filter:grayscale(.7);opacity:.6}
#garland{position:sticky;top:0;z-index:19;display:flex;justify-content:center;gap:6px;padding:6px 0;background:linear-gradient(180deg,rgba(6,13,36,.9),rgba(6,13,36,.55))}
.bulb{width:10px;height:14px;border-radius:50% 50% 60% 60%;animation:blink 1.4s ease-in-out infinite alternate;box-shadow:0 0 9px 2px currentColor}
@keyframes blink{from{opacity:.25;transform:scale(.85)}to{opacity:1;transform:scale(1.08)}}
.ticker{position:relative;z-index:5;overflow:hidden;background:rgba(8,16,44,.75);border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
.ticker-inner{display:inline-block;padding:5px 0;font-size:12.5px;color:#aee6ff;animation:tick 36s linear infinite}
@keyframes tick{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
nav{position:sticky;top:0;z-index:21;display:flex;gap:4px;padding:8px 8px 10px;overflow-x:auto;background:linear-gradient(180deg,rgba(5,11,35,.95),rgba(5,11,35,.7))}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#dfe8ff;border-radius:16px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#2ee38b,#12a06a);color:#032015;border-color:transparent;box-shadow:0 0 16px rgba(46,227,139,.4)}
main{position:relative;z-index:5;max-width:640px;margin:0 auto;padding:12px 12px 90px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card h3{margin:0 0 8px;font-size:16px;color:#ffd86b}
.btn{background:linear-gradient(135deg,#2ee38b,#12a06a);border:none;color:#032015;font-weight:800;font-size:14px;border-radius:14px;padding:11px 16px;cursor:pointer;width:100%}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#ffd86b,#ff9a3d);color:#402a00}
.btn.blue{background:linear-gradient(135deg,#59a6ff,#2f5fe0);color:#eaf3ff}
.btn.red{background:linear-gradient(135deg,#ff6b6b,#d03a3a);color:#fff}
.btn:disabled{filter:grayscale(.75);opacity:.55}
.small{font-size:12px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:8px}
.slot{aspect-ratio:1;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;border:2px dashed rgba(255,255,255,.25);background:rgba(255,255,255,.05);font-size:34px;position:relative;overflow:hidden}
.slot.filled{border-style:solid;border-color:rgba(255,216,107,.55);background:radial-gradient(circle,rgba(255,216,107,.14),rgba(255,255,255,.04));animation:hangin .45s ease}
@keyframes hangin{from{transform:scale(.5) rotate(-14deg);opacity:0}to{transform:none;opacity:1}}
.slot .nm{font-size:9.5px;text-align:center;line-height:1.15;margin-top:2px;color:#dfe8ff;padding:0 2px}
.slot .rem{position:absolute;bottom:3px;right:3px;background:#ff5f5f;border:none;border-radius:9px;font-size:10px;color:#fff;padding:3px 6px;font-weight:800;cursor:pointer}
#treeWrap{position:relative;text-align:center}
#treeTop{font-size:46px;filter:drop-shadow(0 0 10px #ffd86b)}
#spark{position:absolute;font-size:30px;cursor:pointer;animation:sparkfloat 2.4s ease-in-out infinite;filter:drop-shadow(0 0 10px gold);z-index:4}
@keyframes sparkfloat{0%,100%{transform:translateY(0) rotate(-8deg)}50%{transform:translateY(-12px) rotate(8deg)}}
.trunk{width:34px;height:26px;background:linear-gradient(180deg,#8a5a2b,#5d3a17);margin:-6px auto 0;border-radius:6px 6px 12px 12px}
.passbar{height:12px;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden;margin:8px 0}
.passfill{height:100%;background:linear-gradient(90deg,#ffd86b,#ff5ce0);transition:width .4s}
.shopSec{margin-bottom:14px}
.shopSec h4{margin:10px 0 8px;font-size:14px}
.rbadge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px}
.r-common{background:#4d6b52;color:#dfffe6}.r-rare{background:#2f5fe0;color:#dfeaff}
.r-epic{background:#8b3fd0;color:#f3dfff}.r-legend{background:linear-gradient(90deg,#ff9a3d,#ffd86b);color:#402a00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.oitem{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer}
.oitem .em{font-size:30px}
.oitem .nm{font-size:10.5px;line-height:1.15;margin:4px 0;min-height:24px}
.oitem .pr{font-size:11px;font-weight:800;color:#ffd86b}
canvas{display:block;width:100%;border-radius:14px;background:#0b1c44;touch-action:none}
#ballField{position:relative;height:300px;border-radius:14px;background:rgba(11,28,68,.9);overflow:hidden;border:1px solid rgba(255,255,255,.15)}
.pop{position:absolute;font-size:34px;cursor:pointer;user-select:none;animation:popIn .3s ease}
@keyframes popIn{from{transform:scale(0)}to{transform:scale(1)}}
#bossBox{text-align:center;position:relative;height:240px}
#bossEmoji{font-size:78px;cursor:pointer;user-select:none;transition:transform .08s;filter:drop-shadow(0 0 16px rgba(120,200,255,.8))}
#bossEmoji:active{transform:scale(.9)}
.hpbar{height:14px;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin:6px 0}
.hpfill{height:100%;background:linear-gradient(90deg,#ff5f5f,#ffb03d)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,6,20,.86);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.mbox{background:linear-gradient(180deg,#16264f,#0d1b3e);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,40,90,.95);border:1px solid rgba(255,216,107,.5);color:#fff;border-radius:14px;padding:8px 16px;font-size:13.5px;font-weight:700;animation:tup 2.6s ease forwards}
@keyframes tup{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#banner{position:fixed;top:0;left:0;right:0;z-index:40;text-align:center;padding:5px;font-weight:800;font-size:13px;display:none}
#banner.gh{display:block;background:linear-gradient(90deg,#ffb03d,#ffd86b);color:#402a00}
#banner.st{display:block;background:linear-gradient(90deg,#59a6ff,#8fd8ff);color:#0a1a3f}
#stormFx{position:fixed;inset:0;z-index:35;pointer-events:none;display:none}
#stormFx span{position:absolute;top:-6%;font-size:16px;opacity:.85;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(108vh)}}
.wheelWrap{position:relative;text-align:center}
#wheelCv{width:280px;height:280px;margin:0 auto}
.wheelPtr{position:absolute;top:-4px;left:50%;transform:translateX(-50%);font-size:26px;filter:drop-shadow(0 0 6px #ffd86b)}
.adsOv{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
.adsOv.show{display:flex}
.lbrow{display:flex;gap:8px;align-items:center;padding:7px 10px;background:rgba(255,255,255,.07);border-radius:12px;margin-bottom:5px;font-size:13.5px}
.lbrow .rank{font-weight:800;width:26px;color:#ffd86b}
.lbrow .pts{margin-left:auto;font-weight:800;color:#8fe3b0}
</style>
</head>
<body>
<div id="aurora"><i></i><i></i><i></i></div>
<div id="banner"></div>
<div id="stormFx"></div>

<header>
  <div class="hrow">
    <div class="logo">🎄 Ёлка Зини</div>
    <div class="stat" id="stCones">🌰 0</div>
    <div class="stat" id="stLevel">Ур. 1</div>
    <div class="stat" id="stStreak">🔥 0</div>
    <button id="gbtn" onclick="voiceDrop()">🎵</button>
  </div>
  <div class="hrow" style="margin-top:6px">
    <div class="xpwrap"><div class="xpbar" id="xpbar"></div></div>
    <div class="xplabel" id="xplabel">0 / 150</div>
  </div>
</header>
<div id="garland"></div>
<div class="ticker"><div class="ticker-inner" id="tickerInner">🎄 Загрузка новостей ёлки…</div></div>

<nav id="tabs"></nav>
<main id="main"></main>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="adsOv" id="adsOv">
  <div style="font-size:44px">📺</div>
  <div style="font-weight:800;font-size:18px">Реклама</div>
  <div id="adsCnt" style="font-size:34px;font-weight:800;color:#ffd86b">3</div>
  <div class="small">Просматривайте — награда придёт сразу после</div>
</div>
<div id="toast"></div>

<script>
/* ============ CONFIG SUPABASE (вставьте свои ключи — иначе резервный режим) ============ */
const SB_CFG={url:'',key:'',TABLE:'zini_leaderboard',EVENTS:'zini_events'};

/* ============ КАТАЛОГ ИГРУШЕК ============ */
const RAR={common:{n:'Обычные',cls:'r-common'},rare:{n:'Редкие',cls:'r-rare'},epic:{n:'Эпические',cls:'r-epic'},legend:{n:'Легендарные',cls:'r-legend'}};
const CATALOG={
common:[['Красный шарик','🔴',50],['Синий шарик','🔵',50],['Зелёный шарик','🟢',60],['Колокольчик','🔔',80],['Снежинка','❄️',70],['Мандарин','🍊',90],['Конфета','🍬',90],['Ленточка','🎀',60],['Свечка','🕯️',100],['Белка','🐿️',120],['Пряник','🍩',110],['Носочек','🧦',100]],
rare:[['Бант-гигант','🎀',300],['Серебристая звезда','🌟',350],['Олень','🦌',400],['Подарочек','🎁',380],['Снеговик','⛄',420],['Сова','🦉',450],['Леденец-посох','🍭',480],['Золотая свеча','🕯️',500],['Медвежонок','🐻',520],['Цилиндр снеговика','🎩',550]],
epic:[['Единорог','🦄',1500],['Замок снеговика','🏰',1800],['Карусель','🎠',2000],['Паровозик','🚂',1900],['Кристалл льда','💎',2100],['Планета','🪐',2300],['Ледяной дракон','🧊',2500],['Шатёр цирка','🎪',2200]],
legend:[['Корона Зини','👑',8000],['Комета','🌠',10000],['Кубок Зини','🏆',12000],['Жар-птица','🐦‍🔥',15000],['Фейерверк','🎆',18000],['Звезда желания','💫',20000]]
};

/* ============ СОСТОЯНИЕ ============ */
const SKEY='zini_v9_state';
function defState(){return{cones:200,xp:0,level:1,name:'',weekEarned:0,bag:[],tree:Array(9).fill(null),
wheelFree:3,wheelDay:'',streak:0,streakDay:'',wishDay:'',ghUntil:0,stormUntil:0,sparkAt:0,
passiveLast:Date.now(),claimed:[],order:null,orderDay:'',vidNext:0,seq:1,catchBest:0,bossWins:0}}
let S=defState();
try{const raw=localStorage.getItem(SKEY);if(raw)S=Object.assign(defState(),JSON.parse(raw));}catch(e){}
function save(){localStorage.setItem(SKEY,JSON.stringify(S));}
const today=()=>new Date().toISOString().slice(0,10);

/* ============ SUPABASE / РЕЗЕРВ ============ */
async function sb(path,opts={}){
 if(!SB_CFG.url||!SB_CFG.key)return null;
 try{
  const r=await fetch(SB_CFG.url+'/rest/v1/'+path,{...opts,headers:{'apikey':SB_CFG.key,'Authorization':'Bearer '+SB_CFG.key,'Content-Type':'application/json',Prefer:'return=representation'}});
  if(!r.ok)return null;return r.json();
 }catch(e){return null}
}
function mockSeed(){
 if(!localStorage.getItem('zini_mock_lb'))localStorage.setItem('zini_mock_lb',JSON.stringify([
  {name:'Маша-Ёлочка',score:4200},{name:'ДедБосс',score:3100},{name:'Снежок',score:2500},
  {name:'ИглаНя',score:1900},{name:'ХвойныйБро',score:1500},{name:'Мандаринка',score:1200},{name:'НочиВьюга',score:900}]));
 if(!localStorage.getItem('zini_mock_ev'))localStorage.setItem('zini_mock_ev',JSON.stringify([
  '👑 ДедБосс выиграл 5000 шишек!','🛷 Маша-Ёлочка поймала 24 подарка','💫 Снежок загадал желание — сбылось!',
  '🎄 ХвойныйБро повесил Жар-птицу!','❄️ Снежная буря накрыла поляну','🎡 Мандаринка сорвала джекпот']));
}
function getMock(k){mockSeed();return JSON.parse(localStorage.getItem(k)||'[]')}
function setMock(k,v){localStorage.setItem(k,JSON.stringify(v))}
async function loadTop(){
 let rows=await sb(SB_TABLE+'?select=*&order=score.desc&limit=10');
 if(!rows){rows=getMock('zini_mock_lb').sort((a,b)=>b.score-a.score).slice(0,10);}
 return rows;
}
async function submitScore(){
 if(!S.name){askName();return}
 let rows=await sb(SB_TABLE+'?select=*&order=score.desc&limit=10');
 if(rows){await sb(SB_TABLE,{method:'POST',body:JSON.stringify({name:S.name,score:S.weekEarned,ts:Date.now()})});}
 else{const m=getMock('zini_mock_lb');const i=m.findIndex(r=>r.name===S.name);
  if(i>=0)m[i].score=Math.max(m[i].score,S.weekEarned);else m.push({name:S.name,score:S.weekEarned});
  setMock('zini_mock_lb',m);}
 toast('📊 Результат отправлен в топ недели!');
}
async function loadTicker(){
 let ev=await sb(SB_EVENTS+'?select=*&order=ts.desc&limit=8');
 if(ev)ev=ev.map(e=>e.text);
 else ev=getMock('zini_mock_ev');
 return ev;
}
async function pushEvent(text){
 await sb(SB_EVENTS,{method:'POST',body:JSON.stringify({text,ts:Date.now()})})||
 (()=>{const m=getMock('zini_mock_ev');m.unshift(text);setMock('zini_mock_ev',m.slice(0,8));})();
}

/* ============ ХЕЛПЕРЫ РЕКЛАМЫ ============ */
let _adsLoading=false;
function loadAdsSdk(){
 return new Promise(res=>{
  if(window.ysdk||_adsLoading)  {return _waitForYsdk(res)}
  _adsLoading=true;
  const s=document.createElement('script');
  s.src='https://yandex.ru/games/sdk/v2';
  s.onload=()=>{YaGames&&YaGames.init().then(sdk=>{window.ysdk=sdk;_adsLoading=false;res(true);}).catch(()=>{_adsLoading=false;res(false);})};
  s.onerror=()=>{_adsLoading=false;res(false)};
  document.head.appendChild(s);
 });
}
function _waitForYsdk(res){let n=0;const iv=setInterval(()=>{n++;if(window.ysdk){clearInterval(iv);res(true)}else if(n>40){clearInterval(iv);res(false)}},100);}
async function showAdRewarded(onReward){
 const ok=await loadAdsSdk();
 if(ok&&window.ysdk){
  try{
   await window.ysdk.adv.showRewardedVideo({callbacks:{
    onRewarded:()=>onReward(),
    onClose:()=>{},
    onError:()=>simulateAd(onReward)
   }});
   return;
  }catch(e){/* fallback ниже */}
 }
 simulateAd(onReward);
}
function simulateAd(onReward){
 const ov=document.getElementById('adsOv');ov.classList.add('show');
 let c=3;const el=document.getElementById('adsCnt');el.textContent=c;
 const iv=setInterval(()=>{c--;el.textContent=Math.max(c,0);
  if(c<=0){clearInterval(iv);ov.classList.remove('show');onReward();}
 },1000);
}

/* ============ УТИЛИТЫ ============ */
const $=id=>document.getElementById(id);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),2600);}
function fmt(n){return n>=1000?(n/1000).toFixed(n%1000?1:0).replace('.0','')+'к':''+n}
function rand(a,b){return Math.floor(a+Math.random()*(b-a+1))}
function pick(a){return a[rand(0,a.length-1)]}
function xpNeed(l){return 100+l*50}
function mult(){let m=1;if(Date.now()<S.ghUntil)m*=2;if(Date.now()<S.stormUntil)m*=2;return m}
function gain(n,src){
 const m=(src==='passive')?1:mult();
 S.cones+=n*m;S.weekEarned+=n*m;
 if(S.order&&S.order.t==='earn')progOrder(n*m);
 addXp(Math.round(n*m/12));
 save();renderHeader();
}
function spend(n){if(S.cones<n){toast('Не хватает шишек 🌰');return false}S.cones-=n;save();renderHeader();return true}
function addXp(n){S.xp+=n;while(S.xp>=xpNeed(S.level)&&S.level<100){S.xp-=xpNeed(S.level);S.level++;toast('🎉 Уровень '+S.level+'!');if(S.level%5===0)toast('🎁 Пропуск: сундук на уровне '+S.level+' ждёт во вкладке «Пропуск»');}renderHeader();save();}

/* ============ ГОЛОС «Зини дроп!» ============ */
let voiceReady=Date.now();
function voiceDrop(){
 if(Date.now()<voiceReady){toast('⏳ Голос доступен через '+mmss(voiceReady-Date.now()));return}
 voiceReady=Date.now()+5*60*1000;
 const u=new SpeechSynthesisUtterance('Зини дроп!');
 u.lang='ru-RU';u.rate=0.92;u.pitch=1.15;
 try{speechSynthesis.cancel();speechSynthesis.speak(u);}catch(e){}
 S.cones+=25;S.weekEarned+=25;save();renderHeader();toast('🔊 «Зини дроп!» +25 🌰');
}

/* ============ ИГРУШКИ / ЁЛКА ============ */
function mkOrn(rar){
 const [n,e,p]=pick(CATALOG[rar]);
 return{uid:'o'+(S.seq++),name:n,emoji:e,rar};
}
function buy(rar){
 const list=CATALOG[rar];const [n,,p]=pick(list);
 if(!spend(p))return;
 S.bag.push({uid:'o'+(S.seq++),name:n,emoji:pick(list.map(x=>x[1])&&list.filter(x=>x[0]===n).map(x=>x[1]))||'',rar});
 S.bag[S.bag.length-1].emoji=list.find(x=>x[0]===n)[1];
 save();renderShop();toast('🛍 Куплено: '+n+' ('+RAR[rar].n+')');
}
function hang(slotIdx){
 openBagPicker(slotIdx);
}
function openBagPicker(slotIdx){
 const box=$('mbox');
 let html='<h3>🧺 Мешок — выберите игрушку</h3>';

/* ============ КОЛЕСО ============ */
const WHEEL=[{t:'c',v:50},{t:'c',v:100},{t:'o',v:'rare'},{t:'c',v:250},{t:'c',v:500},{t:'o',v:'epic'},{t:'c',v:150},{t:'c',v:1000}];
const WCOLS=['#2f5fe0','#8b3fd0','#d03a3a','#12a06a','#ff9a3d','#6a5cff','#1fffa4','#ffd86b'];
let wheelAng=0,wheelSpinning=false;
function drawWheel(){
 const cv=$('wheelCv');if(!cv)return;const ctx=cv.getContext('2d');
 const R=cv.width/2,cx=R,cy=R;ctx.clearRect(0,0,cv.width,cv.height);
 WHEEL.forEach((p,i)=>{
  const a0=wheelAng+i*Math.PI*2/8,a1=a0+Math.PI*2/8;
  ctx.beginPath();ctx.moveTo(cx,cy);ctx.arc(cx,cy,R-8,a0,a1);ctx.closePath();
  ctx.fillStyle=WCOLS[i];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.5)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(cx,cy);ctx.rotate(a0+Math.PI/8);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';
  ctx.fillText(p.t==='c'?String(p.v):(p.v==='rare'?' Rare':'Epic'),R*0.62,5);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(cx,cy,26,0,7);ctx.fillStyle='#0a1a3f';ctx.fill();ctx.strokeStyle='#ffd86b';ctx.lineWidth=3;ctx.stroke();
 ctx.fillStyle='#ffd86b';ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.fillText('🎄',cx,cy+7);
}
function spinWheel(viaAd){
 if(wheelSpinning)return;
 if(viaAd){
  showAdRewarded(()=>doSpin(false));
 }else{
  if(S.wheelFree<=0){toast(' Бесплатные спины кончились — крутите за рекламу 📺');return}
  S.wheelFree--;save();doSpin(true);
 }
}
function doSpin(useFree){
 if(wheelSpinning)return;wheelSpinning=true;
 const target=rand(0,7);
 const full=Math.PI*2*(3+rand(0,3));
 const dest=wheelAng+full+((Math.PI*2/8)*((7-target)%8))-((wheelAng%(Math.PI*2))+Math.PI*2)% (Math.PI*2);
 const start=wheelAng,t0=performance.now(),dur=3000;
 (function anim(now){
  const k=Math.min((now-t0)/dur,1);const e=1-Math.pow(1-k,3);
  wheelAng=start+ (dest-start)*e;drawWheel();
  if(k<1)requestAnimationFrame(anim);
  else{wheelAng=wheelAng%(Math.PI*2);wheelSpinning=false;wheelPrize(target,useFree);}
 })(performance.now());
}
function wheelPrize(i,useFree){
 const p=WHEEL[i];
 if(p.t==='c'){gain(p.v,'wheel');toast('🎡 Колесо: +'+p.v+' 🌰');}
 else{const o=mkOrn(p.v);S.bag.push(o);toast('🎡 Колесо: '+o.emoji+' '+o.name+'!');}
 if(i===7){pushEvent('🎡 '+(S.name||'Игрок')+' сорвал джекпот 1000!');}
 if(S.name)submitScore();
 save();if(CUR==='games')renderGames();
}

/* ============ МИНИ-ИГРА: ПОЙМАЙ В САНИ ============ */
let sledRaf=null;
function startSled(){
 const cv=$('sledCv');if(!cv)return;
 const W=cv.width=cv.clientWidth||360,H=cv.height=320;
 const ctx=cv.getContext('2d');
 let sled={x:W/2},items=[],score=0,lives=3,elapsed=0,spawnT=0,flash=0,last=performance.now();
 const move=e=>{const r=cv.getBoundingClientRect();const x=(e.clientX!==undefined?e.clientX:e.touches&&e.touches[0].clientX);if(x!==undefined)sled.x=Math.max(28,Math.min(W-28,x-r.left));};
 cv.addEventListener('pointerdown',move);cv.addEventListener('pointermove',move);
 const hud=()=> '🎁 '+score+'   ❤️ '.repeat(0)+('❤️'.repeat(Math.max(lives,0)))+'   ⏱ '+Math.ceil((45000-elapsed)/1000);
 function end(){cancelAnimationFrame(sledRaf);sledRaf=null;
  gain(score*4,'sled');addXp(score*2);
  if(score>S.catchBest)S.catchBest=score;
  if(S.order&&S.order.t==='catch'){progOrder(score);}
  toast('🛷 Итог: поймано '+score+' → +'+(score*4)+' 🌰');
  if(S.name)submitScore();
  renderGames();
 }
 function loop(now){
  const dt=now-last;last=now;elapsed+=dt;spawnT+=dt;flash=Math.max(0,flash-dt);
  const spd=1+elapsed/45000*1.6;
  if(spawnT>620){spawnT=0;
   const r=Math.random();
   items.push({x:rand(24,W-24),y:-20,v:(r<0.5?'gift':r<0.8?'cone':'ice'),s:0.06*spd+Math.random()*0.05});
  }
  ctx.fillStyle='#0b1c44';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<24;i++){const y=(i*57+elapsed*0.03)%H;ctx.fillRect((i*97)%W,y,2,2);}
  items.forEach(it=>{
   it.y+=it.s*dt;
   ctx.font='26px serif';ctx.textAlign='center';
   ctx.fillText(it.v==='gift'?'🎁':it.v==='cone'?'🌰':'🧊',it.x,it.y);
   if(it.y>H-42&&Math.abs(it.x-sled.x)<42&&it.y<H+10){
    if(it.v==='ice'){lives--;flash=200;}else{score+=it.v==='gift'?2:1;}
    it.y=H+99;
   }
  });
  items=items.filter(it=>it.y<H+40);
  ctx.font='34px serif';ctx.fillText('🛷',sled.x,H-12);
  if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash/400)+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#ffd86b';ctx.font='bold 15px sans-serif';ctx.textAlign='left';ctx.fillText(hud(),10,22);
  if(lives<=0||elapsed>45000){end();return;}
  sledRaf=requestAnimationFrame(loop);
 }
 sledRaf=requestAnimationFrame(loop);
}

 const cl=S.claimed.includes(next5);
 html+='<div class="card"><h3>🎟 Пропуск сезона</h3>'
  +'<div class="row"><div><b>Уровень '+S.level+' / 100</b><div class="small">Сундук на каждом 5-м уровне</div></div><div class="stat">chest: ур. '+next5+'</div></div>'
  +'<div class="passbar"><div class="passfill" style="width:'+(100*S.xp/xpNeed(S.level))+'%"></div></div>'
  +'<button class="btn'+(cl?'':' gold')+'" '+(cl?'disabled':'')+' onclick="claimChest('+next5+')">'+(cl?'✔ Сундук получен':'🎁 Забрать сундук ур. '+next5+' ('+(next5*30)+' 🌰)')+'</button></div>';
 const canClaim=S.level%5===0&&!S.claimed.includes(S.level);
 if(canClaim)html+='<div class="card"><h3>🎁 Сундук текущего уровня!</h3><button class="btn gold" onclick="claimChest('+S.level+')">Забрать '+(S.level*30)+' 🌰</button></div>';
 $('main').innerHTML=html;
}

/* ============ ВКЛАДКА ИНВЕНТАРЬ ============ */
function renderInv(){
 let html='<div class="card"><h3>🧺 Мешок ('+S.bag.length+')</h3>';
 if(!S.bag.length)html+='<div class="small">Пусто. Купите игрушки в Витрине или выиграйте в играх!</div>';
 html+='<div class="grid">';
 S.bag.forEach(o=>{html+='<div class="oitem"><div class="em">'+o.emoji+'</div><div class="nm">'+o.name+'</div><div class="rbadge '+RAR[o.rar].cls+'">'+RAR[o.rar].n+'</div></div>';});
 html+='</div></div>';
 if(S.order){
  const txt={hang:'Повесьте '+(S.order.done>=S.order.n?S.order.n:S.order.done)+'/'+S.order.n+' игрушек редкости «'+RAR[S.order.rar].n+'»',
   earn:'Заработайте '+Math.min(S.order.done,S.order.n)+'/'+S.order.n+' 🌰',
   catch:'Поймайте '+Math.min(S.order.done,S.order.n)+'/'+S.order.n+' предметов в «Поймай в сани»'}[S.order.t];
  html+='<div class="card"><h3>🎅 Дед Мороз с заказом</h3><div class="small">«'+txt+'»</div>'
   +'<div class="passbar"><div class="passfill" style="width:'+Math.min(100,100*S.order.done/S.order.n)+'%"></div></div>'
   +'<div class="row"><div class="small">Награда: <b>'+S.order.reward+' 🌰</b></div><button class="btn" style="width:auto" onclick="genOrder();renderInv()">Другой заказ</button></div></div>';
 }else{
  html+='<div class="card"><h3>🎅 Дед Мороз с заказом</h3><div class="small">Заказ уже в пути…</div><button class="btn" onclick="genOrder();renderInv()">Получить заказ</button></div>';
 }
 const canWish=S.wishDay!==today()&&hasWishStar();
 html+='<div class="card"><h3>💫 Звезда желания</h3><div class="small">'+(hasWishStar()?'Звезда у вас! Раз в день она исполняет желание: шишки или эпическая игрушка.':'Купите легендарную «Звезду желания» в Витрине.')+'</div>'
  +'<button class="btn'+(canWish?' gold':'')+'" '+(canWish?'':'disabled')+' style="margin-top:8px" onclick="makeWish();renderInv()">Загадать желание</button></div>';
 html+='<div class="card"><h3>📈 Статистика</h3><div class="small">Уровень: '+S.level+'/100 · Огонь подряд: 🔥 '+S.streak+' · Побед над боссом: '+S.bossWins+' · Рекорд саней: '+S.catchBest+' · Заработано за неделю: '+fmt(S.weekEarned)+' 🌰</div>'
  +'<button class="btn" style="margin-top:8px" onclick="submitScore()">📊 Отправить результат в топ недели</button></div>';
 $('main').innerHTML=html;
}

/* ============ ВКЛАДКА ТОП ============ */
async function renderTop(){
 $('main').innerHTML='<div class="card"><h3>📊 Топ недели</h3><div class="small">Загрузка…</div></div>';
 const rows=await loadTop();
 let html='<div class="card"><h3>📊 Топ недели</h3>';
 rows.forEach((r,i)=>{html+='<div class="lbrow"><div class="rank">'+(i+1)+'</div><div>'+(r.name||'Аноним')+'</div><div class="pts">'+fmt(r.score||0)+' 🌰</div></div>';});
 html+='<button class="btn gold" style="margin-top:8px" onclick="submitScore()">Отправить свой результат</button></div>';
 html+='<div class="card"><div class="small">Строка новостей сверху экрана обновляется из Supabase, если заданы ключи, иначе — резервный режим.</div></div>';
 $('main').innerHTML=html;
}
function askName(){
 const box=$('mbox');
 box.innerHTML='<h3>Как вас записать в топ?</h3><input id="nmIn" maxlength="16" placeholder="Ваше имя" style="width:100%;padding:10px;border-radius:12px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);color:#fff;font-size:15px"><button class="btn gold" style="margin-top:10px" onclick="S.name=document.getElementById(\'nmIn\').value.trim()||\'Игрок\';save();closeModal();submitScore();">Сохранить и отправить</button><button class="btn" style="margin-top:8px" onclick="closeModal()">Позже</button>';
 $('modal').classList.add('show');
}
function closeModal(){$('modal').classList.remove('show')}

/* ============ ГИРЛЯНДА ============ */
function garland(){
 const cols=['#ff5f5f','#ffd86b','#2ee38b','#59a6ff','#ff5ce0','#8fd8ff'];
 let h='';for(let i=0;i<26;i++)h+='<span class="bulb" style="color:'+cols[i%cols.length]+';background:'+cols[i%cols.length]+';animation-delay:'+(i*0.13)+'s"></span>';
 $('garland').innerHTML=h;
}

/* ============ ТИК / ИНИТ ============ */
setInterval(()=>{
 maybeEvents();
 if(CUR==='tree'&&Date.now()>S.sparkAt)spawnSpark();
 renderHeader();
},15000);

(function init(){
 garland();renderTabs();
 // огонь подряд
 if(S.streakDay!==today()){
  const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.streakDay===yest){S.streak++;gain(50+S.streak*25,'streak');toast('🔥 Огонь подряд: день '+S.streak+'! +'+(50+S.streak*25)+' 🌰');}
  else{S.streak=1;gain(50,'streak');toast('🔥 Новый огонь подряд! +50 🌰');}
  S.streakDay=today();
 }
 if(S.wheelDay!==today()){S.wheelFree=3;S.wheelDay=today();}
 if(S.orderDay!==today()&&!S.order)genOrder();
 S.passiveLast=S.passiveLast||Date.now();
 save();renderHeader();switchTab('tree');
 loadTicker().then(ev=>{if(ev&&ev.length)$('tickerInner').textContent=ev.join('   ✦   ')+'   ✦   ';});
})();
</script>
