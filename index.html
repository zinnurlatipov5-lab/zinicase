<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎄 Ёлка Зини v10.0</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:#eef3ff;min-height:100%}
body{background:#060d24;overflow-x:hidden}
#aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#050b23 0%,#0a1a3f 45%,#12295a 100%)}
#aurora i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.45;mix-blend-mode:screen}
#aurora i:nth-child(1){width:95vw;height:36vh;left:-18vw;top:-8vh;background:radial-gradient(ellipse,#1fffa4,transparent 70%);animation:aur1 12s ease-in-out infinite alternate}
#aurora i:nth-child(2){width:85vw;height:30vh;left:28vw;top:0;background:radial-gradient(ellipse,#6a5cff,transparent 70%);animation:aur2 15s ease-in-out infinite alternate}
#aurora i:nth-child(3){width:75vw;height:26vh;left:2vw;top:14vh;background:radial-gradient(ellipse,#ff5ce0,transparent 70%);animation:aur3 18s ease-in-out infinite alternate}
@keyframes aur1{from{transform:translateX(-9vw) skewX(-9deg) scaleY(.7)}to{transform:translateX(15vw) skewX(9deg) scaleY(1.25)}}
@keyframes aur2{from{transform:translateX(10vw) skewX(7deg) scaleY(1.1)}to{transform:translateX(-12vw) skewX(-6deg) scaleY(.75)}}
@keyframes aur3{from{transform:translateX(6vw) skewX(-5deg) scaleY(.8)}to{transform:translateX(-9vw) skewX(8deg) scaleY(1.15)}}
#snow{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#snow span{position:absolute;top:-6%;opacity:.5;font-size:14px;animation:fall linear infinite}
@keyframes fall{to{transform:translateY(108vh) rotate(360deg)}}

header{position:sticky;top:0;z-index:30;background:rgba(10,20,50,.85);backdrop-filter:blur(8px);padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:#ffd86b;text-shadow:0 0 12px rgba(255,200,60,.6)}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.xpwrap{flex:1;min-width:90px;height:9px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden}
.xpbar{height:100%;width:0;background:linear-gradient(90deg,#ffd86b,#ff8f3f);transition:width .4s}
.xplabel{font-size:11px;opacity:.85;min-width:64px;text-align:right}
#gbtn{background:linear-gradient(135deg,#ffd86b,#ff9a3d);border:none;border-radius:14px;color:#402a00;font-weight:800;font-size:15px;padding:6px 12px;cursor:pointer;box-shadow:0 0 14px rgba(255,190,60,.45)}
#gbtn:disabled{filter:grayscale(.7);opacity:.55}

#garland{position:sticky;top:0;z-index:29;background:rgba(8,16,44,.4);line-height:0}
#garland svg{width:100%;height:44px;display:block}
.gb{transform-box:fill-box;transform-origin:50% 0%;animation:sway 2.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-7deg)}to{transform:rotate(7deg)}}
.gb .core{animation:blink 1.6s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.35}to{opacity:1}}

.ticker{position:relative;z-index:5;overflow:hidden;background:rgba(8,16,44,.75);border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
.ticker-inner{display:inline-block;padding:5px 0;font-size:12.5px;color:#aee6ff;animation:tick 40s linear infinite}
@keyframes tick{from{transform:translateX(100vw)}to{transform:translateX(-100%)}}
nav{position:sticky;top:44px;z-index:31;display:flex;gap:4px;padding:8px;overflow-x:auto;background:linear-gradient(180deg,rgba(5,11,35,.95),rgba(5,11,35,.7))}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#dfe8ff;border-radius:16px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#2ee38b,#12a06a);color:#032015;border-color:transparent;box-shadow:0 0 16px rgba(46,227,139,.4)}
main{position:relative;z-index:5;max-width:720px;margin:0 auto;padding:10px 10px 90px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.card h3{margin:0 0 8px;font-size:16px;color:#ffd86b}
.btn{background:linear-gradient(135deg,#2ee38b,#12a06a);border:none;color:#032015;font-weight:800;font-size:14px;border-radius:14px;padding:11px 16px;cursor:pointer;width:100%}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#ffd86b,#ff9a3d);color:#402a00}
.btn.blue{background:linear-gradient(135deg,#59a6ff,#2f5fe0);color:#eaf3ff}
.btn.red{background:linear-gradient(135deg,#ff6b6b,#d03a3a);color:#fff}
.btn:disabled{filter:grayscale(.75);opacity:.55}
.small{font-size:12px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ==== ЁЛКА НА ВЕСЬ ЭКРАН ==== */
#treeScene{position:relative;height:min(76vh,700px);border-radius:20px;overflow:hidden;
 background:radial-gradient(ellipse at 50% 30%,rgba(90,140,255,.18),transparent 60%),linear-gradient(180deg,#0a1740,#0e2352)}
.tier{position:absolute;left:50%;transform:translateX(-50%);
 background:linear-gradient(180deg,#1c8a4e 0%,#146b3a 55%,#0d522c 100%);
 clip-path:polygon(50% 0,100% 100%,0 100%);
 filter:drop-shadow(0 6px 12px rgba(0,0,0,.45))}
.tier::after{content:'';position:absolute;inset:0;background:
 radial-gradient(ellipse at 30% 25%,rgba(255,255,255,.18),transparent 45%),
 radial-gradient(ellipse at 70% 60%,rgba(255,255,255,.08),transparent 45%)}
.tstar{position:absolute;left:50%;top:1.5%;transform:translateX(-50%);font-size:42px;filter:drop-shadow(0 0 14px #ffd86b);animation:tw 2s ease-in-out infinite alternate;z-index:3}
@keyframes tw{from{transform:translateX(-50%) scale(.92);opacity:.85}to{transform:translateX(-50%) scale(1.1);opacity:1}}
.trunk{position:absolute;left:50%;transform:translateX(-50%);width:11%;height:15%;background:linear-gradient(180deg,#8a5a2b,#5d3a17);border-radius:6px 6px 10px 10px;box-shadow:0 4px 10px rgba(0,0,0,.4)}
.snowground{position:absolute;left:0;right:0;bottom:8%;height:9%;background:radial-gradient(ellipse at 50% 0,#eaf4ff 55%,transparent 72%);filter:blur(2px)}
.treeglow{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 60%,rgba(255,220,120,.10),transparent 60%);pointer-events:none}

.ornwrap{position:absolute;transform:translate(-50%,-50%);z-index:4;animation:hangSway 3.2s ease-in-out infinite alternate}
@keyframes hangSway{from{transform:translate(-50%,-50%) rotate(-5deg)}to{transform:translate(-50%,-50%) rotate(5deg)}}
.emptySlot{position:absolute;transform:translate(-50%,-50%);width:30px;height:30px;border:2px dashed rgba(255,255,255,.3);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.5);font-size:16px;cursor:pointer;z-index:3;background:rgba(0,0,0,.15)}
.emptySlot:hover{border-color:#ffd86b;color:#ffd86b}

.bauble{position:relative;width:32px;height:32px;border-radius:50%;
 background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),rgba(255,255,255,0) 40%),radial-gradient(circle at 50% 40%,var(--c1),var(--c2));
 box-shadow:0 0 14px var(--glow),inset -3px -5px 6px rgba(0,0,0,.4),inset 2px 3px 5px rgba(255,255,255,.3);
 display:flex;align-items:center;justify-content:center;font-size:14px;cursor:default}
.bcap{width:10px;height:7px;background:linear-gradient(#ffe9a8,#c9971f);border-radius:2px;margin:-3px auto 0;box-shadow:0 1px 3px rgba(0,0,0,.5)}
.bstring{width:1.5px;height:6px;background:rgba(255,255,255,.55);margin:0 auto}
.ornwrap .rem{position:absolute;bottom:-6px;right:-8px;width:22px;height:22px;border-radius:50%;border:none;background:#ff5f5f;color:#fff;font-size:11px;cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.5);z-index:5}
.r-common{--c1:#7ee8a2;--c2:#1c7a44;--glow:rgba(80,220,140,.55)}
.r-rare{--c1:#8fc4ff;--c2:#1d4fc0;--glow:rgba(90,160,255,.6)}
.r-epic{--c1:#d9a0ff;--c2:#7b2fc0;--glow:rgba(190,100,255,.6)}
.r-legend{--c1:#ffe9a8;--c2:#d08a1a;--glow:rgba(255,200,80,.75)}

.treebar{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:-4px}
.chip{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:12px;padding:5px 10px;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap}
.chip.gold{background:linear-gradient(135deg,#ffd86b,#ff9a3d);color:#402a00;border:none}
.chip:disabled{filter:grayscale(.7);opacity:.55}

/* ==== ВИТРИНА ==== */
.rbadge{font-size:10px;font-weight:800;padding:2px 7px;border-radius:8px;display:inline-block}
.r-common.rb{background:#2f6b46;color:#dfffe6}.r-rare.rb{background:#2450b8;color:#dfeaff}
.r-epic.rb{background:#6d2bb0;color:#f3dfff}.r-legend.rb{background:linear-gradient(90deg,#ff9a3d,#ffd86b);color:#402a00}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.oitem{background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:8px 6px;text-align:center;cursor:pointer;transition:transform .15s}
.oitem:hover{transform:translateY(-2px);border-color:rgba(255,216,107,.5)}
.oitem .bstring,.oitem .bcap{transform:scale(.75)}
.oitem .bauble{margin:0 auto;width:44px;height:44px;font-size:20px}
.oitem .nm{font-size:10.5px;line-height:1.15;margin:5px 0 3px;min-height:24px;color:#eef3ff}
.oitem .pr{font-size:11px;font-weight:800;color:#ffd86b}
.shopSec{margin-bottom:14px}
.shopSec h4{margin:12px 0 8px;font-size:14px}

/* ==== ИГРЫ ==== */
canvas{display:block;width:100%;border-radius:14px;background:#0b1c44;touch-action:none}
#ballField{position:relative;height:340px;border-radius:14px;background:radial-gradient(ellipse at 50% 100%,rgba(70,110,220,.25),transparent 65%),#0b1c44;overflow:hidden;border:1px solid rgba(255,255,255,.15)}
#ballField .pop{position:absolute;font-size:34px;cursor:pointer;user-select:none;will-change:transform}
#ballInfo{position:absolute;top:8px;left:10px;font-weight:800;font-size:15px;color:#ffd86b;z-index:2;text-shadow:0 1px 4px #000}
.combo{position:absolute;color:#ffd86b;font-weight:800;font-size:20px;pointer-events:none;animation:comboUp .8s ease forwards;z-index:3;text-shadow:0 0 8px #ff9a3d}
@keyframes comboUp{to{transform:translateY(-40px);opacity:0}}
#bossBox{text-align:center;position:relative;height:280px;border-radius:14px;background:radial-gradient(ellipse at 50% 30%,rgba(120,180,255,.12),transparent 65%),#0a1838;overflow:hidden;border:1px solid rgba(255,255,255,.12)}
#bossEmoji{font-size:86px;cursor:pointer;user-select:none;filter:drop-shadow(0 0 18px rgba(120,200,255,.85));animation:bob 1.6s ease-in-out infinite;position:absolute;left:50%;top:46%;transform:translate(-50%,-50%)}
@keyframes bob{0%,100%{transform:translate(-50%,-50%) rotate(-3deg)}50%{transform:translate(-50%,-56%) rotate(3deg)}}
#bossEmoji.shielded{filter:drop-shadow(0 0 22px #ffd86b)}
#bossShield{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);font-size:110px;opacity:.55;pointer-events:none}
.dmg{position:absolute;font-weight:800;pointer-events:none;animation:dmgUp .9s ease forwards;z-index:6;text-shadow:0 2px 6px #000}
@keyframes dmgUp{to{transform:translateY(-46px);opacity:0}}
.icicle{position:absolute;font-size:26px;cursor:pointer;z-index:5;transition:top 1.9s linear;user-select:none}
.hitFlash{position:absolute;inset:0;background:rgba(255,80,80,.35);pointer-events:none;animation:hf .35s ease forwards;z-index:7}
@keyframes hf{to{opacity:0}}
.hpbar{height:14px;background:rgba(255,255,255,.15);border-radius:8px;overflow:hidden;margin:6px 0}
.hpfill{height:100%;background:linear-gradient(90deg,#ff5f5f,#ffb03d);transition:width .15s}

/* ==== КОЛЕСО ==== */
.wheelWrap{position:relative;text-align:center}
#wheelCv{width:300px;height:300px;margin:0 auto}
.wheelPtr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);font-size:30px;filter:drop-shadow(0 0 6px #ffd86b);z-index:2}
.wheelPrize{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(10,20,50,.92);border:2px solid #ffd86b;border-radius:16px;padding:14px 20px;font-weight:800;font-size:17px;pointer-events:none;z-index:5;animation:prizeIn .4s ease}
@keyframes prizeIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0}to{transform:translate(-50%,-50%) scale(1);opacity:1}}

/* ==== ПРОЧЕЕ ==== */
.modal{position:fixed;inset:0;z-index:60;background:rgba(2,6,20,.86);display:none;align-items:center;justify-content:center;padding:16px}
.modal.show{display:flex}
.mbox{background:linear-gradient(180deg,#16264f,#0d1b3e);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto}
#toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
.toast{background:rgba(20,40,90,.95);border:1px solid rgba(255,216,107,.5);border-radius:14px;padding:8px 16px;font-size:13.5px;font-weight:700;animation:tup 2.6s ease forwards}
@keyframes tup{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:none}80%{opacity:1}100%{opacity:0;transform:translateY(-8px)}}
#banner{position:fixed;top:0;left:0;right:0;z-index:40;text-align:center;padding:5px;font-weight:800;font-size:13px;display:none}
#banner.gh{display:block;background:linear-gradient(90deg,#ffb03d,#ffd86b);color:#402a00}
#banner.st{display:block;background:linear-gradient(90deg,#59a6ff,#8fd8ff);color:#0a1a3f}
.adsOv{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.94);display:none;align-items:center;justify-content:center;flex-direction:column;gap:12px;text-align:center}
.adsOv.show{display:flex}
#adsBar{width:220px;height:10px;background:rgba(255,255,255,.2);border-radius:6px;overflow:hidden}
#adsFill{height:100%;width:0;background:linear-gradient(90deg,#ffd86b,#2ee38b)}
.lbrow{display:flex;gap:8px;align-items:center;padding:7px 10px;background:rgba(255,255,255,.07);border-radius:12px;margin-bottom:5px;font-size:13.5px}
.lbrow .rank{font-weight:800;width:26px;color:#ffd86b}
.lbrow .pts{margin-left:auto;font-weight:800;color:#8fe3b0}
.passbar{height:12px;background:rgba(255,255,255,.14);border-radius:8px;overflow:hidden;margin:8px 0}
.passfill{height:100%;background:linear-gradient(90deg,#ffd86b,#ff5ce0);transition:width .4s}
</style>
</head>
<body>
<div id="aurora"><i></i><i></i><i></i></div>
<div id="snow"></div>
<div id="banner"></div>

<header>
  <div class="hrow">
    <div class="logo">🎄 Ёлка Зини</div>
    <div class="stat" id="stCones">🌰 0</div>
    <div class="stat" id="stLevel">Ур. 1</div>
    <div class="stat" id="stStreak">🔥 0</div>
    <button id="gbtn" onclick="voiceDrop()">🎵</button>
  </div>
  <div class="hrow" style="margin-top:6px">
    <div class="xpwrap"><div class="xpbar" id="xpbar"></div></div>
    <div class="xplabel" id="xplabel">0 / 150</div>
  </div>
</header>
<div id="garland"></div>
<div class="ticker"><div class="ticker-inner" id="tickerInner">🎄 Загрузка новостей ёлки…</div></div>

<nav id="tabs"></nav>
<main id="main"></main>

<div class="modal" id="modal"><div class="mbox" id="mbox"></div></div>
<div class="adsOv" id="adsOv">
  <div style="font-size:44px">📺</div>
  <div style="font-weight:800;font-size:18px">Реклама</div>
  <div id="adsCnt" style="font-size:34px;font-weight:800;color:#ffd86b">3</div>
  <div id="adsBar"><div id="adsFill"></div></div>
  <div class="small">Награда придёт сразу после просмотра</div>
</div>
<div id="toast"></div>

<script>
/* ============ SUPABASE: впишите url и anon-ключ, иначе резервный режим ============ */
const SB_CFG={url:'',key:'',TABLE:'zini_leaderboard',EVENTS:'zini_events'};

/* ============ КАТАЛОГ ============ */
const RAR={
 common:{n:'Обычные',cls:'r-common'},
 rare:{n:'Редкие',cls:'r-rare'},
 epic:{n:'Эпические',cls:'r-epic'},
 legend:{n:'Легендарные',cls:'r-legend'}
};
const CATALOG={
 common:[['Красный шарик','🔴',50],['Синий шарик','🔵',50],['Зелёный шарик','🟢',60],['Колокольчик','🔔',80],['Снежинка','❄️',70],['Мандарин','🍊',90],['Конфета','🍬',90],['Ленточка','🎀',60],['Свечка','🕯️',100],['Белка','🐿️',120],['Пряник','🍩',110],['Носочек','🧦',100]],
 rare:[['Бант-гигант','🎀',300],['Серебристая звезда','🌟',350],['Олень','🦌',400],['Подарочек','🎁',380],['Снеговик','⛄',420],['Сова','🦉',450],['Леденец-посох','🍭',480],['Золотая свеча','🕯️',500],['Медвежонок','🐻',520],['Цилиндр снеговика','🎩',550]],
 epic:[['Единорог','🦄',1500],['Замок снеговика','🏰',1800],['Карусель','🎠',2000],['Паровозик','🚂',1900],['Кристалл льда','💎',2100],['Планета','🪐',2300],['Ледяной дракон','🧊',2500],['Шатёр цирка','🎪',2200]],
 legend:[['Корона Зини','👑',8000],['Комета','🌠',10000],['Кубок Зини','🏆',12000],['Жар-птица','🐦‍🔥',15000],['Фейерверк','🎆',18000],['Звезда желания','💫',20000]]
};

/* 15 слотов: каждый на своей ветке (координаты в % сцены) */
const SLOTS=[
 {x:50,y:11},
 {x:40,y:22},{x:60,y:22},
 {x:30,y:33},{x:50,y:33},{x:70,y:33},
 {x:23,y:45},{x:41,y:45},{x:59,y:45},{x:77,y:45},
 {x:16,y:58},{x:34,y:58},{x:50,y:58},{x:66,y:58},{x:84,y:58}
];

/* ============ СОСТОЯНИЕ ============ */
const SKEY='zini_v10_state';
function defState(){return{cones:200,xp:0,level:1,name:'',weekEarned:0,bag:[],tree:Array(SLOTS.length).fill(null),
 wheelFree:3,wheelDay:'',streak:0,streakDay:'',wishDay:'',dailyDay:'',treeBonusDay:'',
 ghUntil:0,stormUntil:0,sparkAt:0,passiveLast:Date.now(),claimed:[],order:null,vidNext:0,seq:1,catchBest:0,bossWins:0}}
let S=defState();
try{const raw=localStorage.getItem(SKEY);if(raw)S=Object.assign(defState(),JSON.parse(raw));}catch(e){}
function save(){localStorage.setItem(SKEY,JSON.stringify(S));}
const today=()=>new Date().toISOString().slice(0,10);

/* ============ SUPABASE (безопасно: любые ошибки — в резерв) ============ */
async function sb(path,opts={}){
 if(!SB_CFG.url||!SB_CFG.key)return null;
 try{
  const r=await fetch(SB_CFG.url+'/rest/v1/'+path,{...opts,
   headers:{'apikey':SB_CFG.key,'Authorization':'Bearer '+SB_CFG.key,'Content-Type':'application/json',Prefer:'return=representation'}});
  if(!r.ok)return null;return r.json();
 }catch(e){return null}
}
function mockSeed(){
 if(!localStorage.getItem('zini_mock_lb'))localStorage.setItem('zini_mock_lb',JSON.stringify([
  {name:'Маша-Ёлочка',score:4200},{name:'ДедБосс',score:3100},{name:'Снежок',score:2500},
  {name:'ИглаНя',score:1900},{name:'ХвойныйБро',score:1500},{name:'Мандаринка',score:1200},{name:'НочиВьюга',score:900}]));
 if(!localStorage.getItem('zini_mock_ev'))localStorage.setItem('zini_mock_ev',JSON.stringify([
  '👑 ДедБосс выиграл 5000 шишек!','🛷 Маша-Ёлочка поймала 24 подарка','💫 Снежок загадал желание — сбылось!',
  '🎄 ХвойныйБро повесил Жар-птицу!','❄️ Снежная буря накрыла поляну','🎡 Мандаринка сорвала джекпот']));
}
function getMock(k){mockSeed();return JSON.parse(localStorage.getItem(k)||'[]')}

/* ============ КОЛЕСО (точно показывает сектор) ============ */
const WHEEL=[{t:'c',v:50},{t:'c',v:100},{t:'o',v:'rare'},{t:'c',v:250},{t:'c',v:500},{t:'o',v:'epic'},{t:'c',v:150},{t:'c',v:1000}];
const WCOLS=['#2f5fe0','#8b3fd0','#d03a3a','#12a06a','#ff9a3d','#6a5cff','#1fffa4','#ffd86b'];
const SEG=360/8;
let wheelAng=0,wheelSpinning=false;
function drawWheel(){
 const cv=$('wheelCv');if(!cv)return;const ctx=cv.getContext('2d');
 const R=cv.width/2;ctx.clearRect(0,0,cv.width,cv.height);
 WHEEL.forEach((p,i)=>{
  const a0=(wheelAng+i*SEG)*Math.PI/180,a1=a0+SEG*Math.PI/180;
  ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-6,a0,a1);ctx.closePath();
  ctx.fillStyle=WCOLS[i];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(R,R);ctx.rotate(a0+SEG*Math.PI/360);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.t==='c'?String(p.v):(p.v==='rare'?'Редкая':'Эпик.'),R*.63,0);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(R,R,26,0,7);ctx.fillStyle='#0a1a3f';ctx.fill();
 ctx.strokeStyle='#ffd86b';ctx.lineWidth=3;ctx.stroke();
 ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎄',R,R+1);
}
/* индекс сектора под указателем (указатель сверху = 270°) */
function calcIndex(rotDeg){
 let a=(270-rotDeg)%360;if(a<0)a+=360;
 return Math.floor(a/SEG)%8;
}
function spinWheel(viaAd){
 if(wheelSpinning)return;
 if(viaAd){showAdRewarded(()=>doSpin());return}
 if(S.wheelFree<=0){toast('Бесплатные спины кончились — крутите за рекламу 📺');return}
 S.wheelFree--;save();doSpin();
}
function doSpin(){
 wheelSpinning=true;
 const target=rand(0,8-1);
 let fin=270-(target*SEG+SEG/2);          /* целевой центр под указателем */
 fin=((fin%360)+360)%360;
 fin+=360*(3+rand(1,4));
 while(fin<=wheelAng)fin+=360;
 const start=wheelAng,t0=performance.now(),dur=3200;
 (function anim(now){
  const k=Math.min((now-t0)/dur,1),e=1-Math.pow(1-k,3);
  wheelAng=start+(fin-start)*e;drawWheel();
  if(k<1)requestAnimationFrame(anim);
  else{
   wheelAng=((wheelAng%360)+360)%360;wheelSpinning=false;
   const winner=calcIndex(wheelAng);        /* честный расчёт по факту */
   wheelPrize(winner);
  }
 })(performance.now());
}
function wheelPrize(i){
 const p=WHEEL[i];
 if(p.t==='c'){gain(p.v,'wheel');toast('🎡 Выпало: '+p.v+' 🌰');}
 else{const o=mkOrn(p.v);S.bag.push(o);toast('🎡 Выпало: '+o.emoji+' '+o.name+'!');}
 if(p.t==='c'&&p.v===1000)pushEvent('🎡 '+(S.name||'Игрок')+' сорвал джекпот 1000!');
 if(S.name)submitScore();
 save();renderHeader();
}

/* ============ МИНИ-ИГРА: ПОЙМАЙ В САНИ ============ */
let sledRaf=null;
function startSled(){
 stopSled();
 const cv=$('sledCv');if(!cv)return;
 const W=cv.width=cv.clientWidth,H=cv.height=380;
 const ctx=cv.getContext('2d');
 let sledX=W/2,items=[],score=0,lives=3,elapsed=0,spawnT=0,flash=0,shake=0,
     combo=0,comboT=0,magnet=0,shield=false,last=performance.now();
 const move=e=>{
  const r=cv.getBoundingClientRect();
  const x=e.touches?e.touches[0].clientX:e.clientX;
  if(x!==undefined)sledX=Math.max(30,Math.min(W-30,x-r.left));
  e.preventDefault&&e.preventDefault();
 };
 cv.onpointerdown=move;cv.onpointermove=move;
 function end(){
  cancelAnimationFrame(sledRaf);sledRaf=null;
  const rw=score*4;gain(rw,'sled');addXp(score*2);
  if(score>S.catchBest)S.catchBest=score;
  if(S.order&&S.order.t==='catch')progOrder(score);
  toast('🛷 Итог: '+score+' очков → +'+rw+' 🌰');
  if(S.name)submitScore();renderGames();
 }
 function loop(now){
  const dt=Math.min(now-last,50);last=now;
  elapsed+=dt;spawnT+=dt;flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);comboT=Math.max(0,comboT-dt);
  if(comboT<=0)combo=0;
  if(magnet>0)magnet-=dt;
  const prog=elapsed/50000,spd=1+prog*1.8;
  if(spawnT>Math.max(340,620-prog*220)){spawnT=0;
   const r=Math.random();let v='gift';
   if(r>0.93)v='magnet';else if(r>0.89)v='shield';
   else if(r>0.75)v='ice';else if(r>0.55)v='cone';
   items.push({x:rand(24,W-24),y:-24,v,s:.07*spd+Math.random()*.06,ph:Math.random()*6});
  }
  ctx.save();
  if(shake>0)ctx.translate(rand(-3,3),rand(-3,3));
  ctx.fillStyle='#0b1c44';ctx.fillRect(-8,-8,W+16,H+16);
  ctx.fillStyle='rgba(255,255,255,.7)';
  for(let i=0;i<26;i++){const y=(i*57+elapsed*.03)%H;ctx.fillRect((i*97)%W,y,2,2);}
  items.forEach(it=>{
   it.y+=it.s*dt;
   if(magnet>0&&(it.v==='gift'||it.v==='cone')){
    const dx=sledX-it.x;it.x+=Math.sign(dx)*Math.min(Math.abs(dx),dt*.06);it.s*=1.0005;
   }
   it.x+=Math.sin(elapsed/400+it.ph)*.5;
   ctx.font='28px serif';ctx.textAlign='center';
   const em={gift:'🎁',cone:'🌰',ice:'🧊',magnet:'🧲',shield:'🛡️'}[it.v];
   ctx.fillText(em,it.x,it.y);
   if(it.y>H-46&&Math.abs(it.x-sledX)<44){
    if(it.v==='ice'){
     if(shield){shield=false;flash=0;it.y=H+99;floatTxt(ctx,sledX,H-80,'🛡️ Блок!');}
     else{lives--;flash=200;shake=250;combo=0;it.y=H+99;}
    }else if(it.v==='magnet'){magnet=6000;it.y=H+99;floatTxt(ctx,sledX,H-80,'🧲 Магнит!');}
    else if(it.v==='shield'){shield=true;it.y=H+99;floatTxt(ctx,sledX,H-80,'🛡️ Щит!');}
    else{score+=it.v==='gift'?2:1;combo++;comboT=2500;it.y=H+99;
     const bonus=Math.min(3,1+Math.floor(combo/6));
     if(bonus>1)score+=bonus-1;
    }
   }
  });
  items=items.filter(it=>it.y<H+40);
  ctx.font='36px serif';ctx.fillText('🛷',sledX,H-12);
  if(shield){ctx.strokeStyle='rgba(140,220,255,.8)';ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(sledX,H-26,30,0,7);ctx.stroke();}
  if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash/400)+')';ctx.fillRect(0,0,W,H);}
  const cM=combo>5?'  x'+Math.min(3,1+Math.floor(combo/6)):'';
  ctx.fillStyle='#ffd86b';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
  ctx.fillText('🎁 '+score+'   '+'❤️'.repeat(Math.max(lives,0))+'   ⏱ '+Math.ceil((50000-elapsed)/1000)+'с'+(magnet>0?'   🧲':'')+(shield?'   🛡️':'')+cM,10,22);
  ctx.restore();
  if(lives<=0||elapsed>50000){end();return}
  sledRaf=requestAnimationFrame(loop);
 }
 function floatTxt(ctx,x,y,t){ctx.fillStyle='#8fd8ff';ctx.font='bold 13px sans-serif';ctx.textAlign='center';ctx.fillText(t,x,y);}
 sledRaf=requestAnimationFrame(loop);
}
function stopSled(){if(sledRaf){cancelAnimationFrame(sledRaf);sledRaf=null}}

 setTimeout(()=>{if(boss.on&&!boss.dead){$('bossEmoji').classList.remove('shielded');$('bossShield').style.display='none';}},3000);
}
function spawnIcicle(){
 const box=$('bossBox');if(!box)return;
 const el=document.createElement('div');el.className='icicle';el.textContent='🧊';
 el.style.left=rand(12,86)+'%';el.style.top='-30px';
 requestAnimationFrame(()=>el.style.top='82%');
 el.onpointerdown=e=>{e.stopPropagation();el.remove();boss.time=Math.min(boss.time+2,45);paint();};
 el.addEventListener('transitionend',()=>{
  if(!el.isConnected||boss.dead)return;
  boss.php=Math.max(0,boss.php-10);
  const fl=document.createElement('div');fl.className='hitFlash';box.appendChild(fl);
  setTimeout(()=>fl.remove(),400);el.remove();paint();
  if(boss.php<=0)bossEnd(false);
 });
 box.appendChild(el);
}
function bossTap(){
 if(!boss.on||boss.dead)return;
 if(Date.now()<boss.shieldUntil){toast('🛡️ Щит! Дождитесь, пока он спадёт');return}
 const now=Date.now();boss.combo=(now-boss.lastTap<700)?Math.min(boss.combo+1,12):1;boss.lastTap=now;
 let dmg=3+boss.combo;let crit=Math.random()<0.12;
 if(crit)dmg*=3;
 if(Date.now()<S.ghUntil)dmg*=2;
 boss.hp=Math.max(0,boss.hp-dmg);
 dmgFloat(dmg,crit);paint();
 if(boss.hp<=0)bossEnd(true);
}
function dmgFloat(d,crit){
 const box=$('bossBox');if(!box)return;
 const el=document.createElement('div');el.className='dmg';
 el.textContent=crit?'💥'+d:'−'+d;
 el.style.color=crit?'#ffd86b':'#fff';
 el.style.left=(40+rand(0,25))+'%';el.style.top=(30+rand(0,20))+'%';
 el.style.fontSize=crit?'26px':'19px';
 box.appendChild(el);setTimeout(()=>el.remove(),900);
}
function paint(){
 if(!$('bossHp'))return;
 $('bossHp').style.width=(100*boss.hp/boss.hpMax)+'%';
 $('bossPhp').style.width=boss.php+'%';
 $('bossInfo').textContent='❄️ Босс: '+Math.max(boss.hp,0)+' / '+boss.hpMax+'   🧑 Вы: '+Math.max(boss.php,0)+' HP   ⏱ '+boss.time+'с   🔗 x'+(1+Math.min(boss.combo,12));
}
function bossEnd(win){
 boss.dead=true;stopBoss();
 box.querySelectorAll&&null;
 const box=$('bossBox');if(box)box.querySelectorAll('.icicle').forEach(e=>e.remove());
 if(win){
  const rw=600+S.level*25;gain(rw,'boss');addXp(130);S.bossWins++;
  toast('🏆 Снежный босс повержен! +'+rw+' 🌰');
  pushEvent('🏆 '+(S.name||'Игрок')+' победил снежного босса!');
  if(S.name)submitScore();
 }else toast('❄️ Босс выдержал… Тапайте быстрее и уворачивайтесь от 🧊!');
 renderGames();
}

 const pts=[[28,10],[72,19],[116,26],[158,30],[200,25],[242,15],[284,11],[326,14],[368,23],[410,30],[452,25],[494,14],[536,8],[572,6]];
 let g='';

   +'<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+p[0]+'" y2="'+(p[1]+7)+'" stroke="rgba(255,255,255,.4)" stroke-width="1"/>'
   +'<rect x="'+(p[0]-2.5)+'" y="'+(p[1]+6)+'" width="5" height="5" rx="1" fill="#5a5f6e"/>'
   +'<circle class="core" style="animation-delay:'+(i*0.23)+'s" cx="'+p[0]+'" cy="'+(p[1]+17)+'" r="5.5" fill="'+c+'" style2="" filter="url(#gl)"/>'
   +'</g>';
 });
 $('garland').innerHTML='<svg viewBox="0 0 600 44" preserveAspectRatio="none">'
  +'<defs><filter id="gl" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs>'

  +'<path d="M0,5 Q150,36 300,12 Q450,36 600,5" fill="none" stroke="rgba(255,255,255,.18)" stroke-width="1"/>'

}

 if(S.streakDay!==today()){
  const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.streakDay===yest){S.streak++;gain(50+S.streak*25,'streak');toast('🔥 Огонь подряд: день '+S.streak+'! +'+(50+S.streak*25)+' 🌰');}
  else{S.streak=1;gain(50,'streak');toast('🔥 Новый огонь подряд! +50 🌰');}
  S.streakDay=today();
 }
 if(S.wheelDay!==today()){S.wheelFree=3;S.wheelDay=today();}
 if(!S.order)genOrder();
 save();renderHeader();switchTab('tree');
 loadTicker().then(ev=>{if(ev&&ev.length)$('tickerInner').textContent=ev.join('   ✦   ')+'   ✦   ';}).catch(()=>{});
})();
</script>
