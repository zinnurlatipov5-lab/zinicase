 return new Promise(res=>{

 const item=MELODY[musIdx],beat=item[1]*tempo;
 if(item[0]){
  playNote(NOTE[item[0]],Math.min(beat*0.92,900)/1000,story?0.045:0.075,story?'sine':'triangle');
  if(!story){
   playNote(NOTE[item[0]]*0.5,Math.min(beat*0.92,900)/1000,0.03,'sine');
   if(Math.random()<0.3)setTimeout(function(){if(musCtx)playNote(NOTE[item[0]]*2,0.3,0.02,'sine');},beat*0.5);
  }
 }
 if(!story&&musBeat%2===0){
  const bn=NOTE[BASS[Math.floor(musBeat/2)%BASS.length]];
  if(bn)playNote(bn,0.5,0.05,'sine');
 }
 musBeat=(musBeat+1)%32;
 musIdx=(musIdx+1)%MELODY.length;
 musTimer=setTimeout(musLoop,beat);
}
function setMusicMode(m){
 if(!musOn||musMode===m)return;
 musMode=m;musIdx=0;musBeat=0;
 if(musTimer){clearTimeout(musTimer);musTimer=null;}
 musLoop();
}
function toggleMusic(){
 if(musOn){
  musOn=false;musMode='ambient';musIdx=0;musBeat=0;
  if(musTimer){clearTimeout(musTimer);musTimer=null;}
  try{if(musCtx&&musCtx.close)musCtx.close();}catch(e){}
  musCtx=null;S.musOn=false;save();renderHeader();
  toast('♫ Музыка выключена');return;
 }
 try{musCtx=new (window.AudioContext||window.webkitAudioContext)();if(musCtx.state==='suspended')musCtx.resume();}
 catch(e){toast('♫ Аудио недоступно на этом устройстве');return}
 musOn=true;S.musOn=true;save();musIdx=0;musBeat=0;musMode='ambient';
 musLoop();renderHeader();
 toast('♫ «Jingle Bells» — полная версия с басом!');
}

function speakLine(text,npc){
 try{
  if(!('speechSynthesis' in window))return;
  const clean=text.replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,'').replace(/«|»/g,'"');
  if(!clean.trim())return;
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(clean);
  u.lang='ru-RU';
  const v=VOICE[npc]||{p:1,r:1};
  u.pitch=v.p;u.rate=v.r;u.volume=0.9;
  speechSynthesis.speak(u);
 }catch(e){}
}

  +'<button class="btn" onclick="closeModal()">Отложить</button></div>';
 box.innerHTML=h;$('modal').classList.add('show');showBackBtn();
 $('giftSendBtn').onclick=function(){

  const msg=($('giftMsg').value||'').trim();
  const secret=$('giftSecret').checked;
  const express=$('giftExpress').checked;
  if(secret){
   if(S.santaWeek===weekKey()){toast('🥚 Тайный Санта — раз в неделю');return}
  }
  if(express&&!spend(EXPRESS_COST))return;
  $('giftSendBtn').disabled=true;$('giftSendBtn').textContent='Сани летят… ✈️';
  findFriend(nm).then(fr=>{

    $('giftSendBtn').disabled=false;$('giftSendBtn').textContent='🎁 Отправить';
    toast('🔍 Игрок «'+nm+'» не найден — проверьте ник в рейтинге');
    return;
   }
   if(fr.id===S.pid){toast('Себе дарить можно, но лучше другу 🙂');$('giftSendBtn').disabled=false;$('giftSendBtn').textContent='🎁 Отправить';return}
   sendGiftRow(fr,kind,g.n,msg,secret).then(ok=>{
    if(!ok){toast('⚠️ Не отправилось — проверьте сеть');$('giftSendBtn').disabled=false;$('giftSendBtn').textContent='🎁 Отправить';return}
    S.giftsSent++;save();
    if(secret){S.santaWeek=weekKey();save();}
    checkAchs();
    closeModal();
    toast(express?'⚡ Сани Деда Мороза умчались! Подарок у «'+fr.name+'»':'🎁 Подарок отправлен другу '+fr.name+'!');
    if(CUR==='shop')renderShop();
   });
  });
 };
}

function sr(seed){let s=(seed>>>0)||1;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function tierPath(cx,yT,yB,w){
 const dy=yB-yT,n=Math.max(4,Math.round(w/13));
 let p='M '+cx+' '+yT
  +' C '+(cx+w*0.25).toFixed(1)+' '+(yT+dy*0.08).toFixed(1)+' '+(cx+w*0.6).toFixed(1)+' '+(yT+dy*0.45).toFixed(1)+' '+(cx+w).toFixed(1)+' '+yB;
 for(let k=0;k<n;k++){
  const x1=cx+w-k*(2*w/n),x2=cx+w-(k+1)*(2*w/n),xm=(x1+x2)/2;
  p+=' Q '+xm.toFixed(1)+' '+(yB+7).toFixed(1)+' '+x2.toFixed(1)+' '+yB;
 }
 p+=' C '+(cx-w*0.6).toFixed(1)+' '+(yT+dy*0.45).toFixed(1)+' '+(cx-w*0.25).toFixed(1)+' '+(yT+dy*0.08).toFixed(1)+' '+cx+' '+yT+' Z';
 return p;
}
function needleTier(cx,yT,yB,w,si){
 const R=sr(si*7349+11);
 const base=si%2?'#3f8f37':'#4a9e3f',light=si%2?'#5cb04a':'#6fbf4f',dark='#2e6f2a';
 let h='<path d="'+tierPath(cx,yT,yB,w)+'" fill="'+dark+'"/>';
 h+='<path d="'+tierPath(cx,yT,yB-3,w-4)+'" fill="'+base+'"/>';
 h+='<path d="'+tierPath(cx,yT,yB-7,(w-8)*0.62)+'" fill="'+light+'" opacity=".8"/>';
 const fringe=Math.max(5,Math.round(w/16));
 for(let f=0;f<fringe;f++){
  const t=(f+0.5)/fringe,side=f%2?1:-1;
  const bx=cx+side*w*0.92*t,by=yT+(yB-yT)*(0.15+t*0.8);
  h+='<circle cx="'+bx.toFixed(1)+'" cy="'+by.toFixed(1)+'" r="'+(4+R()*4).toFixed(1)+'" fill="'+base+'"/>';
 }
 return h;
}

let gameStop=null;
function fitGameCv(cv){
 cv.width=cv.clientWidth||window.innerWidth;
 cv.height=cv.clientHeight||window.innerHeight;
 return cv;
}
function drawWinterScene(ctx,W,H){
 const g=ctx.createLinearGradient(0,0,0,H);
 g.addColorStop(0,'#0a1740');g.addColorStop(.55,'#12295a');g.addColorStop(1,'#1e3f78');
 ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.fillStyle='rgba(255,255,255,.8)';
 for(let i=0;i<40;i++){ctx.globalAlpha=0.15+((i*37)%10)/18;ctx.fillRect((i*127)%W,(i*89)%(H*0.55),2,2);}
 ctx.globalAlpha=1;
 ctx.fillStyle='#14275a';
 ctx.beginPath();ctx.moveTo(0,H*0.72);ctx.quadraticCurveTo(W*0.25,H*0.58,W*0.5,H*0.72);ctx.quadraticCurveTo(W*0.75,H*0.86,W,H*0.7);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.fillStyle='#e9f2ff';
 ctx.beginPath();ctx.moveTo(0,H*0.84);ctx.quadraticCurveTo(W*0.3,H*0.8,W*0.6,H*0.86);ctx.quadraticCurveTo(W*0.85,H*0.9,W,H*0.85);ctx.lineTo(W,H);ctx.lineTo(0,H);ctx.fill();
 ctx.fillStyle='#0e2f1c';
 [[W*0.07,H*0.8],[W*0.17,H*0.84],[W*0.84,H*0.8],[W*0.94,H*0.86]].forEach(t=>{
  ctx.beginPath();ctx.moveTo(t[0],t[1]-52);ctx.lineTo(t[0]-20,t[1]);ctx.lineTo(t[0]+20,t[1]);ctx.fill();
 });
}

/* ===================== ИГРА 1: САНИ (фуллскрин) ===================== */
function startSledGame(cv,hud){
 fitGameCv(cv);
 const ctx=cv.getContext('2d');
 const W=cv.width,H=cv.height;
 let sledX=W/2,items=[],score=0,lives=3,elapsed=0,spawnT=0,combo=0,comboT=0,magnet=0,shield=false,done=false,raf=null,last=performance.now();
 const DUR=50000;
 function move(e){const x=e.touches?e.touches[0].clientX:e.clientX;if(x!=null)sledX=Math.max(40,Math.min(W-40,x));}
 cv.onpointerdown=move;cv.onpointermove=move;
 function updHud(){hud.textContent='🎁 '+score+'  '+'❤️'.repeat(Math.max(lives,0))+'  ⏱ '+Math.max(0,Math.ceil((DUR-elapsed)/1000))+'с'+(magnet>0?' 🧲':'')+(shield?' 🛡️':'');}
 function finish(){
  done=true;if(raf)cancelAnimationFrame(raf);
  const rw=score*4;
  gain(rw,'sled');addXp(score*2);
  if(score>S.catchBest)S.catchBest=score;
  storyProg('sled',score);dqProg('sled',score);cupAdd(score);
  if(S.order&&S.order.t==='sled')progOrder(score);
  gameResult('🛷','Спуск завершён!','Собрано: '+score+' предметов → +'+rw+' 🌰 · +'+(score*2)+' опыта. Рекорд: '+S.catchBest);
 }
 function loop(now){
  if(done)return;
  const dt=Math.min(now-last,50);last=now;
  elapsed+=dt;spawnT+=dt;comboT=Math.max(0,comboT-dt);if(comboT<=0)combo=0;if(magnet>0)magnet-=dt;
  const prog=elapsed/DUR,spd=1+prog*1.7;
  if(spawnT>Math.max(320,640-prog*220)&&items.length<14){spawnT=0;
   const r=Math.random();let v='gift';
   if(r>0.93)v='magnet';else if(r>0.89)v='shield';else if(r>0.76)v='ice';else if(r>0.56)v='cone';
   items.push({x:rand(40,W-40),y:-30,v:v,s:(0.07*spd+Math.random()*0.05)*H/420,ph:Math.random()*6.3});
  }
  drawWinterScene(ctx,W,H);
  items.forEach(it=>{
   it.y+=it.s*dt;
   if(magnet>0&&(it.v==='gift'||it.v==='cone')){const dx=sledX-it.x;it.x+=Math.sign(dx)*Math.min(Math.abs(dx),dt*0.06);}
   ctx.font='30px serif';ctx.textAlign='center';
   ctx.fillText(it.v==='gift'?'🎁':it.v==='cone'?'🌰':it.v==='ice'?'🧊':it.v==='magnet'?'🧲':'🛡️',it.x,it.y);
   if(it.y>H-78&&Math.abs(it.x-sledX)<52){
    if(it.v==='ice'){if(shield){shield=false;it.y=H+99;}else{lives--;combo=0;it.y=H+99;}}
    else if(it.v==='magnet'){magnet=6000;it.y=H+99;}
    else if(it.v==='shield'){shield=true;it.y=H+99;}
    else{score+=it.v==='gift'?2:1;combo++;comboT=2500;if(combo>5&&combo%6===0)score+=1;}
    updHud();
   }
  });
  items=items.filter(it=>it.y<H+40);
  ctx.font='44px serif';ctx.textAlign='center';
  ctx.fillText('🛷',sledX,H-30);
  if(shield){ctx.strokeStyle='rgba(140,220,255,.85)';ctx.lineWidth=3;ctx.beginPath();ctx.arc(sledX,H-46,36,0,7);ctx.stroke();}
  if(lives<=0||elapsed>=DUR){finish();return}
  raf=requestAnimationFrame(loop);
 }
 updHud();
 raf=requestAnimationFrame(loop);
 gameStop=function(){done=true;if(raf)cancelAnimationFrame(raf);};
}

/* ===================== ИГРА 2: СНЕЖКИ (фуллскрин) ===================== */
function startBallsGame(cv,hud){
 fitGameCv(cv);
 const ctx=cv.getContext('2d');
 const W=cv.width,H=cv.height;
 let score=0,time=30,balls=[],pops=[],done=false,raf=null,timer=null,spawnAcc=0,last=performance.now();
 const COLS={snow:'#cfe6ff',bomb:'#ff6b6b',gold:'#ffd86b',freeze:'#8fd4ff'};
 function updHud(){hud.textContent='❄️ '+score+'  ⏱ '+time+'с';}
 function spawn(){
  if(balls.length>=10)return;
  const r=Math.random();let v='snow',rad=26;
  if(r>0.88){v='bomb';rad=24;}else if(r>0.84){v='freeze';rad=22;}else if(r>0.78){v='gold';rad=20;}
  balls.push({v:v,x:rand(rad+10,W-rad-10),y:rand(rad+50,H-rad-30),vx:(Math.random()-0.5)*0.18,vy:(Math.random()-0.5)*0.15,rad:rad,ph:Math.random()*6.3});
 }
 function finish(){
  if(done)return;done=true;
  if(raf)cancelAnimationFrame(raf);if(timer)clearInterval(timer);
  const rw=score*3;
  gain(rw,'balls');addXp(score*2);
  dqProg('balls',score);storyProg('balls',score);cupAdd(score);ballSeasonAdd(score);
  gameResult('⛄','Раунд окончен!','Снежков лопнуто: '+score+' → +'+rw+' 🌰 · в сезон Снежной недели зачтено '+score+' очков');
 }
 cv.onpointerdown=e=>{
  const rect=cv.getBoundingClientRect();
  const x=e.clientX-rect.left,y=e.clientY-rect.top;
  for(let i=balls.length-1;i>=0;i--){
   const b=balls[i],dx=x-b.x,dy=y-b.y;
   if(dx*dx+dy*dy<=b.rad*b.rad){
    if(b.v==='bomb')score=Math.max(0,score-5);
    else if(b.v==='gold')score+=5;
    else if(b.v==='freeze')time+=2;
    else score+=2;
    pops.push({x:b.x,y:b.y,r:b.rad,a:1,c:COLS[b.v]});
    balls.splice(i,1);updHud();break;
   }
  }
 };
 timer=setInterval(()=>{time--;updHud();if(time<=0)finish();},1000);
 function loop(now){
  if(done)return;
  const dt=Math.min(now-last,50);last=now;
  spawnAcc+=dt;
  if(spawnAcc>Math.max(420,700-time*8)){spawnAcc=0;spawn();}
  drawWinterScene(ctx,W,H);
  pops.forEach(p=>{p.r+=dt*0.12;p.a=Math.max(0,p.a-dt/400);
   ctx.globalAlpha=p.a;ctx.strokeStyle=p.c;ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,7);ctx.stroke();ctx.globalAlpha=1;});
  pops=pops.filter(p=>p.a>0);
  balls.forEach(b=>{
   b.x+=b.vx*dt;b.y+=b.vy*dt;
   if(b.x<b.rad||b.x>W-b.rad)b.vx*=-1;
   if(b.y<b.rad+40||b.y>H-b.rad-20)b.vy*=-1;
   const wob=Math.sin(b.ph+now/500)*3;
   const grad=ctx.createRadialGradient(b.x-6+wob,b.y-8,3,b.x,b.y,b.rad);
   grad.addColorStop(0,'#ffffff');grad.addColorStop(1,COLS[b.v]);
   ctx.beginPath();ctx.arc(b.x+wob,b.y,b.rad,0,7);
   ctx.fillStyle=grad;ctx.fill();
   ctx.strokeStyle='rgba(255,255,255,.6)';ctx.lineWidth=1.5;ctx.stroke();
   ctx.font='16px serif';ctx.textAlign='center';ctx.textBaseline='middle';
   ctx.fillText(b.v==='bomb'?'💣':b.v==='gold'?'⭐':b.v==='freeze'?'⏱️':'❄️',b.x+wob,b.y);
   ctx.textBaseline='alphabetic';
  });
  if(done)return;
  raf=requestAnimationFrame(loop);
 }
 updHud();
 raf=requestAnimationFrame(loop);
 gameStop=function(){done=true;if(raf)cancelAnimationFrame(raf);if(timer)clearInterval(timer);};
}

/* ===================== ИГРА 3: СНЕЖНАЯ КРЕПОСТЬ (босс, фуллскрин) ===================== */
function startFortressGame(cv,hud){
 fitGameCv(cv);
 const ctx=cv.getContext('2d');
 const W=cv.width,H=cv.height;
 const fx=W/2,fy=H*0.3,fw=Math.min(W*0.34,190),fh=70;
 let hpMax=180+S.level*14,hp=hpMax,hearts=5,time=60,shieldHp=0,shieldT=0;
 let thrown=[],lobs=[],puffs=[],done=false,raf=null,timer=null,last=performance.now();
 let combo=0,lastTap=0,lobT=1600;
 function updHud(){hud.textContent='🧊 Крепость: '+Math.max(hp,0)+'  '+'❤️'.repeat(Math.max(hearts,0))+'  ⏱ '+Math.max(time,0)+'с'+(shieldHp>0?' 🛡️':'');}
 function finish(win){
  if(done)return;done=true;
  if(raf)cancelAnimationFrame(raf);if(timer)clearInterval(timer);
  if(win){
   const rw=600+S.level*25;
   gain(rw,'fort');addXp(130);S.bossWins++;
   dqProg('boss',1);storyProg('boss',1);cupAdd(80);
   gameResult('🏆','Крепость пала!','Страж уснул со смеху. +'+rw+' 🌰 · +130 опыта · Кубок: +80 очков');
  }else{
   gameResult('❄️','Крепость устояла','Крепость крепче, чем кажется. Попробуйте ещё — тапайте быстро, держите комбо и уворачивайтесь!');
  }
 }
 cv.onpointerdown=e=>{
  if(done)return;
  const rect=cv.getBoundingClientRect();
  const tx=e.clientX-rect.left,ty=e.clientY-rect.top;
  const now=Date.now();
  combo=(now-lastTap<800)?Math.min(combo+1,10):1;lastTap=now;
  thrown.push({x:W/2,y:H-70,tx:tx,ty:ty,t:0});
 };
 timer=setInterval(()=>{time--;updHud();if(time<=0)finish(false);},1000);
 function loop(now){
  if(done)return;
  const dt=Math.min(now-last,50);last=now;
  comboT=Date.now();shieldT-=dt;lobT-=dt;
  if(shieldHp<=0&&shieldT<=0){shieldHp=8;shieldT=4200;}
  if(lobT<=0){lobT=Math.max(900,1700-time*12);
   lobs.push({x:fx+rand(-fw/2,fw/2),y:fy,tx:sledPlayerX(),vy:(0.12+Math.random()*0.05)*(1+time/120),r:16});}
  drawWinterScene(ctx,W,H);
  // крепость
  ctx.fillStyle='#5f7fae';
  ctx.beginPath();ctx.roundRect?ctx.roundRect(fx-fw/2,fy-fh/2,fw,fh,12):ctx.rect(fx-fw/2,fy-fh/2,fw,fh);ctx.fill();
  ctx.fillStyle='#7a99c9';
  ctx.fillRect(fx-fw/2-14,fy-fh/2-16,20,fh+16);
  ctx.fillRect(fx+fw/2-6,fy-fh/2-16,20,fh+16);
  for(let r2=0;r2<3;r2++)for(let c2=0;c2<5;c2++){
   ctx.fillStyle=(r2+c2)%2?'#4f6f9e':'#6a8abd';
   ctx.fillRect(fx-fw/2+4+c2*(fw-8)/5,fy-fh/2+6+r2*22,(fw-8)/5-4,18);
  }
  ctx.font='34px serif';ctx.textAlign='center';
  ctx.fillText('🧊',fx,fy+12);
  if(shieldHp>0){
   ctx.strokeStyle='rgba(150,220,255,.9)';ctx.lineWidth=4;
   ctx.beginPath();ctx.arc(fx,fy,fw*0.72,0,7);ctx.stroke();
   ctx.fillStyle='#fff';ctx.font='bold 14px sans-serif';
   ctx.fillText('щит '+shieldHp,fx,fy-fh/2-24);
  }
  // полоски HP крепости
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(fx-fw/2,fy-fh/2-34,fw,10);
  ctx.fillStyle='#ff5f5f';ctx.fillRect(fx-fw/2,fy-fh/2-34,fw*Math.max(0,hp/hpMax),10);
  // снежки игрока
  thrown.forEach(t=>{t.t+=dt/420;
   const mx=(t.x+t.tx)/2,my=Math.min(t.y,t.ty)-90;
   const u=t.t,iu=1-u;
   t.cx=iu*iu*t.x+2*iu*u*mx+u*u*t.tx;
   t.cy=iu*iu*t.y+2*iu*u*my+u*u*t.ty;});
  thrown.forEach(t=>{
   ctx.beginPath();ctx.arc(t.cx,t.cy,9,0,7);ctx.fillStyle='#fff';ctx.fill();
   ctx.strokeStyle='rgba(120,180,255,.7)';ctx.lineWidth=2;ctx.stroke();});
  thrown=thrown.filter(t=>{
   if(t.t<1)return true;
   if(Math.abs(t.tx-fx)<fw/2+16&&Math.abs(t.ty-fy)<fh/2+22){
    let d=4+combo;const crit=Math.random()<0.12;
    if(crit)d*=3;
    if(shieldHp>0){shieldHp-=1;updHud();return false;}
    hp=Math.max(0,hp-d);
    puffs.push({x:t.tx,y:t.ty,txt:crit?'💥'+d:'−'+d,c:crit?'#ffd86b':'#fff',a:1});
    updHud();
    if(hp<=0)finish(true);
   }else puffs.push({x:t.tx,y:t.ty,txt:'мимо',c:'rgba(255,255,255,.6)',a:1});
   return false;
  });
  // обстрел крепости
  const px=sledPlayerX();
  lobs.forEach(l=>{l.y+=l.vy*dt;
   if(l.tx===undefined)l.tx=px;
   const drift=(px-l.tx)*Math.min(1,l.y/(H*0.7));
   const lx=l.x+drift;
   ctx.beginPath();ctx.arc(lx,l.y,l.r,0,7);ctx.fillStyle='#fff';ctx.fill();
   ctx.strokeStyle='rgba(120,180,255,.6)';ctx.lineWidth=2;ctx.stroke();
   if(l.y>H-56&&Math.abs(lx-px)<46){
    l.y=H+99;hearts--;puffs.push({x:px,y:H-90,txt:'−1 ❤️',c:'#ff6b6b',a:1});updHud();
    if(hearts<=0)finish(false);
   }});
  lobs=lobs.filter(l=>l.y<H+40);
  // снеговик-игрок
  const sw=Math.sin(now/300)*6;
  ctx.font='40px serif';ctx.fillText('⛄',px+sw,H-26);
  // всплывающий урон
  puffs.forEach(p=>{p.a-=dt/800;p.y-=dt*0.05;
   ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;
   ctx.font='bold 20px sans-serif';ctx.fillText(p.txt,p.x,p.y);ctx.globalAlpha=1;});
  puffs=puffs.filter(p=>p.a>0);
  if(done)return;
  raf=requestAnimationFrame(loop);
 }
 function sledPlayerX(){return W/2;}

const WHEEL=[{t:'c',v:50},{t:'c',v:100},{t:'o',v:'rare'},{t:'c',v:250},{t:'c',v:500},{t:'o',v:'epic'},{t:'c',v:150},{t:'c',v:1000}];
const WCOLS=['#2f5fe0','#8b3fd0','#d03a3a','#12a06a','#ff9a3d','#6a5cff','#1fffa4','#ffd86b'];
const SEG=45;
let wheelAng=0,wheelSpinning=false;
function drawWheel(){
 const cv=$('wheelCv');if(!cv)return;const ctx=cv.getContext('2d');
 const R=cv.width/2;ctx.clearRect(0,0,cv.width,cv.height);
 WHEEL.forEach((p,i)=>{
  const a0=(wheelAng+i*SEG)*Math.PI/180,a1=a0+SEG*Math.PI/180;
  ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-6,a0,a1);ctx.closePath();
  ctx.fillStyle=WCOLS[i];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(R,R);ctx.rotate(a0+SEG*Math.PI/360);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.t==='c'?String(p.v):(p.v==='rare'?'Редкая':'Эпик.'),R*.63,0);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(R,R,26,0,7);ctx.fillStyle='#0a1a3f';ctx.fill();
 ctx.strokeStyle='#ffd86b';ctx.lineWidth=3;ctx.stroke();
 ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎄',R,R+1);
}
function calcIndex(rotDeg){let a=(270-rotDeg)%360;if(a<0)a+=360;return Math.floor(a/SEG)%8;}
function spinWheel(viaAd){
 if(wheelSpinning)return;
 if(viaAd){showAdRewarded(()=>doSpin());return}
 if(S.wheelFree<=0){toast('Бесплатные спины кончились — крутите за рекламу 📺');return}
 S.wheelFree--;save();doSpin();
}
function doSpin(){
 wheelSpinning=true;
 const target=rand(0,7);
 let fin=270-(target*SEG+SEG/2);
 fin=((fin%360)+360)%360+360*(3+rand(1,4));
 while(fin<=wheelAng)fin+=360;
 const start=wheelAng,t0=performance.now(),dur=3200;
 (function anim(now){
  const k=Math.min((now-t0)/dur,1),e=1-Math.pow(1-k,3);
  wheelAng=start+(fin-start)*e;drawWheel();
  if(k<1)requestAnimationFrame(anim);
  else{wheelAng=((wheelAng%360)+360)%360;wheelSpinning=false;wheelPrize(calcIndex(wheelAng));}
 })(performance.now());
}
function wheelPrize(i){
 storyProg('wheel',1);
 const p=WHEEL[i];
 if(p.t==='c'){gain(p.v,'wheel');toast('🎡 Выпало: '+p.v+' 🌰');}
 else{const o=mkOrn(p.v);S.bag.push(o);toast('🎡 Выпало: '+o.emoji+' '+o.name+'!');}
 save();renderHeader();
}

 for(let i=0;i<10;i++)h+='<span style="left:'+rand(0,98)+'%;animation-duration:'+rand(9,17)+'s;animation-delay:-'+rand(0,16)+'s;font-size:'+rand(10,15)+'px">❄️</span>';
 $('snow').innerHTML=h;
}
const TICKER_MSGS=[
 '🎄 Добро пожаловать на Ёлку Зини!',
 PRIZES_TEXT,
 '🏆 Рейтинг Хранителей ждёт — меряйтесь уровнями с друзьями',
 '🎁 Отправьте другу плюшевого мишку с тёплым словом',
 '🥚 Тайный Санта раз в неделю: анонимный подарок + угадывание',
 '⚡ Экспресс-доставка: сани Деда Мороза летят мгновенно',
 '🔔 Когда мир повесит 10 000 игрушек — Золотой праздник ×2 для всех',
 '🏰 Штурмуйте Снежную крепость на весь экран',
 '✨ Ловите золотую искру прямо на ёлке — это +100 🌰',
 '🎡 Крутите колесо за рекламу — бесплатный лимит не тратится',
 '💰 Каждое видео — +300 🌰 по заданию спонсора, без лимита',
 '📋 Три задания дня + Дед-квест с двойной наградой',
 '🏆 Собирайте коллекции — постоянный бонус к наградам',
 '📖 Пройдите 8 глав истории и узнайте правду о Моране',
 '❄️ Снежная неделя: все очки за снежки — в общий зачёт сезона'
];

/* ===================== ТИК ===================== */
setInterval(()=>{
 maybeEvents();
 if(CUR==='tree'&&Date.now()>S.sparkAt)spawnSpark();
 renderHeader();
},15000);

/* ===================== ИНИТ ===================== */
(function init(){
 snowfall();renderTabs();
 $('tickerInner').textContent=TICKER_MSGS.join('   ✦   ')+'   ✦   ';
 if(S.streakDay!==today()){
  const yest=new Date(Date.now()-86400000).toISOString().slice(0,10);
  if(S.streakDay===yest){S.streak++;gain(50+S.streak*25,'streak');toast('🔥 Огонь подряд: день '+S.streak+'! +'+(50+S.streak*25)+' 🌰');}
  else{S.streak=1;gain(50,'streak');toast('🔥 Новый огонь подряд! +50 🌰');}
  S.streakDay=today();
 }
 if(S.wheelDay!==today()){S.wheelFree=3;S.wheelDay=today();}
 if(!S.order)genOrder();
 seedStatsRow();syncPlayer();
 save();renderHeader();switchTab('tree');
 setTimeout(checkIncomingGifts,1500);
 setInterval(function(){
  renderHeader();
  if(CUR==='rate')renderRate();
 },60000);
})();
</script>
