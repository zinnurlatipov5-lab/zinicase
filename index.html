let _agLoading=false,_adCtrl=null,_adBusy=false;
function loadAdsgramSdk(){
 return new Promise(res=>{
  if(window.Adsgram){res(true);return}
  if(_agLoading){
   const iv=setInterval(()=>{if(window.Adsgram){clearInterval(iv);res(true)}},100);
   setTimeout(()=>{clearInterval(iv);res(!!window.Adsgram)},8000);
   return;
  }
  _agLoading=true;
  let settled=false;
  const done=ok=>{if(!settled){settled=true;_agLoading=false;res(ok)}};
  const t=setTimeout(()=>done(!!window.Adsgram),8000);
  try{
   const s=document.createElement('script');
   s.src='https://sad.adsgram.ai/js/sad.min.js';

 });

 if(!window.Adsgram||!AG_CFG.blockId)return null;

/* ===================== ОБЩИЙ ЗАРАБОТОК (Supabase REST) ===================== */
function supaHeaders(){
 return{'apikey':SUPA_CFG.key,'Authorization':'Bearer '+SUPA_CFG.key,'Content-Type':'application/json'};
}
function fetchGlobalEarn(){
 if(!SUPA_CFG.url||!SUPA_CFG.key)return Promise.resolve({err:'SUPA_CFG не заполнен'});
 return fetch(SUPA_CFG.url+'/rest/v1/global_stats?select=ad_views,ad_tasks&id=eq.1',{headers:supaHeaders()})
  .then(function(r){
   if(!r.ok)return r.text().then(function(){return {err:'HTTP '+r.status+' (нет доступа или нет таблицы)'};});
   return r.json().then(function(d){
    if(d&&d.length)return{views:d[0].ad_views||0,tasks:d[0].ad_tasks||0};
    return {err:'таблица пуста — выполните SQL вставку строки'};
   });
  })
  .catch(function(){return {err:'сеть недоступна'};});
}
function bumpGlobal(field){
 if(!SUPA_CFG.url||!SUPA_CFG.key)return;
 fetch(SUPA_CFG.url+'/rest/v1/rpc/bump_stat',{method:'POST',headers:supaHeaders(),body:JSON.stringify({field:field,by:1})})
  .then(function(r){if(r.ok){if(CUR==='earn')updateEarn();return;}fallbackBump(field);})
  .catch(function(){fallbackBump(field);});
}
/* Запасной способ без SQL-функции: читаем строку и увеличиваем счётчик */
function fallbackBump(field){
 fetch(SUPA_CFG.url+'/rest/v1/global_stats?select=id,ad_views,ad_tasks&id=eq.1',{headers:supaHeaders()})
  .then(function(r){return r.ok?r.json():null;})
  .then(function(d){
   if(!d||!d.length)return;
   const patch={};
   if(field==='views')patch.ad_views=(d[0].ad_views||0)+1;
   else patch.ad_tasks=(d[0].ad_tasks||0)+1;
   return fetch(SUPA_CFG.url+'/rest/v1/global_stats?id=eq.1',{method:'PATCH',headers:supaHeaders(),body:JSON.stringify(patch)});
  })
  .then(function(){if(CUR==='earn')updateEarn();})
  .catch(function(){});
}
function registerAdView(){S.adViews++;save();bumpGlobal('views');}
function registerTask(){S.adTasks++;save();bumpGlobal('tasks');}
function earnEstimateUsd(v,t){return (v!==undefined?v:S.adViews)*EARN_CFG.perViewUsd+(t!==undefined?t:S.adTasks)*EARN_CFG.perTaskUsd;}
function earnEstimateRub(v,t){return earnEstimateUsd(v,t)*USD_RATE;}

/* ===================== МУЗЫКА: «Jingle Bells» + тихая мелодия для сюжета ===================== */
let musCtx=null,musTimer=null,musOn=false,musMode='ambient',musIdx=0;
const NOTE={C4:261.6,D4:293.7,E4:329.6,F4:349.2,G4:392,A4:440,B4:493.9,C5:523.3};
const MELODY=[
 ['E4',1],['E4',1],['E4',2],['E4',1],['E4',1],['E4',2],
 ['E4',1],['G4',1],['C4',1.5],['D4',0.5],['E4',3],[0,1],
 ['F4',0.75],['F4',0.25],['F4',0.5],['F4',0.5],['F4',1],['E4',1],
 ['E4',1.5],['E4',0.5],['D4',1],['D4',1],['E4',1],['D4',2],['G4',2],[0,2]
];
function playNote(f,d,vol,wave){
 try{
  const o=musCtx.createOscillator(),g=musCtx.createGain();
  o.type=wave||'triangle';o.frequency.value=f;
  g.gain.setValueAtTime(0.0001,musCtx.currentTime);
  g.gain.exponentialRampToValueAtTime(vol,musCtx.currentTime+0.06);
  g.gain.exponentialRampToValueAtTime(0.0001,musCtx.currentTime+d);
  o.connect(g);g.connect(musCtx.destination);
  o.start();o.stop(musCtx.currentTime+d+0.05);
 }catch(e){}
}
function musLoop(){
 if(!musOn||!musCtx)return;
 const tempo=musMode==='story'?620:330;
 const item=MELODY[musIdx],beat=item[1]*tempo;
 if(item[0]){
  playNote(NOTE[item[0]],Math.min(beat*0.92,900)/1000,musMode==='story'?0.045:0.07,musMode==='story'?'sine':'triangle');
  if(musMode==='ambient'&&Math.random()<0.25){
   setTimeout(function(){if(musCtx)playNote(NOTE[item[0]]*2,0.3,0.02,'sine');},beat*0.5);
  }
 }
 musIdx=(musIdx+1)%MELODY.length;
 musTimer=setTimeout(musLoop,beat);
}
function setMusicMode(m){
 if(!musOn||musMode===m)return;
 musMode=m;musIdx=0;
 if(musTimer){clearTimeout(musTimer);musTimer=null;}
 musLoop();
}
function toggleMusic(){
 if(musOn){
  musOn=false;musMode='ambient';musIdx=0;
  if(musTimer){clearTimeout(musTimer);musTimer=null;}
  try{if(musCtx&&musCtx.close)musCtx.close();}catch(e){}
  musCtx=null;S.musOn=false;save();renderHeader();
  toast('♫ Музыка выключена');return;
 }
 try{
  musCtx=new (window.AudioContext||window.webkitAudioContext)();
  if(musCtx.state==='suspended')musCtx.resume();
 }catch(e){toast('♫ Аудио недоступно на этом устройстве');return}
 musOn=true;S.musOn=true;save();musIdx=0;musMode='ambient';
 musLoop();renderHeader();
 toast('♫ «Jingle Bells» включена — новогоднее настроение!');
}

const WHEEL=[{t:'c',v:50},{t:'c',v:100},{t:'o',v:'rare'},{t:'c',v:250},{t:'c',v:500},{t:'o',v:'epic'},{t:'c',v:150},{t:'c',v:1000}];
const WCOLS=['#2f5fe0','#8b3fd0','#d03a3a','#12a06a','#ff9a3d','#6a5cff','#1fffa4','#ffd86b'];
const SEG=45;
let wheelAng=0,wheelSpinning=false;
function drawWheel(){
 const cv=$('wheelCv');if(!cv)return;const ctx=cv.getContext('2d');
 const R=cv.width/2;ctx.clearRect(0,0,cv.width,cv.height);
 WHEEL.forEach((p,i)=>{
  const a0=(wheelAng+i*SEG)*Math.PI/180,a1=a0+SEG*Math.PI/180;
  ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-6,a0,a1);ctx.closePath();
  ctx.fillStyle=WCOLS[i];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(R,R);ctx.rotate(a0+SEG*Math.PI/360);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.t==='c'?String(p.v):(p.v==='rare'?'Редкая':'Эпик.'),R*.63,0);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(R,R,26,0,7);ctx.fillStyle='#0a1a3f';ctx.fill();
 ctx.strokeStyle='#ffd86b';ctx.lineWidth=3;ctx.stroke();
 ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎄',R,R+1);
}
function calcIndex(rotDeg){
 let a=(270-rotDeg)%360;if(a<0)a+=360;
 return Math.floor(a/SEG)%8;
}
function spinWheel(viaAd){
 if(wheelSpinning)return;
 if(viaAd){showAdRewarded(()=>doSpin());return}
 if(S.wheelFree<=0){toast('Бесплатные спины кончились — крутите за рекламу 📺');return}
 S.wheelFree--;save();doSpin();
}
function doSpin(){
 wheelSpinning=true;
 const target=rand(0,7);
 let fin=270-(target*SEG+SEG/2);
 fin=((fin%360)+360)%360+360*(3+rand(1,4));
 while(fin<=wheelAng)fin+=360;
 const start=wheelAng,t0=performance.now(),dur=3200;
 (function anim(now){
  const k=Math.min((now-t0)/dur,1),e=1-Math.pow(1-k,3);
  wheelAng=start+(fin-start)*e;drawWheel();
  if(k<1)requestAnimationFrame(anim);
  else{wheelAng=((wheelAng%360)+360)%360;wheelSpinning=false;wheelPrize(calcIndex(wheelAng));}
 })(performance.now());
}
function wheelPrize(i){
 storyProg('wheel',1);
 const p=WHEEL[i];
 if(p.t==='c'){gain(p.v,'wheel');toast('🎡 Выпало: '+p.v+' 🌰');}
 else{const o=mkOrn(p.v);S.bag.push(o);toast('🎡 Выпало: '+o.emoji+' '+o.name+'!');}
 save();renderHeader();
}

let sledRaf=null;
function startSled(){
 stopSled();
 const cv=$('sledCv');if(!cv)return;
 const W=cv.width=Math.min(cv.clientWidth||360,420),H=cv.height=320;
 const ctx=cv.getContext('2d');
 let sledX=W/2,items=[],score=0,lives=3,elapsed=0,spawnT=0,flash=0,
     combo=0,comboT=0,magnet=0,shield=false,last=performance.now();
 const move=e=>{
  const r=cv.getBoundingClientRect();
  const x=e.touches?e.touches[0].clientX:e.clientX;
  if(x!==undefined)sledX=Math.max(30,Math.min(W-30,x-r.left));
  e.preventDefault&&e.preventDefault();
 };
 cv.onpointerdown=move;cv.onpointermove=move;
 function end(){
  cancelAnimationFrame(sledRaf);sledRaf=null;
  const rw=score*4;gain(rw,'sled');addXp(score*2);
  if(score>S.catchBest)S.catchBest=score;
  if(S.order&&S.order.t==='sled')progOrder(score);
  storyProg('sled',score);dqProg('sled',score);
  toast('🛷 Итог: '+score+' → +'+rw+' 🌰');
  renderGames();
 }
 function loop(now){
  const dt=Math.min(now-last,50);last=now;
  elapsed+=dt;spawnT+=dt;flash=Math.max(0,flash-dt);comboT=Math.max(0,comboT-dt);
  if(comboT<=0)combo=0;
  if(magnet>0)magnet-=dt;
  const prog=elapsed/50000,spd=1+prog*1.7;
  if(spawnT>Math.max(380,640-prog*200)&&items.length<10){spawnT=0;
   const r=Math.random();let v='gift';
   if(r>0.93)v='magnet';else if(r>0.89)v='shield';
   else if(r>0.76)v='ice';else if(r>0.56)v='cone';
   items.push({x:rand(24,W-24),y:-24,v:v,s:.07*spd+Math.random()*.05});
  }
  ctx.fillStyle='#0b1c44';ctx.fillRect(0,0,W,H);
  for(let i=0;i<items.length;i++){
   const it=items[i];it.y+=it.s*dt;
   if(magnet>0&&(it.v==='gift'||it.v==='cone')){
    const dx=sledX-it.x;it.x+=Math.sign(dx)*Math.min(Math.abs(dx),dt*.06);
   }
   ctx.font='26px serif';ctx.textAlign='center';
   ctx.fillText(it.v==='gift'?'🎁':it.v==='cone'?'🌰':it.v==='ice'?'🧊':it.v==='magnet'?'🧲':'🛡️',it.x,it.y);
   if(it.y>H-44&&Math.abs(it.x-sledX)<42){
    if(it.v==='ice'){
     if(shield){shield=false;it.y=H+99;}
     else{lives--;flash=200;combo=0;it.y=H+99;}
    }else if(it.v==='magnet'){magnet=6000;it.y=H+99;}
    else if(it.v==='shield'){shield=true;it.y=H+99;}
    else{score+=it.v==='gift'?2:1;combo++;comboT=2500;
     if(combo>5&&combo%6===0)score+=1;}
   }
  }
  items=items.filter(it=>it.y<H+40);
  ctx.font='34px serif';ctx.fillText('🛷',sledX,H-10);
  if(shield){ctx.strokeStyle='rgba(140,220,255,.8)';ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(sledX,H-24,28,0,7);ctx.stroke();}
  if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash/400)+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#ffd86b';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
  ctx.fillText('🎁 '+score+'   '+'❤️'.repeat(Math.max(lives,0))+'   ⏱ '+Math.ceil((50000-elapsed)/1000)+'с'+(magnet>0?' 🧲':'')+(shield?' 🛡️':''),10,22);
  if(lives<=0||elapsed>50000){end();return}
  sledRaf=requestAnimationFrame(loop);
 }
 sledRaf=requestAnimationFrame(loop);
}
function stopSled(){if(sledRaf){cancelAnimationFrame(sledRaf);sledRaf=null}}

let ballRaf=null,ballTimer=null;
function startBalls(){
 stopBalls();
 const f=$('ballField');if(!f)return;
 f.innerHTML='<div id="ballInfo">❄️ 0 · ⏱ 25с</div>';
 let score=0,time=25,last=performance.now(),balls=[],id=0,acc=0;
 const info=$('ballInfo');
 const upd=()=>info.textContent='❄️ '+score+' · ⏱ '+time+'с';
 function spawn(){
  if(balls.length>=7)return;
  const r=Math.random();let v='snow';
  if(r>0.88)v='bomb';else if(r>0.84)v='freeze';else if(r>0.78)v='gold';
  const el=document.createElement('div');el.className='pop';
  el.textContent={snow:'❄️',bomb:'💣',freeze:'⏱️',gold:'⭐'}[v];
  const b={id:++id,v:v,x:rand(6,80),y:rand(10,70),vx:(Math.random()-0.5)*10,vy:rand(4,14),el:el};
  balls.push(b);el.style.left=b.x+'%';el.style.top=b.y+'%';
  el.onpointerdown=()=>{
   if(b.v==='bomb')score=Math.max(0,score-5);
   else if(b.v==='gold')score+=5;
   else if(b.v==='freeze')time+=2;
   else score+=2;
   balls=balls.filter(bb=>bb!==b);el.remove();upd();
  };
  f.appendChild(el);
  setTimeout(()=>{if(balls.includes(b)){balls=balls.filter(bb=>bb!==b);el.remove();}},2600);
 }
 ballRaf=requestAnimationFrame(function loop(now){
  const dt=Math.min(now-last,50);last=now;acc+=dt;
  if(acc>Math.max(450,650-(25-time)*10)){acc=0;spawn();}
  for(let i=0;i<balls.length;i++){
   const b=balls[i];
   b.x+=b.vx*dt/100;b.y+=b.vy*dt/100;
   if(b.x<2||b.x>88)b.vx*=-1;
   if(b.y<8)b.vy=Math.abs(b.vy);if(b.y>78)b.vy=-Math.abs(b.vy);
   b.el.style.left=b.x+'%';b.el.style.top=b.y+'%';
  }
  ballRaf=requestAnimationFrame(loop);
 });
 ballTimer=setInterval(()=>{time--;upd();
  if(time<=0){stopBalls();
   const rw=score*3;gain(rw,'balls');addXp(score*2);
   dqProg('balls',score);storyProg('balls',score);
   toast('⛄ Итог: '+score+' → +'+rw+' 🌰');
   renderGames();
  }},1000);
}
function stopBalls(){if(ballRaf){cancelAnimationFrame(ballRaf);ballRaf=null}
 if(ballTimer){clearInterval(ballTimer);ballTimer=null}}

function tierPath(cx,yT,yB,w){
 const teeth=6,step=w/teeth,dy=yB-yT;
 let p='M '+cx+' '+yT
  +' Q '+(cx+w*0.5).toFixed(1)+' '+(yT+dy*0.12).toFixed(1)+' '+(cx+w).toFixed(1)+' '+yB;
 for(let k=0;k<teeth;k++){
  p+=' L '+(cx+w-k*step).toFixed(1)+' '+yB+' L '+(cx+w-(k+0.5)*step).toFixed(1)+' '+(yB-9);
 }
 p+=' L '+cx+' '+yB;
 for(let k=0;k<teeth;k++){
  p+=' L '+(cx-(k+0.5)*step).toFixed(1)+' '+(yB-9)+' L '+(cx-(k+1)*step).toFixed(1)+' '+yB;
 }
 p+=' Q '+(cx-w*0.5).toFixed(1)+' '+(yT+dy*0.12).toFixed(1)+' '+cx+' '+yT+' Z';
 return p;
}
function tierSnowR(cx,yT,yB,w){
 return 'M '+cx+' '+(yT+3)+' Q '+(cx+w*0.5).toFixed(1)+' '+(yT+(yB-yT)*0.12+4).toFixed(1)+' '+(cx+w).toFixed(1)+' '+(yB-2).toFixed(1);
}
function tierSnowL(cx,yT,yB,w){
 return 'M '+cx+' '+(yT+3)+' Q '+(cx-w*0.5).toFixed(1)+' '+(yT+(yB-yT)*0.12+4).toFixed(1)+' '+(cx-w).toFixed(1)+' '+(yB-2).toFixed(1);
}
function sr(seed){let s=(seed>>>0)||1;return function(){s=(s*1664525+1013904223)>>>0;return s/4294967296}}
function needleTier(cx,yT,yB,w,si,rich){
 const R=sr(si*7349+11);
 const g1=rich?'#2aa869':'#1f9254',g2=rich?'#0f6b3d':'#0b5230';
 const base=si%2?g2:g1;
 let h='<path d="'+tierPath(cx,yT,yB,w)+'" fill="'+base+'"/>';
 [-1,1].forEach(sd=>{
  const fr=Math.max(4,Math.round(w/14));
  for(let f=0;f<fr;f++){
   const t=(f+0.4)/(fr+0.2);
   const bx=cx+sd*w*t,by=yT+(yB-yT)*t*0.9;
   const tw=7+R()*7;
   const ex=bx+sd*tw*0.8,ey=by+tw*0.45;
   h+='<line x1="'+bx.toFixed(1)+'" y1="'+by.toFixed(1)+'" x2="'+ex.toFixed(1)+'" y2="'+ey.toFixed(1)+'" stroke="#1a6f40" stroke-width="1.4"/>';
   const nn=4+Math.floor(R()*3);
   for(let k=0;k<nn;k++){
    const tt=0.25+0.75*(k/(nn-1||1));
    const px=bx+sd*tw*0.8*tt,py=by+tw*0.45*tt;
    const nl=4+R()*4;
    const nx=px+sd*nl*(0.5+R()*0.5),ny=py+nl;
    h+='<line x1="'+px.toFixed(1)+'" y1="'+py.toFixed(1)+'" x2="'+nx.toFixed(1)+'" y2="'+ny.toFixed(1)+'" stroke="'+['#2fa763','#38b96f','#2c9a5a','#48c77e'][Math.floor(R()*4)]+'" stroke-width="1.1" opacity="0.9"/>';
   }
   if(R()<0.4)h+='<circle cx="'+ex.toFixed(1)+'" cy="'+(ey+1).toFixed(1)+'" r="1.6" fill="rgba(240,248,255,.85)"/>';
  }
 });
 h+='<path d="'+tierSnowR(cx,yT,yB,w)+'" stroke="rgba(240,248,255,.8)" stroke-width="3" fill="none" stroke-linecap="round"/>'
  +'<path d="'+tierSnowL(cx,yT,yB,w)+'" stroke="rgba(240,248,255,.8)" stroke-width="3" fill="none" stroke-linecap="round"/>';
 return h;
}
function ribbonSvg(rich){
 let h='';
 const bands=[{y1:92,y2:104,w:50},{y1:128,y2:142,w:64},{y1:164,y2:180,w:78},{y1:200,y2:218,w:92},{y1:236,y2:256,w:106}];
 bands.forEach((b,i)=>{
  const cx=200,x1=cx-b.w,x2=cx+b.w;
  const col=i%2?'#ffd24d':'#ffe9a8';
  const op=rich?0.95:0.75,wd=rich?7:5.5;
  h+='<path d="M '+x1+' '+b.y1+' Q '+cx+' '+b.y2+' '+x2+' '+b.y1+'" fill="none" stroke="'+col+'" stroke-width="'+wd+'" opacity="'+op+'" stroke-linecap="round"/>';
  if(rich)h+='<path d="M '+x1+' '+b.y1+' Q '+cx+' '+b.y2+' '+x2+' '+b.y1+'" fill="none" stroke="#fff" stroke-width="1.4" opacity=".45" stroke-linecap="round"/>';
 });
 return h;
}
function giftsSvg(){

 for(let i=0;i<n;i++){
  const g=gs[i],x=g[0],y=g[1],w=g[2],hh=g[3],c1=g[4],c2=g[5];
  h+='<g><rect x="'+(x-w/2)+'" y="'+(y-hh)+'" width="'+w+'" height="'+hh+'" rx="3" fill="'+c1+'" stroke="rgba(0,0,0,.25)"/>'
   +'<rect x="'+(x-w/2)+'" y="'+(y-hh)+'" width="'+w+'" height="'+(hh/3.2)+'" rx="3" fill="'+c2+'" opacity=".9"/>'
   +'<rect x="'+(x-2.5)+'" y="'+(y-hh)+'" width="5" height="'+hh+'" fill="'+c2+'" opacity=".9"/>'
   +'<circle cx="'+x+'" cy="'+(y-hh-3)+'" r="3.5" fill="'+c2+'"/></g>';
 }
 return h;
}

function garlandSvg(type){
 const cols=GCOLORS[type]||GCOLORS.classic;
 let h='';
 TIER_GEO.slice(1,7).forEach((g,si)=>{
  const x1=200-(g.w-6),x2=200+(g.w-6),y=g.yB-16,mx=200,my=y+10,n=8;
  h+='<path d="M '+x1+' '+y+' Q '+mx+' '+my+' '+x2+' '+y+'" fill="none" stroke="rgba(20,30,20,.55)" stroke-width="2"/>';
  for(let i=0;i<n;i++){
   const t=(i+0.5)/n;
   const qx=(1-t)*(1-t)*x1+2*(1-t)*t*mx+t*t*x2;
   const qy=(1-t)*(1-t)*y+2*(1-t)*t*my+t*t*y;
   const c=cols[(i+si)%cols.length];
   h+='<circle cx="'+qx.toFixed(1)+'" cy="'+qy.toFixed(1)+'" r="4.5" fill="'+c+'" opacity=".25"/>'
    +'<circle class="gcore" style="animation-delay:'+((i*0.22+si*0.31)%1.8).toFixed(2)+'s" cx="'+qx.toFixed(1)+'" cy="'+qy.toFixed(1)+'" r="2.6" fill="'+c+'"/>';
  }
 });
 return h;
}
function passiveRate(){return S.level}
function claimPassive(){
 const mins=Math.min((Date.now()-S.passiveLast)/60000,1440);
 if(mins<1){toast('⏳ Доход копится, зайдите позже');return}
 const c=Math.floor(mins*passiveRate());S.passiveLast=Date.now();
 S.cones+=c;addXp(Math.round(c/15));save();renderHeader();
 toast('🌱 Доход: +'+c+' 🌰 ('+Math.floor(mins)+' мин)');
}
function claimDaily(){
 if(S.dailyDay===today()){toast('⏳ Сундук уже забрали — приходите завтра');return}
 S.dailyDay=today();
 const c=100+S.streak*50;gain(c,'daily');addXp(30);
 toast('🎁 Сундук дня: +'+c+' 🌰');renderHeader();
}

function updateEarn(){
 const el=$('earnGlobal');if(!el)return;
 el.textContent=earnEstimateRub().toFixed(2)+' '+EARN_CFG.currency;
 const ev=$('earnViews'),et=$('earnTasks');
 if(ev)ev.textContent=S.adViews;
 if(et)et.textContent=S.adTasks;
 fetchGlobalEarn().then(g=>{
  const sub=$('earnSub');if(!sub)return;
  if(g&&g.err){sub.textContent='⚠️ '+g.err+' — выполните SQL-настройку и перезапустите игру';return;}
  if(!g){sub.textContent='⚠️ Общий счётчик недоступен';return;}
  const usd=earnEstimateUsd(g.views,g.tasks);
  el.textContent=(usd*USD_RATE).toFixed(2)+' '+EARN_CFG.currency;
  sub.textContent='👁 '+g.views+' показов · 📌 '+g.tasks+' заданий от всех игроков · курс ЦБ: $1 = '+USD_RATE.toFixed(2)+' ₽';
 });
}
