<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ZINI CITY</title>
<script src="https://sad.adsgram.com/js/adsgram.min.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:-apple-system,'Segoe UI',Roboto,sans-serif; background:linear-gradient(160deg,#1a2340,#0d1225); color:#fff; min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:12px; user-select:none; }
  h1 { font-size:22px; margin:8px 0 2px; letter-spacing:2px; }
  .coins { font-size:28px; font-weight:800; color:#ffd54a; margin:4px 0; text-shadow:0 0 12px rgba(255,213,74,.4); }
  .persec { font-size:13px; color:#8fa3d0; margin-bottom:10px; }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:6px; width:min(94vw,420px); }
  .cell { aspect-ratio:1; background:rgba(255,255,255,.06); border-radius:10px; display:flex; align-items:center; justify-content:center; font-size:26px; cursor:pointer; border:1px solid rgba(255,255,255,.08); transition:.15s; }
  .cell:active { transform:scale(.92); }
  .cell.built { background:rgba(255,255,255,.14); box-shadow:inset 0 0 12px rgba(0,0,0,.3); }
  .boostbar { width:min(94vw,420px); height:6px; background:rgba(255,255,255,.1); border-radius:3px; margin:10px 0; overflow:hidden; }
  .boostbar > div { height:100%; background:#ffd54a; width:0%; }
  .btnrow { display:flex; flex-direction:column; gap:8px; width:min(94vw,420px); margin-top:12px; }
  .adbtn { padding:14px; border:none; border-radius:14px; font-size:15px; font-weight:700; cursor:pointer; color:#1a2340; background:#ffd54a; box-shadow:0 4px 14px rgba(255,213,74,.3); }
  .adbtn:disabled { opacity:.45; }
  .adbtn.blue { background:#5ec8ff; }
  .adbtn.purple { background:#c79bff; }
  .adbtn.green { background:#7dffa8; }
  .buildmenu { display:none; position:fixed; bottom:0; left:0; right:0; background:#1d2748; border-radius:20px 20px 0 0; padding:18px; z-index:10; box-shadow:0 -8px 30px rgba(0,0,0,.5); }
  .buildmenu.open { display:block; }
  .bitem { display:flex; justify-content:space-between; align-items:center; padding:12px; background:rgba(255,255,255,.07); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .bitem:active { background:rgba(255,255,255,.15); }
  .bitem.poor { opacity:.4; }
  .toast { position:fixed; top:18px; left:50%; transform:translateX(-50%); background:#2b3a6b; padding:12px 20px; border-radius:12px; font-size:14px; z-index:20; opacity:0; transition:.3s; pointer-events:none; max-width:88vw; text-align:center; }
  .toast.show { opacity:1; }
  .legend { font-size:11px; color:#8fa3d0; margin-top:14px; text-align:center; }
</style>
</head>
<body>

<h1>🏙 ZINI CITY</h1>
<div class="coins" id="coins">0 🪙</div>
<div class="persec" id="persec">+0 монет/сек</div>
<div class="boostbar" id="boostbar"><div id="boostfill"></div></div>

<div class="grid" id="grid"></div>

<div class="btnrow">
  <button class="adbtn" id="btnBoost">⚡ Буст ×3 на 30 минут — за рекламу</button>
  <button class="adbtn blue" id="btnBlueprint">📜 Получить чертёж — за рекламу</button>
  <button class="adbtn purple" id="btnDaily">🎁 Ежедневный контейнер — за рекламу</button>
</div>

<div class="legend">Смотри рекламу → получай бонусы → развивай город быстрее 🚀</div>

<div class="buildmenu" id="buildmenu"></div>
<div class="toast" id="toast"></div>

<script>
/* ============ НАСТРОЙКИ ============ */
const BLOCK_ID = "1234"; // ← ВСТАВЬ СВОЙ BLOCK_ID ИЗ КАБИНЕТА ADSGRAM

const BUILDINGS = [
  { id:'house',  icon:'🏠', name:'Дом',           prod:2,   cost:50,    mult:1.15 },
  { id:'fab',    icon:'🏭', name:'Фабрика',       prod:10,  cost:400,   mult:1.18 },
  { id:'office', icon:'🏢', name:'Офис',          prod:40,  cost:2500,  mult:1.20 },
  { id:'power',  icon:'⚡', name:'Электростанция', prod:0,   cost:6000,  mult:1.25, boostAll:0.30 },
];
const GRID_SIZE = 25; // 5x5

/* ============ СОСТОЯНИЕ ============ */
let S = { coins:100, cells:new Array(GRID_SIZE).fill(null), counts:{}, bonuses:{}, boostUntil:0, lastSeen:Date.now(), dailyTaken:0 };
const save = () => { S.lastSeen = Date.now(); localStorage.setItem('ziniCity', JSON.stringify(S)); };

/* оффлайн-доход 50% */
(function load(){
  try {
    const d = JSON.parse(localStorage.getItem('ziniCity'));
    if (d) {
      S = Object.assign(S, d);
      const away = Math.min((Date.now() - d.lastSeen)/1000, 86400);
      const gain = Math.floor(production() * away * 0.5);
      if (gain > 0) S.coins += gain;
    }
  } catch(e){}
})();

/* ============ ЭКОНОМИКА ============ */
function production(){
  let base = 0, powerMult = 1;
  S.cells.forEach(c => {
    if (!c) return;
    const b = BUILDINGS.find(x=>x.id===c);
    if (b.boostAll) powerMult += b.boostAll;
    else base += b.prod;
  });
  let bonusMult = 1;
  for (const k in S.bonuses) bonusMult += S.bonuses[k];
  const boost = Date.now() < S.boostUntil ? 3 : 1;
  return base * powerMult * bonusMult * boost;
}
function cost(b){ const n = S.counts[b.id]||0; return Math.floor(b.cost * Math.pow(b.mult, n)); }

/* ============ РЕНДЕР ============ */
const gridEl = document.getElementById('grid');
function render(){
  document.getElementById('coins').textContent = fmt(S.coins) + ' 🪙';
  document.getElementById('persec').textContent = '+' + fmt(production()) + ' монет/сек';
  const left = Math.max(0, S.boostUntil - Date.now());
  document.getElementById('boostfill').style.width = (left/(30*60*1000)*100) + '%';
  gridEl.innerHTML = '';
  S.cells.forEach((c,i)=>{
    const d = document.createElement('div');
    d.className = 'cell' + (c?' built':'');
    if (c) d.textContent = BUILDINGS.find(x=>x.id===c).icon;
    d.onclick = () => openMenu(i);
    gridEl.appendChild(d);
  });
  document.getElementById('btnDaily').disabled = !dailyReady();
}
function fmt(n){ return n>=1e6 ? (n/1e6).toFixed(2)+'M' : n>=1e4 ? (n/1e3).toFixed(1)+'K' : Math.floor(n).toLocaleString('ru'); }

/* ============ ПОСТРОЙКА ============ */
let selected = -1;
const menu = document.getElementById('buildmenu');
function openMenu(i){
  selected = i;
  const occupied = S.cells[i];
  menu.innerHTML = occupied
    ? `<div class="bitem" onclick="sell(${i})">🗑 Продать ${BUILDINGS.find(b=>b.id===occupied).name} (+${Math.floor(cost(BUILDINGS.find(b=>b.id===occupied))*0.5)} 🪙)</div>
       <div class="bitem" onclick="closeMenu()">✖ Закрыть</div>`
    : BUILDINGS.map(b=>`<div class="bitem ${S.coins<cost(b)?'poor':''}" onclick="build(${i},'${b.id}')">
        ${b.icon} ${b.name} <span>${b.boostAll?'+'+Math.round(b.boostAll*100)+'% ко всему':b.prod+' 🪙/сек'} — ${cost(b)} 🪙</span></div>`).join('')
      + `<div class="bitem" onclick="closeMenu()">✖ Закрыть</div>`;
  menu.classList.add('open');
}
window.build = (i,id) => {
  const b = BUILDINGS.find(x=>x.id===id);
  if (S.coins < cost(b)) return toast('Не хватает монет!');
  S.coins -= cost(b);
  S.cells[i] = id;
  S.counts[id] = (S.counts[id]||0)+1;
  closeMenu(); render(); save();
};
window.sell = i => {
  const id = S.cells[i]; const b = BUILDINGS.find(x=>x.id===id);
  S.coins += Math.floor(cost(b)*0.5);
  S.cells[i] = null; S.counts[id]--;
  closeMenu(); render(); save();
};
function closeMenu(){ menu.classList.remove('open'); }

/* ============ TOAST ============ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ============ ADSGRAM ============ */
const Ad = window.Adsgram ? window.Adsgram.init({ blockId: BLOCK_ID }) : null;
function watchAd(){
  if (!Ad) { toast('Реклама не инициализирована. Проверь BLOCK_ID!'); return Promise.reject(); }
  return Ad.show(); // resolve — пользователь досмотрел
}

/* Буст ×3 на 30 минут */
document.getElementById('btnBoost').onclick = () => watchAd()
  .then(()=>{ S.boostUntil = Date.now() + 30*60*1000; toast('⚡ Буст ×3 активен 30 минут!'); render(); save(); })
  .catch(()=>{});

/* Чертёж */
document.getElementById('btnBlueprint').onclick = () => watchAd()
  .then(()=>{
    const roll = Math.random();
    const [tier, mult, color] = roll<0.70 ? ['обычный',0.10,'📄'] : roll<0.95 ? ['редкий',0.25,'💎'] : ['легендарный',1.00,'🔥'];
    const target = BUILDINGS[Math.floor(Math.random()*BUILDINGS.length)];
    S.bonuses[target.id] = (S.bonuses[target.id]||0) + mult;
    toast(`${color} ${tier[0].toUpperCase()+tier.slice(1)} чертёж: +${Math.round(mult*100)}% к «${target.name}» навсегда!`);
    render(); save();
  })
  .catch(()=>{});

/* Ежедневный контейнер */
function dailyReady(){ return new Date().toDateString() !== S.dailyTaken; }
document.getElementById('btnDaily').onclick = () => watchAd()
  .then(()=>{
    S.dailyTaken = new Date().toDateString();
    const reward = Math.max(200, Math.floor(production()*60));
    S.coins += reward;
    toast(`🎁 Контейнер открыт: +${fmt(reward)} 🪙!`);
    render(); save();
  })
  .catch(()=>{});

/* ============ ИГРОВОЙ ЦИКЛ ============ */
setInterval(()=>{ S.coins += production(); render(); }, 1000);
setInterval(save, 10000);
window.addEventListener('beforeunload', save);
render();
</script>
</body>
</html>
