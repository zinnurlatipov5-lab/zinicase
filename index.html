<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ЖИВОЙ ГОРОД</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap"><canvas id="scene"></canvas></div>

<div id="hud" class="hidden">
  <div id="dash">
    <div id="speed">0</div><div id="kmh">км/ч</div>
    <div id="gear">N</div>
    <div id="odo">0.0 км</div>
  </div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div id="hint">W/S — газ/тормоз &nbsp; A/D — руль &nbsp; ПРОБЕЛ — ручник &nbsp; C — камера &nbsp; N — день/ночь &nbsp; H — гудок &nbsp; R — на дорогу</div>
  <div id="toast"></div>
</div>

<div id="menu">
  <div class="title">ЖИВОЙ ГОРОД</div>
  <div class="sub">свободная езда по большому городу</div>
  <button id="startBtn">ПОЕХАЛИ</button>
  <div class="ctrl">W S A D — езда · ПРОБЕЛ — ручник · C — камера · N — ночь · H — гудок</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="game.js"></script>
</body>
</html>
