<!DOCTYPE html>

<head>

    <title>Зимний подарок</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

        <div id="case-result"></div>
        <div id="balance">Баланс: 0 звёзд</div>
        <button onclick="inviteFriends()">Пригласить друзей</button>
    </div>
    <script src="js/main.js"></script>
    <script src="js/ykassa.js"></script>
</body>
</html>
