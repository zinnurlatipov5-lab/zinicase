<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Зимний подарок — Кейсы</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    font-family:-apple-system,'Segoe UI',Roboto,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%, #1e3a8a 0%, #0b1026 60%) fixed, #0b1026;
    color:#eaf2ff; min-height:100vh; overflow-x:hidden;
  }
  /* ... стили шапки и кнопок ... */
</style>
</head>
<body>
<header>
  <div class="logo">Кейс Магазин<small>Версия 1.0</small></div>
  <button class="balance-chip">Открыть кейс</button>
</header>

<style>
  .btn {
    position:relative; display:block; width:100%; padding:16px; border:none; border-radius:16px;
    font-size:15px; font-weight:800; letter-spacing:.3px; cursor:pointer; margin-top:12px;
    transition:.18s; color:#fff; overflow:hidden;
    background:linear-gradient(135deg,#4f8cff,#7cc4ff);
    box-shadow:0 6px 20px rgba(79,140,255,.35), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .btn:hover { filter:brightness(1.08); }
  .btn:active { transform:scale(.96); filter:brightness(.95); }
</style>
<div class="cases-grid">
  <div class="case-card" onclick="alert('Кейс открыт!')">
    <div class="glow"></div>
    <i class="emoji"></i>
    <div class="name">Редкий кейс</div>
    <div class="price">Цена: 100 монет</div>
    <button class="btn">Открыть</button>
  </div>
</div>

<style>
  .case-card {
    border-radius:18px; padding:16px 10px 12px; text-align:center; cursor:pointer;
    transition:.15s; position:relative; overflow:hidden;
  }
  .case-card:active { transform:scale(.95); }
</style>
<footer>
  <div class="welcome">
    <div class="w-hi">Добро пожаловать!</div>
    <div class="w-text">Начните своё приключение в мире кейсов!</div>
  </div>
</footer>

<style>
  /* дополнительные стили для футера и приветствия */
  .welcome {
    text-align:center; padding:20px 16px; margin-bottom:14px; border-radius:20px;
    background:linear-gradient(160deg,rgba(255,215,110,.14),rgba(124,92,255,.10));
    border:1px solid rgba(255,215,110,.30);
  }
</style>
</body>
</html>
