<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>🎄 Ёлка Зини v14.0</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script>try{Telegram.WebApp.ready();Telegram.WebApp.expand();}catch(e){}</script>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;font-family:'Segoe UI',system-ui,sans-serif;color:#eef3ff;min-height:100%}
body{background:#060d24;overflow-x:hidden}
/* фон: только transform-анимации, без blur — главный источник лагов */
#aurora{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#050b23 0%,#0a1a3f 45%,#12295a 100%)}
#aurora i{position:absolute;width:120vw;height:45vh;border-radius:50%;opacity:.3;background:radial-gradient(ellipse,currentColor 0%,transparent 60%);will-change:transform}
#aurora i:nth-child(1){color:#1fffa4;left:-25vw;top:-14vh;animation:aur1 16s ease-in-out infinite alternate}
#aurora i:nth-child(2){color:#6a5cff;right:-30vw;top:-6vh;animation:aur2 20s ease-in-out infinite alternate}
#aurora i:nth-child(3){color:#ff5ce0;left:-15vw;top:22vh;animation:aur3 24s ease-in-out infinite alternate}
@keyframes aur1{from{transform:translateX(-5vw) skewX(-7deg)}to{transform:translateX(8vw) skewX(7deg)}}
@keyframes aur2{from{transform:translateX(6vw) skewX(5deg)}to{transform:translateX(-7vw) skewX(-4deg)}}
@keyframes aur3{from{transform:translateX(3vw)}to{transform:translateX(-6vw)}}
/* снегопад: 12 снежинок, только transform */
#snow{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
#snow span{position:absolute;top:-5%;opacity:.4;will-change:transform;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(0,108vh,0)}}

header{position:sticky;top:0;z-index:30;background:rgba(10,20,50,.95);padding:8px 12px;border-bottom:1px solid rgba(255,255,255,.12)}
.hrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.logo{font-size:20px;font-weight:800;color:#ffd86b}
.stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.xpwrap{flex:1;min-width:90px;height:9px;background:rgba(255,255,255,.14);border-radius:6px;overflow:hidden}
.xpbar{height:100%;width:0;background:linear-gradient(90deg,#ffd86b,#ff8f3f)}
.xplabel{font-size:11px;opacity:.85;min-width:64px;text-align:right}
#gbtn{background:linear-gradient(135deg,#ffd86b,#ff9a3d);border:none;border-radius:14px;color:#402a00;font-weight:800;font-size:15px;padding:6px 12px;cursor:pointer}
#gbtn:disabled{filter:grayscale(.7);opacity:.55}

/* гирлянда шапки: качание убрал (лагало на слабых), осталось мягкое мигание */
#garland{position:sticky;top:0;z-index:29;background:rgba(8,16,44,.4);line-height:0}
#garland svg{width:100%;height:40px;display:block}
.gcore{animation:blink 1.8s ease-in-out infinite alternate}
@keyframes blink{from{opacity:.35}to{opacity:1}}

.ticker{position:relative;z-index:5;overflow:hidden;background:rgba(8,16,44,.75);border-top:1px solid rgba(255,255,255,.1);border-bottom:1px solid rgba(255,255,255,.1);white-space:nowrap}
.ticker-inner{display:inline-block;padding:5px 0;font-size:12.5px;color:#aee6ff;animation:tick 50s linear infinite;will-change:transform}
@keyframes tick{from{transform:translate3d(100vw,0,0)}to{transform:translate3d(-100%,0,0)}}
nav{position:sticky;top:40px;z-index:31;display:flex;gap:4px;padding:8px;overflow-x:auto;background:rgba(5,11,35,.95)}
nav::-webkit-scrollbar{display:none}
.tab{flex:0 0 auto;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);color:#dfe8ff;border-radius:16px;padding:8px 14px;font-size:14px;font-weight:700;cursor:pointer}
.tab.on{background:linear-gradient(135deg,#2ee38b,#12a06a);color:#032015;border-color:transparent}
main{position:relative;z-index:5;max-width:720px;margin:0 auto;padding:10px 10px 90px}
.card{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:18px;padding:14px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:16px;color:#ffd86b}
.btn{background:linear-gradient(135deg,#2ee38b,#12a06a);border:none;color:#032015;font-weight:800;font-size:14px;border-radius:14px;padding:11px 16px;cursor:pointer;width:100%}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,#ffd86b,#ff9a3d);color:#402a00}
.btn.blue{background:linear-gradient(135deg,#59a6ff,#2f5fe0);color:#eaf3ff}
.btn.red{background:linear-gradient(135deg,#ff6b6b,#d03a3a);color:#fff}
.btn:disabled{filter:grayscale(.75);opacity:.55}
.small{font-size:12px;opacity:.8}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}

/* ==== ЁЛКА ==== */
#treeScene{position:relative;height:min(80vh,760px);border-radius:20px;overflow:hidden;background:radial-gradient(ellipse at 50% 25%,rgba(90,140,255,.14),transparent 55%),linear-gradient(180deg,#0a1740,#0e2352)}
/* дерево качается ОДНИМ слоем — дешево */
#treeSway{transform-origin:200px 26px;animation:tSway 8s ease-in-out infinite alternate}
@keyframes tSway{from{transform:rotate(-.7deg)}to{transform:rotate(.7deg)}}
.slot{position:absolute;transform:translate(-50%,-50%);width:26px;height:26px;border:2px dashed rgba(255,255,255,.28);border-radius:50%;display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.45);font-size:14px;cursor:pointer;z-index:4}
.tstar{position:absolute;left:50%;top:2.2%;transform:translateX(-50%);font-size:38px;text-shadow:0 0 12px #ffd86b;animation:tw 2.4s ease-in-out infinite alternate;z-index:5}
@keyframes tw{from{transform:translateX(-50%) scale(.94);opacity:.9}to{transform:translateX(-50%) scale(1.06);opacity:1}}
.tlight{position:absolute;width:8px;height:11px;border-radius:50% 50% 60% 60%;transform:translate(-50%,-50%);animation:blink 1.6s ease-in-out infinite alternate;z-index:3;pointer-events:none}
/* игрушки качаются ВМЕСТЕ с деревом, без собственной анимации — экономим композитор */
.ornwrap{position:absolute;transform:translate(-50%,-50%);z-index:5}
.ornwrap .rem{position:absolute;bottom:-8px;right:-10px;width:22px;height:22px;border-radius:50%;border:none;background:#ff5f5f;color:#fff;font-size:11px;cursor:pointer;z-index:6}

.bauble{position:relative;width:30px;height:30px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.85),rgba(255,255,255,0) 40%),radial-gradient(circle at 50% 40%,var(--c1),var(--c2));box-shadow:0 0 10px var(--glow);display:flex;align-items:center;justify-content:center;font-size:13px}
.bcap{width:10px;height:7px;background:linear-gradient(#ffe9a8,#c9971f);border-radius:2px;margin:-3px auto 0}
.bstring{width:1.5px;height:5px;background:rgba(255,255,255,.55);margin:0 auto}
.r-common{--c1:#7ee8a2;--c2:#1c7a44;--glow:rgba(80,220,140,.5)}
