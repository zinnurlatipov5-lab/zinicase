<style>

.mbox{background:linear-gradient(180deg,#16264f,#0d1b3e);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:16px;max-width:420px;width:100%;max-height:82vh;overflow-y:auto}

#banner{position:fixed;top:0;left:0;right:0;z-index:40;text-align:center;padding:5px;font-weight:800;font-size:13px;display:none}

<script>
/* ===================== НАСТРОЙКИ ===================== */
/* Adsgram: blockId 59627 (видео за награду), task-59804 (задание на подписку).
   debug:true — тестовые ролики Adsgram. После модерации поставьте debug:false */
const AG_CFG={blockId:'59627',taskBlockId:'task-59804',debug:true};
/* Ставка: $0.01 за просмотр и $0.01 за задание. Показываем в рублях по курсу ЦБ */
const EARN_CFG={perViewUsd:0.01,perTaskUsd:0.01,fallbackRate:80,currency:'₽'};
let USD_RATE=EARN_CFG.fallbackRate;

/* ===================== СРЕДА ===================== */
const IS_TG=!!(window.Telegram&&window.Telegram.WebApp&&window.Telegram.WebApp.initData!=='');
let TG_USER=null;
try{TG_USER=Telegram.WebApp.initDataUnsafe&&Telegram.WebApp.initDataUnsafe.user||null;}catch(e){}

/* ===================== ADSGRAM ===================== */
let _agLoading=false,_adCtrl=null;
function loadAdsgramSdk(){
 return new Promise(res=>{
  if(window.Adsgram){res(true);return}
  if(_agLoading){
   const iv=setInterval(()=>{if(window.Adsgram){clearInterval(iv);res(true)}},100);
   setTimeout(()=>{clearInterval(iv);res(!!window.Adsgram)},8000);
   return;
  }
  _agLoading=true;
  let settled=false;
  const done=ok=>{if(!settled){settled=true;_agLoading=false;res(ok)}};
  const t=setTimeout(()=>done(!!window.Adsgram),8000);
  try{
   const s=document.createElement('script');
   s.src='https://sad.adsgram.ai/js/sad.min.js';
   s.onload=()=>{clearTimeout(t);done(!!window.Adsgram)};
   s.onerror=()=>{clearTimeout(t);done(false)};
   document.head.appendChild(s);
  }catch(e){clearTimeout(t);done(false)}
 });
}
function getAdController(){
 if(!window.Adsgram||!AG_CFG.blockId)return null;
 if(!_adCtrl)_adCtrl=window.Adsgram.init({blockId:AG_CFG.blockId,debug:AG_CFG.debug});
 return _adCtrl;
}
async function showAdRewarded(onReward){
 if(IS_TG&&AG_CFG.blockId){
  const ok=await loadAdsgramSdk();
  const ctrl=ok?getAdController():null;
  if(ctrl){
   try{
    await ctrl.show();
    registerAdView();
    onReward();
    return;
   }catch(e){
    toast('📺 Реклама не показалась — попробуйте чуть позже');
    return;
   }
  }
 }
 simulateAd(onReward);
}
function simulateAd(onReward){
 const ov=$('adsOv');ov.classList.add('show');
 $('adsTitle').textContent=IS_TG?'Реклама (без показа — тест)':'Тестовый показ (вне Telegram)';
 let c=3;const el=$('adsCnt'),fill=$('adsFill');
 el.textContent=c;fill.style.width='0%';
 requestAnimationFrame(()=>fill.style.width='100%');
 const iv=setInterval(()=>{c--;el.textContent=Math.max(c,0);
  if(c<=0){clearInterval(iv);ov.classList.remove('show');registerAdView();onReward();}
 },1000);
}

/* ===================== КАТАЛОГ ===================== */
const RAR={
 common:{n:'Обычные',cls:'r-common',rb:'rb-common'},
 rare:{n:'Редкие',cls:'r-rare',rb:'rb-rare'},
 epic:{n:'Эпические',cls:'r-epic',rb:'rb-epic'},
 legend:{n:'Легендарные',cls:'r-legend',rb:'rb-legend'},
 garland:{n:'Гирлянды',cls:'r-garland',rb:'rb-garland'}
};
const CATALOG={
 common:[['Красный шарик','🔴',50],['Синий шарик','🔵',50],['Зелёный шарик','🟢',60],['Колокольчик','🔔',80],['Снежинка','❄️',70],['Мандарин','🍊',90],['Конфета','🍬',90],['Ленточка','🎀',60],['Свечка','🕯️',100],['Белка','🐿️',120],['Пряник','🍩',110],['Носочек','🧦',100]],
 rare:[['Бант-гигант','🎀',300],['Серебристая звезда','🌟',350],['Олень','🦌',400],['Подарочек','🎁',380],['Снеговик','⛄',420],['Сова','🦉',450],['Леденец-посох','🍭',480],['Золотая свеча','🕯️',500],['Медвежонок','🐻',520],['Цилиндр снеговика','🎩',550]],
 epic:[['Единорог','🦄',1500],['Замок снеговика','🏰',1800],['Карусель','🎠',2000],['Паровозик','🚂',1900],['Кристалл льда','💎',2100],['Планета','🪐',2300],['Ледяной дракон','🧊',2500],['Шатёр цирка','🎪',2200]],
 legend:[['Корона Зини','👑',8000],['Комета','🌠',10000],['Кубок Зини','🏆',12000],['Жар-птица','🐦‍🔥',15000],['Фейерверк','🎆',18000],['Звезда желания','💫',20000]]
};
const GARLANDS=[
 ['Классическая гирлянда','classic',600],
 ['Ледяная гирлянда','ice',1000],
 ['Золотая гирлянда','gold',1400],
 ['Радужная гирлянда','rainbow',1800]
];
const GCOLORS={
 classic:['#ff4d4d','#ffd24d','#4dff88','#4da6ff'],
 ice:['#bfeaff','#7fd4ff','#e8f8ff','#9fe0ff'],
 gold:['#ffd86b','#ffb03d','#fff2b0','#ffe9a8'],
 rainbow:['#ff4d4d','#ffb03d','#ffe94d','#4dff88','#4de1ff','#6a5cff','#ff4de0']
};

const TIERS=[{n:1,y:13},{n:2,y:22},{n:3,y:31},{n:3,y:40},{n:4,y:49},{n:4,y:58},{n:4,y:67},{n:4,y:76}];
const SLOTS=[];
TIERS.forEach((t,ti)=>{
 const w=12+ti*8.5;
 for(let i=0;i<t.n;i++){
  const x=50+(i-(t.n-1)/2)*(w/Math.max(t.n,1));
  SLOTS.push({x:Math.round(x*10)/10,y:t.y});
 }
});

/* ===================== СОСТОЯНИЕ ===================== */
function defState(){return{cones:200,xp:0,level:1,name:'',bag:[],tree:Array(25).fill(null),treeGarland:null,
 wheelFree:3,wheelDay:'',streak:0,streakDay:'',wishDay:'',dailyDay:'',treeBonusDay:'',
 ghUntil:0,stormUntil:0,sparkAt:0,passiveLast:Date.now(),claimed:[],order:null,vidNext:0,taskDoneDay:'',
 adViews:0,adTasks:0,seq:1,catchBest:0,bossWins:0}}
let S=defState();
try{
 let raw=localStorage.getItem('zini_v13_state')||localStorage.getItem('zini_v12_state');
 if(raw)S=Object.assign(defState(),JSON.parse(raw));
}catch(e){}
while(S.tree.length<25)S.tree.push(null);
if(!S.name&&TG_USER&&(TG_USER.first_name||TG_USER.username)){S.name=(TG_USER.first_name||TG_USER.username).slice(0,16);}
function save(){localStorage.setItem('zini_v13_state',JSON.stringify(S));}
const today=()=>new Date().toISOString().slice(0,10);

/* учёт активности для «Заработка» */

/* ===================== УТИЛИТЫ ===================== */
const $=id=>document.getElementById(id);
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;$('toast').appendChild(d);setTimeout(()=>d.remove(),2400);}
function fmt(n){return n>=1000?(n/1000).toFixed(n%1000?1:0).replace('.0','')+'к':''+n}
function rand(a,b){return Math.floor(a+Math.random()*(b-a+1))}
function pick(a){return a[rand(0,a.length-1)]}
function xpNeed(l){return 100+l*50}
function mult(){let m=1;if(Date.now()<S.ghUntil)m*=2;if(Date.now()<S.stormUntil)m*=2;return m}
function gain(n,src){
 const m=mult();S.cones+=n*m;
 if(S.order&&S.order.t==='earn')progOrder(n*m);
 addXp(Math.round(n*m/12));
 save();renderHeader();
}
function spend(n){if(S.cones<n){toast('Не хватает шишек 🌰');return false}S.cones-=n;save();renderHeader();return true}
function addXp(n){S.xp+=n;
 while(S.xp>=xpNeed(S.level)&&S.level<100){S.xp-=xpNeed(S.level);S.level++;toast('🎉 Уровень '+S.level+'!');}
 renderHeader();save();}
function mmss(ms){const s=Math.ceil(ms/1000);return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}

/* ===================== ГОЛОС ===================== */
let voiceReady=Date.now();
function voiceDrop(){

function hang(i){openBagPicker(i,false)}

function doHang(si,bi){

/* ===================== ДЕД МОРОЗ ===================== */
function genOrder(){
 const r=rand(0,2);let o;
 if(r===0){const rar=pick(['common','rare','epic']);o={t:'hang',rar,n:rand(2,3),done:0,reward:rar==='epic'?900:rar==='rare'?600:400};}
 else if(r===1){o={t:'earn',n:400,done:0,reward:300};}
 else{o={t:'catch',n:15,done:0,reward:350};}
 S.order=o;save();
}
function progOrder(n){
 if(!S.order)return;S.order.done+=n;
 if(S.order.done>=S.order.n){
  const rw=S.order.reward;gain(rw,'order');addXp(60);
  toast('🎅 Дед Мороз: заказ выполнен! +'+rw+' 🌰');
  S.order=null;setTimeout(genOrder,3000);
 }
 save();
}

/* ===================== КОЛЕСО ===================== */
const WHEEL=[{t:'c',v:50},{t:'c',v:100},{t:'o',v:'rare'},{t:'c',v:250},{t:'c',v:500},{t:'o',v:'epic'},{t:'c',v:150},{t:'c',v:1000}];
const WCOLS=['#2f5fe0','#8b3fd0','#d03a3a','#12a06a','#ff9a3d','#6a5cff','#1fffa4','#ffd86b'];
const SEG=45;
let wheelAng=0,wheelSpinning=false;
function drawWheel(){
 const cv=$('wheelCv');if(!cv)return;const ctx=cv.getContext('2d');
 const R=cv.width/2;ctx.clearRect(0,0,cv.width,cv.height);
 WHEEL.forEach((p,i)=>{
  const a0=(wheelAng+i*SEG)*Math.PI/180,a1=a0+SEG*Math.PI/180;
  ctx.beginPath();ctx.moveTo(R,R);ctx.arc(R,R,R-6,a0,a1);ctx.closePath();
  ctx.fillStyle=WCOLS[i];ctx.fill();ctx.strokeStyle='rgba(255,255,255,.55)';ctx.lineWidth=2;ctx.stroke();
  ctx.save();ctx.translate(R,R);ctx.rotate(a0+SEG*Math.PI/360);
  ctx.fillStyle='#fff';ctx.font='bold 15px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(p.t==='c'?String(p.v):(p.v==='rare'?'Редкая':'Эпик.'),R*.63,0);
  ctx.restore();
 });
 ctx.beginPath();ctx.arc(R,R,26,0,7);ctx.fillStyle='#0a1a3f';ctx.fill();
 ctx.strokeStyle='#ffd86b';ctx.lineWidth=3;ctx.stroke();
 ctx.font='bold 20px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('🎄',R,R+1);
}
function calcIndex(rotDeg){
 let a=(270-rotDeg)%360;if(a<0)a+=360;
 return Math.floor(a/SEG)%8;
}
function spinWheel(viaAd){
 if(wheelSpinning)return;
 if(viaAd){showAdRewarded(()=>doSpin());return}
 if(S.wheelFree<=0){toast('Бесплатные спины кончились — крутите за рекламу 📺');return}
 S.wheelFree--;save();doSpin();
}
function doSpin(){
 wheelSpinning=true;
 const target=rand(0,7);
 let fin=270-(target*SEG+SEG/2);
 fin=((fin%360)+360)%360+360*(3+rand(1,4));
 while(fin<=wheelAng)fin+=360;
 const start=wheelAng,t0=performance.now(),dur=3200;
 (function anim(now){
  const k=Math.min((now-t0)/dur,1),e=1-Math.pow(1-k,3);
  wheelAng=start+(fin-start)*e;drawWheel();
  if(k<1)requestAnimationFrame(anim);
  else{wheelAng=((wheelAng%360)+360)%360;wheelSpinning=false;wheelPrize(calcIndex(wheelAng));}
 })(performance.now());
}
function wheelPrize(i){
 const p=WHEEL[i];
 if(p.t==='c'){gain(p.v,'wheel');toast('🎡 Выпало: '+p.v+' 🌰');}
 else{const o=mkOrn(p.v);S.bag.push(o);toast('🎡 Выпало: '+o.emoji+' '+o.name+'!');}
 save();renderHeader();
}

/* ===================== САНИ ===================== */
let sledRaf=null;
function startSled(){
 stopSled();
 const cv=$('sledCv');if(!cv)return;
 const W=cv.width=Math.min(cv.clientWidth||360,460),H=cv.height=340;
 const ctx=cv.getContext('2d');
 let sledX=W/2,items=[],score=0,lives=3,elapsed=0,spawnT=0,flash=0,
     combo=0,comboT=0,magnet=0,shield=false,last=performance.now();
 const move=e=>{
  const r=cv.getBoundingClientRect();
  const x=e.touches?e.touches[0].clientX:e.clientX;
  if(x!==undefined)sledX=Math.max(30,Math.min(W-30,x-r.left));
  e.preventDefault&&e.preventDefault();
 };
 cv.onpointerdown=move;cv.onpointermove=move;
 function end(){
  cancelAnimationFrame(sledRaf);sledRaf=null;
  const rw=score*4;gain(rw,'sled');addXp(score*2);
  if(score>S.catchBest)S.catchBest=score;
  if(S.order&&S.order.t==='catch')progOrder(score);
  toast('🛷 Итог: '+score+' → +'+rw+' 🌰');
  renderGames();
 }
 function loop(now){
  const dt=Math.min(now-last,50);last=now;
  elapsed+=dt;spawnT+=dt;flash=Math.max(0,flash-dt);comboT=Math.max(0,comboT-dt);
  if(comboT<=0)combo=0;
  if(magnet>0)magnet-=dt;
  const prog=elapsed/50000,spd=1+prog*1.7;
  if(spawnT>Math.max(380,640-prog*200)&&items.length<12){spawnT=0;
   const r=Math.random();let v='gift';
   if(r>0.93)v='magnet';else if(r>0.89)v='shield';
   else if(r>0.76)v='ice';else if(r>0.56)v='cone';
   items.push({x:rand(24,W-24),y:-24,v,s:.07*spd+Math.random()*.05,ph:Math.random()*6});
  }
  ctx.fillStyle='#0b1c44';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(255,255,255,.6)';
  for(let i=0;i<10;i++){const y=(i*67+elapsed*.03)%H;ctx.fillRect((i*131)%W,y,2,2);}
  for(let i=0;i<items.length;i++){
   const it=items[i];it.y+=it.s*dt;
   if(magnet>0&&(it.v==='gift'||it.v==='cone')){
    const dx=sledX-it.x;it.x+=Math.sign(dx)*Math.min(Math.abs(dx),dt*.06);
   }
   ctx.font='26px serif';ctx.textAlign='center';
   ctx.fillText(it.v==='gift'?'🎁':it.v==='cone'?'🌰':it.v==='ice'?'🧊':it.v==='magnet'?'🧲':'🛡️',it.x,it.y);
   if(it.y>H-44&&Math.abs(it.x-sledX)<42){
    if(it.v==='ice'){
     if(shield){shield=false;it.y=H+99;}
     else{lives--;flash=200;combo=0;it.y=H+99;}
    }else if(it.v==='magnet'){magnet=6000;it.y=H+99;}
    else if(it.v==='shield'){shield=true;it.y=H+99;}
    else{score+=it.v==='gift'?2:1;combo++;comboT=2500;
     if(combo>5&&combo%6===0)score+=1;}
   }
  }
  items=items.filter(it=>it.y<H+40);
  ctx.font='34px serif';ctx.fillText('🛷',sledX,H-10);
  if(shield){ctx.strokeStyle='rgba(140,220,255,.8)';ctx.lineWidth=3;
   ctx.beginPath();ctx.arc(sledX,H-24,28,0,7);ctx.stroke();}
  if(flash>0){ctx.fillStyle='rgba(255,60,60,'+(flash/400)+')';ctx.fillRect(0,0,W,H);}
  ctx.fillStyle='#ffd86b';ctx.font='bold 15px sans-serif';ctx.textAlign='left';
  ctx.fillText('🎁 '+score+'   '+'❤️'.repeat(Math.max(lives,0))+'   ⏱ '+Math.ceil((50000-elapsed)/1000)+'с'+(magnet>0?' 🧲':'')+(shield?' 🛡️':''),10,22);
  if(lives<=0||elapsed>50000){end();return}
  sledRaf=requestAnimationFrame(loop);
 }
 sledRaf=requestAnimationFrame(loop);
}
function stopSled(){if(sledRaf){cancelAnimationFrame(sledRaf);sledRaf=null}}

/* ===================== СНЕЖКИ ===================== */
let ballRaf=null,ballTimer=null;
function startBalls(){
 stopBalls();
 const f=$('ballField');if(!f)return;
 f.innerHTML='<div id="ballInfo">❄️ 0 · ⏱ 25с</div>';
 let score=0,time=25,last=performance.now(),balls=[],id=0,acc=0;
 const info=$('ballInfo');
 const upd=()=>info.textContent='❄️ '+score+' · ⏱ '+time+'с';
 function spawn(){
  if(balls.length>=8)return;
  const r=Math.random();let v='snow';
  if(r>0.88)v='bomb';else if(r>0.84)v='freeze';else if(r>0.78)v='gold';
  const el=document.createElement('div');el.className='pop';
  el.textContent={snow:'❄️',bomb:'💣',freeze:'⏱️',gold:'⭐'}[v];
  const b={id:++id,v,x:rand(6,80),y:rand(10,70),vx:(Math.random()-0.5)*10,vy:rand(4,14),el};
  balls.push(b);el.style.left=b.x+'%';el.style.top=b.y+'%';
  el.onpointerdown=()=>{
   if(b.v==='bomb')score=Math.max(0,score-5);
   else if(b.v==='gold')score+=5;
   else if(b.v==='freeze')time+=2;
   else score+=2;
   balls=balls.filter(bb=>bb!==b);el.remove();upd();
  };
  f.appendChild(el);
  setTimeout(()=>{if(balls.includes(b)){balls=balls.filter(bb=>bb!==b);el.remove();}},2600);
 }
 ballRaf=requestAnimationFrame(function loop(now){
  const dt=Math.min(now-last,50);last=now;acc+=dt;
  if(acc>Math.max(450,650-(25-time)*10)){acc=0;spawn();}
  for(let i=0;i<balls.length;i++){
   const b=balls[i];
   b.x+=b.vx*dt/100;b.y+=b.vy*dt/100;
   if(b.x<2||b.x>88)b.vx*=-1;
   if(b.y<8)b.vy=Math.abs(b.vy);if(b.y>78)b.vy=-Math.abs(b.vy);
   b.el.style.left=b.x+'%';b.el.style.top=b.y+'%';
  }
  ballRaf=requestAnimationFrame(loop);
 });
 ballTimer=setInterval(()=>{time--;upd();
  if(time<=0){stopBalls();
   const rw=score*3;gain(rw,'balls');addXp(score*2);
   toast('⛄ Итог: '+score+' → +'+rw+' 🌰');
   renderGames();
  }},1000);
}
function stopBalls(){if(ballRaf){cancelAnimationFrame(ballRaf);ballRaf=null}
 if(ballTimer){clearInterval(ballTimer);ballTimer=null}}

let bossAtk=null;
const boss={on:false,hp:0,hpMax:0,php:100,time:45,shieldUntil:0,dead:false,combo:0,lastTap:0};
function startBoss(){
 stopBoss();
 boss.on=true;boss.dead=false;
 boss.hpMax=180+S.level*14;boss.hp=boss.hpMax;
 boss.php=100;boss.time=45;boss.shieldUntil=0;boss.combo=0;boss.lastTap=0;
 const box=$('bossBox');
 box.querySelectorAll('.icicle,.dmg').forEach(e=>e.remove());
 $('bossShield').style.display='none';
 bossAtk=setInterval(()=>{
  if(boss.dead)return;
  boss.time--;paint();
  if(boss.time%9===3)bossShieldOn();
  if(boss.time>0)spawnIcicle();
  if(boss.time<=0)bossEnd(false);
 },1000);
 paint();
}
function bossShieldOn(){
 boss.shieldUntil=Date.now()+3000;
 $('bossShield').style.display='block';$('bossShield').textContent='🛡️';
 setTimeout(()=>{if(boss.on&&!boss.dead)$('bossShield').style.display='none';},3000);
}
function spawnIcicle(){
 const box=$('bossBox');if(!box)return;
 const el=document.createElement('div');el.className='icicle';el.textContent='🧊';
 el.style.left=rand(12,86)+'%';el.style.top='-30px';
 requestAnimationFrame(()=>el.style.top='82%');
 el.onpointerdown=e=>{e.stopPropagation();el.remove();boss.time=Math.min(boss.time+2,45);paint();};
 el.addEventListener('transitionend',()=>{
  if(!el.isConnected||boss.dead)return;
  boss.php=Math.max(0,boss.php-10);el.remove();paint();
  if(boss.php<=0)bossEnd(false);
 });
 box.appendChild(el);
}
function bossTap(){
 if(!boss.on||boss.dead)return;
 if(Date.now()<boss.shieldUntil){toast('🛡️ Щит! Подождите');return}
 const now=Date.now();boss.combo=(now-boss.lastTap<700)?Math.min(boss.combo+1,12):1;boss.lastTap=now;
 let dmg=3+boss.combo;const crit=Math.random()<0.12;
 if(crit)dmg*=3;
 if(Date.now()<S.ghUntil)dmg*=2;
 boss.hp=Math.max(0,boss.hp-dmg);
 const el=document.createElement('div');el.className='dmg';
 el.textContent=crit?'💥'+dmg:'−'+dmg;
 el.style.color=crit?'#ffd86b':'#fff';
 el.style.left=(40+rand(0,25))+'%';el.style.top=(30+rand(0,20))+'%';
 el.style.fontSize=crit?'26px':'19px';
 const box=$('bossBox');if(box){box.appendChild(el);setTimeout(()=>el.remove(),900);}
 paint();
 if(boss.hp<=0)bossEnd(true);
}
function paint(){
 if(!$('bossHp'))return;
 $('bossHp').style.width=(100*boss.hp/boss.hpMax)+'%';
 $('bossPhp').style.width=boss.php+'%';
 $('bossInfo').textContent='❄️ Босс: '+Math.max(boss.hp,0)+' / '+boss.hpMax+'   🧑 Вы: '+Math.max(boss.php,0)+'   ⏱ '+boss.time+'с   🔗 x'+(1+Math.min(boss.combo,12));
}
function bossEnd(win){
 boss.dead=true;stopBoss();
 const box=$('bossBox');if(box)box.querySelectorAll('.icicle').forEach(e=>e.remove());
 if(win){
  const rw=600+S.level*25;gain(rw,'boss');addXp(130);S.bossWins++;
  toast('🏆 Босс повержен! +'+rw+' 🌰');
 }else toast('❄️ Босс выдержал… Тапайте быстрее и сбивайте 🧊!');
 renderGames();
}
function stopBoss(){if(bossAtk){clearInterval(bossAtk);bossAtk=null}boss.on=false;}

function renderHeader(){
 $('stCones').textContent='🌰 '+fmt(S.cones);

function branchPath(cx,yT,yB,w){
 let p='M '+cx+' '+yT+' L '+(cx+w)+' '+yB;
 const steps=6,ww=w*2;
 for(let k=0;k<steps;k++){
  p+=' L '+(cx+w-ww*(k+0.5)/steps)+' '+(yB-7)+' L '+(cx+w-ww*(k+1)/steps)+' '+yB;
 }
 p+=' Z';
 return p;
}

function garlandOnTree(type){
 const cols=GCOLORS[type]||GCOLORS.classic;
 const strands=[
  {x1:34,y1:24,x2:66,y2:24},
  {x1:24,y1:42,x2:76,y2:42},
  {x1:16,y1:60,x2:84,y2:60},
  {x1:10,y1:79,x2:90,y2:79}
 ];
 let h='';
 strands.forEach((s,si)=>{
  const n=9;
  for(let i=0;i<n;i++){
   const t=i/(n-1);
   const x=s.x1+(s.x2-s.x1)*t;
   const sag=Math.sin(t*Math.PI)*4.5;
   const y=s.y1+sag+2.5;
   const c=type==='rainbow'?cols[i%cols.length]:cols[(i+si)%cols.length];
   h+='<span class="tlight" style="left:'+x.toFixed(1)+'%;top:'+y.toFixed(1)+'%;color:'+c+';background:'+c+';animation-delay:'+((i*0.13+si*0.3)%1.5).toFixed(2)+'s"></span>';
  }
 });
 return h;
}
