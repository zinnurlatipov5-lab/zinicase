<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>АвтоКейсы</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f0f0f0;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }

        .page {
            background: #fff;
            padding: 24px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-shadow: 0 0 16px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }

        .btn {
            background: #fbbf24;
            color: #000;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 16px 0;
            transition: background 0.2s;
        }

        .btn:hover {
            background: #f8a300;
        }

        .btn-back {
            background: #aaa;
            color: #fff;
            padding: 16px 32px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 16px 0;
            transition: background 0.2s;
        }

        .btn-back:hover {
            background: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="page active" id="welcome">
            <h1>Добро пожаловать!</h1>
            <p>Приветствуем вас в мире автокейсов!</p>
            <button class="btn" onclick="switchToCases()">Открыть кейсы</button>
            <button class="btn-back" onclick="switchToMain()">← Главная</button>
        </div>

        <div class="page" id="cases">
            <h2>Ваши кейсы</h2>
            <button class="btn-back" onclick="switchToWelcome()">← Главная</button>
            <div class="cases-grid">
                <!-- Здесь будет логика отображения кейсов -->
                <button class="btn" onclick="openCase()">Открыть кейс</button>
            </div>
        </div>

        <div class="page" id="garage">
            <h2>Ваш гараж</h2>
            <button class="btn-back" onclick="switchToWelcome()">← Главная</button>
            <div id="garageGrid">
                <!-- Здесь будет логика отображения машин -->
            </div>
        </div>
    </div>

    <script>
        function switchToCases() {
            document.getElementById('welcome').classList.remove('active');
            document.getElementById('cases').classList.add('active');
        }

        function switchToWelcome() {
            document.getElementById('welcome').classList.add('active');
            document.getElementById('cases').classList.remove('active');
            document.getElementById('garage').classList.remove('active');
        }

        function switchToGarage() {
            document.getElementById('welcome').classList.remove('active');
            document.getElementById('cases').classList.remove('active');
            document.getElementById('garage').classList.add('active');
        }

        function openCase() {
            alert('Открываем кейс!'); // Здесь должна быть ваша логика открытия кейса
        }
    </script>
</body>
</html>
